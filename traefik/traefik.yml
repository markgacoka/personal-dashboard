global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: markgacoka@gmail.com
      storage: /var/www/app/acme.json
      httpChallenge:
        entryPoint: web

providers:
  file:
    filename: /var/www/app/traefik-dynamic.yml
    watch: true
