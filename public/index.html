// runways: [{le_ident, le_hdg, he_ident, he_hdg}] from OurAirports airport-detail
// bestHdg: magnetic heading of the preferred landing direction (or null)
function windCompassSvg(wdir, wspd, wgst, runways, bestHdg) {
  const R = 48, size = 120;
  const isCalm = !wspd || wspd < 2;
  const isVRB  = wdir === 'VRB' || wdir == null;

  // ── Tick marks ───────────────────────────────────────────────────────────────
  const ticks = Array.from({length:36}, (_, i) => {
    const a = i * 10 * Math.PI / 180;
    const o = R, inn = i%9===0 ? R-9 : i%3===0 ? R-5 : R-3;
    const sw = i%9===0 ? 1.5 : 0.8;
    return `<line x1="${+(Math.sin(a)*o).toFixed(2)}" y1="${+(-Math.cos(a)*o).toFixed(2)}" x2="${+(Math.sin(a)*inn).toFixed(2)}" y2="${+(-Math.cos(a)*inn).toFixed(2)}" stroke="var(--rule)" stroke-width="${sw}"/>`;
  }).join('');

  // ── Group parallel runways (same canonical heading ±10°) ─────────────────────
  const rwyList = runways || [];
  const assigned = new Set();
  const groups = [];
  for (let i = 0; i < rwyList.length; i++) {
    if (assigned.has(i)) continue;
    const rwy = rwyList[i];
    const canon = ((rwy.le_hdg - 1) % 180 + 180) % 180;
    const group = [{ rwy, i }];
    assigned.add(i);
    for (let j = i + 1; j < rwyList.length; j++) {
      if (assigned.has(j)) continue;
      const other = rwyList[j];
      const otherCanon = ((other.le_hdg - 1) % 180 + 180) % 180;
      const diff = Math.abs(canon - otherCanon);
      if (diff < 12 || diff > 168) { group.push({ rwy: other, i: j }); assigned.add(j); }
    }
    groups.push(group);
  }

  // ── Draw runway rectangles ───────────────────────────────────────────────────
  const rwyElems = [];
  for (const group of groups) {
    const n = group.length;
    group.forEach(({ rwy }, gi) => {
      const perpOff = n > 1 ? (gi - (n - 1) / 2) * 13 : 0;
      const drawHdg = rwy.he_hdg;   // rotate so top = he_end, bottom = le_end
      const rLen    = R - 7;
      const isBest  = (rwy.le_hdg === bestHdg || rwy.he_hdg === bestHdg);
      const fill    = isBest ? 'oklch(23% 0.07 80)'  : 'oklch(15% 0.02 95)';
      const stroke  = isBest ? 'oklch(58% 0.12 82)'  : 'oklch(30% 0.03 95)';
      const sw      = isBest ? 1.5 : 0.8;
      const heNum   = Math.round(rwy.he_hdg / 10).toString().padStart(2, '0');
      const leNum   = Math.round(rwy.le_hdg / 10).toString().padStart(2, '0');
      rwyElems.push(
        `<g transform="rotate(${drawHdg}) translate(${perpOff} 0)">` +
        `<rect x="-5" y="${-rLen}" width="10" height="${rLen*2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" rx="1.5"/>` +
        (isBest ? `<line x1="0" y1="${-rLen}" x2="0" y2="${rLen}" stroke="${stroke}" stroke-width="0.5" stroke-dasharray="4 3"/>` : '') +
        `<text y="${-rLen-5}" text-anchor="middle" fill="${stroke}" font-size="7" font-family="Albert Sans,sans-serif">${heNum}</text>` +
        `<text y="${rLen+12}" text-anchor="middle" fill="${stroke}" font-size="7" font-family="Albert Sans,sans-serif">${leNum}</text>` +
        `</g>`
      );
    });
  }

  // ── Wind indicator ───────────────────────────────────────────────────────────
  let windEl;
  if (isCalm) {
    windEl = `<circle r="6" fill="none" stroke="oklch(65% 0.14 145)" stroke-width="2"/>` +
             `<circle r="2.5" fill="oklch(65% 0.14 145)"/>`;
  } else if (isVRB) {
    windEl = [0,90,180,270].map(a =>
      `<g transform="rotate(${a})"><line x1="0" y1="18" x2="0" y2="-20" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/><polygon points="0,-26 -4,-19 4,-19" fill="var(--muted)"/></g>`
    ).join('');
  } else {
    windEl = `<g transform="rotate(${wdir})">` +
      `<line x1="0" y1="11" x2="0" y2="-31" stroke="white" stroke-width="2.5" stroke-linecap="round"/>` +
      `<polygon points="0,-40 -6,-29 6,-29" fill="white"/>` +
      (wgst ? `<circle r="4" cx="0" cy="15" fill="none" stroke="oklch(76% 0.13 75)" stroke-width="1.5"/>` : '') +
      `</g>`;
  }

  const spd = isCalm
    ? `<text text-anchor="middle" y="4" fill="oklch(65% 0.14 145)" font-size="9" font-family="Albert Sans,sans-serif">calm</text>`
    : `<text text-anchor="middle" y="3" fill="white" font-size="13" font-weight="700" font-family="Albert Sans,sans-serif">${wspd}</text>` +
      `<text text-anchor="middle" y="14" fill="var(--faint)" font-size="8" font-family="Albert Sans,sans-serif">kt${wgst ? ' G'+wgst : ''}</text>`;

  return `<svg width="${size}" height="${size}" viewBox="${-size/2} ${-size/2} ${size} ${size}" style="overflow:visible;flex-shrink:0">
    <circle r="${R}" fill="none" stroke="var(--rule)" stroke-width="1.5"/>
    ${ticks}
    <text text-anchor="middle" y="${-R-6}" fill="var(--muted)" font-size="9" font-family="Albert Sans,sans-serif">N</text>
    <text text-anchor="middle" y="${R+13}" fill="var(--muted)" font-size="9" font-family="Albert Sans,sans-serif">S</text>
    <text x="${-R-10}" y="4" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="Albert Sans,sans-serif">W</text>
    <text x="${R+10}" y="4" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="Albert Sans,sans-serif">E</text>
    ${rwyElems.join('')}
    <circle r="18" fill="oklch(9% 0.002 95 / 0.85)"/>
    ${windEl}
    ${spd}
  </svg>`;
}

function parseMetarObsTime(rawOb) {
  const m = rawOb?.match(/\b(\d{2})(\d{2})(\d{2})Z\b/);
  if (!m) return null;
  const now = new Date();
  const obs = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), +m[1], +m[2], +m[3]));
  if (obs > now) obs.setUTCMonth(obs.getUTCMonth()-1);
  return obs;
}

function renderWeatherCard(metar, airport, notamData, icao, detail) {
  const el = document.getElementById('weather-card');
  const runways = detail?.runways || [];

  // ── Airport header info ─────────────────────────────────────────────────────
  const aptName = airport?.name || icao;
  const aptCity = airport ? `${airport.city || ''}, ${airport.state || ''}`.replace(/^, |, $/g,'') : '';
  const aptElev = airport?.elev != null ? `${airport.elev} ft MSL` : '';
  const aptMeta = [aptCity, aptElev].filter(Boolean).join(' · ');

  if (!metar) {
    el.innerHTML = `
      <div class="ov-card-hd">${esc(icao)} Weather <button onclick="editHomeAirport()" style="font-size:11px;color:var(--faint);background:none;border:none;cursor:pointer;padding:0;font-family:inherit;margin-left:auto"><i class="ph-bold ph-pencil-simple"></i> edit</button></div>
      <div class="wx-header"><div class="wx-header-left"><div class="wx-airport">${esc(aptName)}</div><div class="wx-airport-meta">${esc(aptMeta)}</div></div></div>
      <div style="color:var(--faint);font-size:13px;padding:8px 0">Weather data unavailable</div>`;
    return;
  }

  // ── Parse METAR fields ──────────────────────────────────────────────────────
  const raw      = metar.rawOb || metar.raw || '';
  const cat      = (metar.fltcat||'').toUpperCase() || 'VFR';
  const wdir     = metar.wdir;
  const wspd     = metar.wspd || 0;
  const wgst     = metar.wgst || null;
  const vis      = metar.visib;
  const ceil     = metar.ceil;
  const temp     = metar.temp;
  const dewp     = metar.dewp;
  const altimHpa = metar.altim;
  const altimInhg = altimHpa ? (altimHpa / 33.8639).toFixed(2) : null;

  // Obs time from rawOb (AWC obsTime field is not a reliable ISO string)
  const obsDate = parseMetarObsTime(raw) || (metar.obsTime ? new Date(metar.obsTime) : null);
  let ageStr = '';
  if (obsDate && !isNaN(obsDate)) {
    const mins = Math.round((Date.now() - obsDate.getTime()) / 60000);
    ageStr = mins < 2 ? 'just now' : mins < 60 ? `${mins} min ago` : `${Math.round(mins/60)}h ago`;
  }

  // ── Best runway & wind components ──────────────────────────────────────────
  let xwind = null, headwind = null, bestRwyId = null, bestHdg = null;
  if (typeof wdir === 'number' && wspd && runways.length) {
    let bestScore = -Infinity;
    for (const rwy of runways) {
      for (const [hdg, ident] of [[rwy.le_hdg, rwy.le_ident], [rwy.he_hdg, rwy.he_ident]]) {
        if (!hdg) continue;
        const a   = ((wdir - hdg) % 360 + 360) % 360;
        const rad = a * Math.PI / 180;
        const hw  = Math.round(wspd * Math.cos(rad));
        const xw  = Math.round(Math.abs(wspd * Math.sin(rad)));
        const score = hw - xw * 0.5;
        if (score > bestScore) {
          bestScore = score; bestHdg = hdg; bestRwyId = ident; xwind = xw; headwind = hw;
        }
      }
    }
  } else if (typeof wdir === 'number' && wspd) {
    // No runway data — just report raw wind, no crosswind analysis
  }

  // ── Density altitude ────────────────────────────────────────────────────────
  let da = null;
  if (airport?.elev != null && altimHpa && temp != null) {
    const aIhg = altimHpa / 33.8639;
    const pa   = airport.elev + (29.92 - aIhg) * 1000;
    const isa  = 15 - 2 * (pa / 1000);
    da = Math.round(pa + 118.8 * (temp - isa));
  }

  // ── Go/No-Go verdict ────────────────────────────────────────────────────────
  const xwindHigh = xwind !== null && xwind > 10;
  const gusty     = wgst && wgst > 20;
  let verdict, verdictClass;
  if (cat === 'LIFR' || cat === 'IFR')            { verdict = 'NO-GO';   verdictClass = 'nogo'; }
  else if (cat === 'MVFR' || xwindHigh || gusty)  { verdict = 'CAUTION'; verdictClass = 'caut'; }
  else                                              { verdict = 'GO';     verdictClass = 'go';   }

  // ── Formatted strings ───────────────────────────────────────────────────────
  const windLine  = wdir === 'VRB'         ? `Variable ${wspd} kt`
                  : typeof wdir==='number' ? `${String(wdir).padStart(3,'0')}° at ${wspd} kt${wgst ? ` · gust ${wgst} kt` : ''}`
                  : wspd === 0             ? 'Calm' : '—';
  const xwindLine = xwind !== null
    ? `${xwind} kt crosswind${bestRwyId ? ` (rwy ${bestRwyId})` : ''} · ${Math.abs(headwind)} kt ${headwind>=0?'headwind':'tailwind'}`
    : '';
  const visLine    = vis ? (String(vis)==='10+'?'10+ SM':`${vis} SM`) : '—';
  const ceilLine   = ceil ? `${ceil.toLocaleString()} ft AGL` : cat === 'VFR' ? 'Clear / Unlimited' : '—';
  const spreadVal  = temp != null && dewp != null ? temp - dewp : null;
  const spreadLine = spreadVal != null
    ? `${temp}° / ${dewp}° C · ${spreadVal}° spread${spreadVal <= 3 ? ' · fog risk' : ''}` : '—';
  const altLine    = altimInhg ? `${altimInhg} inHg (${Math.round(altimHpa)} hPa)` : '—';
  const daLine     = da != null
    ? `${(da - (airport?.elev||0)) >= 0 ? '+' : ''}${(da - (airport?.elev||0)).toLocaleString()} ft above field (${da.toLocaleString()} ft)` : '—';

  // ── Runway summary for the airport column ───────────────────────────────────
  const rwyRows = runways.map(rwy => {
    const isBest = rwy.le_hdg === bestHdg || rwy.he_hdg === bestHdg;
    const rwyName = `${rwy.le_ident}/${rwy.he_ident}`;
    const rwyLen  = rwy.length_ft ? `${rwy.length_ft.toLocaleString()} ft` : '';
    const rwyInfo = [rwyLen, rwy.surface?.split('-')[0]].filter(Boolean).join(' · ');
    return `<div class="wx-row" style="${isBest?'color:oklch(66% 0.10 82)':''}">` +
      `<span class="wx-lbl" style="${isBest?'color:oklch(58% 0.10 82)':''}">Rwy ${esc(rwyName)}</span>` +
      `<span class="wx-val" style="font-size:12px">${rwyInfo || '—'}${isBest?' ←':''}</span></div>`;
  }).join('');

  // ── Radio frequencies (priority: ATIS/AWOS, then TWR/CTAF, then GND) ───────
  const freqOrder = ['ATIS','AWOS','ASOS','A/G','TWR','CTAF','GND','APP','DEP','CLD'];
  const shownFreqs = (detail?.frequencies || [])
    .filter(f => freqOrder.includes(f.type))
    .sort((a,b) => freqOrder.indexOf(a.type) - freqOrder.indexOf(b.type))
    .slice(0, 5);
  const freqRows = shownFreqs.map(f =>
    `<div class="wx-row"><span class="wx-lbl">${esc(f.type)}</span>` +
    `<span class="wx-val" style="font-size:12px;font-variant-numeric:tabular-nums">${esc(f.freq_mhz)} MHz</span></div>`
  ).join('');

  // ── NOTAM count badge ────────────────────────────────────────────────────────
  const nCount = notamData?.count || 0;
  const nBadge = nCount > 0 ? `<span class="wx-notam-count">${nCount}</span>` : '';

  // ── Compass SVG (multi-runway) ───────────────────────────────────────────────
  const compass = windCompassSvg(wdir, wspd, wgst, runways, bestHdg);

  el.innerHTML = `
    <div class="ov-card-hd" style="display:flex;align-items:center">
      <span>Airport Brief</span>
      <button onclick="editHomeAirport()" style="font-size:11px;color:var(--faint);background:none;border:none;cursor:pointer;padding:0;font-family:inherit;margin-left:auto;letter-spacing:0;text-transform:none"><i class="ph-bold ph-pencil-simple"></i> ${esc(icao)}</button>
    </div>

    <div class="wx-header">
      <div class="wx-header-left">
        <div class="wx-airport">${esc(aptName)}</div>
        <div class="wx-airport-meta">${esc(aptMeta)}</div>
        <div class="wx-pills">
          <span class="wx-verdict ${verdictClass}"><i class="ph-bold ph-${verdict==='GO'?'check-circle':verdict==='CAUTION'?'warning-circle':'x-circle'}"></i> ${verdict}</span>
          <span class="wx-cat-pill ${cat}">${cat}</span>
          ${ageStr?`<span class="wx-age">obs ${ageStr}</span>`:''}
        </div>
      </div>
    </div>

    <div class="wx-body">
      <!-- Column 1: Multi-runway wind compass -->
      <div class="wx-col" style="display:flex;flex-direction:column;align-items:center;gap:10px">
        ${compass}
        <div style="text-align:center;line-height:1.5">
          <div style="font-size:12px;color:var(--body-text)">${windLine}</div>
          ${xwindLine?`<div class="wx-sub">${xwindLine}</div>`:''}
        </div>
      </div>

      <!-- Column 2: Sky conditions -->
      <div class="wx-col">
        <div class="wx-col-title">Conditions</div>
        <div class="wx-row"><span class="wx-lbl">Ceiling</span><span class="wx-val">${ceilLine}</span></div>
        <div class="wx-row"><span class="wx-lbl">Visibility</span><span class="wx-val">${visLine}</span></div>
        <div class="wx-row"><span class="wx-lbl">Temp / DP</span><span class="wx-val">${spreadLine}</span></div>
        <div class="wx-row"><span class="wx-lbl">Altimeter</span><span class="wx-val">${altLine}</span></div>
        <div class="wx-row"><span class="wx-lbl">Density Alt</span><span class="wx-val">${daLine}</span></div>
      </div>

      <!-- Column 3: Airport info (runways + frequencies + links) -->
      <div class="wx-col">
        <div class="wx-col-title">Airport</div>
        ${airport?.elev!=null?`<div class="wx-row"><span class="wx-lbl">Elevation</span><span class="wx-val">${airport.elev} ft MSL</span></div>`:''}
        ${rwyRows}
        ${freqRows ? `<div class="wx-col-title" style="margin-top:10px">Radio</div>${freqRows}` : ''}
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
          <a class="wx-footer-link" style="padding:0;border:none" href="https://notams.aim.faa.gov/notamSearch/nsapp.html#/" target="_blank" rel="noopener">
            <i class="ph-bold ph-warning"></i> NOTAMs ${nBadge}
          </a>
          <a class="wx-footer-link" style="padding:0;border:none" href="https://tfr.faa.gov/tfr2/list.jsp" target="_blank" rel="noopener">
            <i class="ph-bold ph-airplane"></i> TFRs
          </a>
          <a class="wx-footer-link" style="padding:0;border:none" href="https://www.airnav.com/airport/${esc(icao)}" target="_blank" rel="noopener">
            <i class="ph-bold ph-info"></i> AirNav
          </a>
          <a class="wx-footer-link" style="padding:0;border:none" href="https://aviationweather.gov/taf/board?ids=${esc(icao)}" target="_blank" rel="noopener">
            <i class="ph-bold ph-cloud"></i> TAF
          </a>
        </div>
      </div>
    </div>

    ${raw?`<div class="wx-footer"><div class="wx-raw">${esc(raw)}</div></div>`:''}
  `;
}

function editHomeAirport() {
  const cur = localStorage.getItem('home-airport') || 'KRHV';
  const val = prompt('Home airport ICAO (3–4 characters):', cur);
  if (val && /^[A-Za-z0-9]{3,4}$/.test(val.trim())) {
    localStorage.setItem('home-airport', val.trim().toUpperCase());
    loadWeatherWidget();
  }
}

// ─── flight currency ──────────────────────────────────────────────────────────
function renderFlightCurrency(flights) {
  const el = document.getElementById('currency-card');
  if (!flights || !flights.length) {
    el.innerHTML = `<div class="ov-card-hd">FAA Currency</div><div style="color:var(--faint);font-size:13px;padding:8px 0">No flight data</div>`;
    return;
  }

  const now = Date.now();
  const d90  = 90  * 86400000;
  const d24mo = 730 * 86400000; // ~24 calendar months

  // Sum T/O + landings in a time window
  function sumIn(ms, toField, lndField) {
    return flights
      .filter(f => now - new Date(f.date+'T12:00:00').getTime() < ms)
      .reduce((acc,f) => ({
        to:  acc.to  + (f[toField]||0),
        lnd: acc.lnd + (f[lndField]||0),
      }), {to:0, lnd:0});
  }

  const day90   = sumIn(d90, 'day_takeoffs', 'day_landings_full_stop');
  // Fallback: if no ForeFlight-style fields, use generic takeoffs/landings
  const dayTO   = day90.to  || sumIn(d90, 'takeoffs', 'landings').to;
  const dayLnd  = day90.lnd || sumIn(d90, 'takeoffs', 'landings').lnd;
  const dayCur  = dayTO>=3 && dayLnd>=3;

  const ngt90   = sumIn(d90, 'night_takeoffs', 'night_landings_full_stop');
  const ngtTO   = ngt90.to;
  const ngtLnd  = ngt90.lnd;
  const ngtCur  = ngtTO>=3 && ngtLnd>=3;

  const lastBFR = flights
    .filter(f => f.flight_review)
    .sort((a,b) => new Date(b.date)-new Date(a.date))[0];
  const bfrAge  = lastBFR ? now - new Date(lastBFR.date+'T12:00:00').getTime() : null;
  const bfrCur  = bfrAge!==null && bfrAge < d24mo;
  const bfrDays = bfrAge!==null ? Math.floor((d24mo - bfrAge)/86400000) : null;

  // Days until day currency lapses (when 3rd most recent T/O falls out of 90d window)
  function daysToLapse(flts, toF, lndF) {
    // Collect individual T/O events by date, sorted newest first
    const ops = [];
    for (const f of flts) {
      const n = (f[toF]||0) + (f[lndF]||0);
      if (n > 0) ops.push({ date: new Date(f.date+'T12:00:00').getTime(), n });
    }
    ops.sort((a,b) => b.date-a.date);
    let cum=0;
    for (const op of ops) {
      cum += op.n;
      if (cum >= 6) { // 3 T/O + 3 landings = at minimum 6 ops
        return Math.floor((op.date + d90 - now) / 86400000);
      }
    }
    return null;
  }

  const dayDays = dayCur ? daysToLapse(flights,'day_takeoffs','day_landings_full_stop') : null;

  function getBadgeStyle(type) {
    const light = document.documentElement.getAttribute('data-theme') === 'light';
    if (type === 'expiring') return light ? 'background:#fef5e4;color:#8a6010' : 'background:#271f0b;color:#c09030';
    if (type === 'current')  return light ? 'background:#e8f5ee;color:#237a50' : 'background:#0e2222;color:#3d9494';
    return light ? 'background:#fde8e8;color:#b03030' : 'background:#221414;color:#cc5050';
  }

  function row(name, current, daysLeft, detail) {
    let dotColor, badgeStyle, badgeText;
    if (current && daysLeft!==null && daysLeft<=15) {
      dotColor='#b08030'; badgeStyle=getBadgeStyle('expiring'); badgeText=`exp in ${daysLeft}d`;
    } else if (current) {
      dotColor='#3d9494'; badgeStyle=getBadgeStyle('current'); badgeText='current';
    } else {
      dotColor='#b05050'; badgeStyle=getBadgeStyle('lapsed'); badgeText='lapsed';
    }
    return `<div class="cur-row">
      <div class="cur-dot" style="background:${dotColor}"></div>
      <div class="cur-name">${name}</div>
      <span class="cur-badge" style="${badgeStyle}">${badgeText}</span>
      ${detail?`<div class="cur-days">${detail}</div>`:''}
    </div>`;
  }

  const dayDetail  = dayCur  ? (dayDays!==null?`${dayDays}d`:'') : `${dayTO} T/O · ${dayLnd} lnd`;
  const ngtDetail  = ngtCur  ? '' : `${ngtTO} T/O · ${ngtLnd} lnd`;
  const bfrDetail  = bfrDays!==null ? (bfrCur?`${bfrDays}d`:`${-bfrDays}d ago`) : 'none logged';

  el.innerHTML = `
    <div class="ov-card-hd">FAA Currency <span style="font-size:10px;color:var(--faint);font-weight:400;letter-spacing:0;text-transform:none">§61.57</span></div>
    <div class="cur-rows">
      ${row('Day VFR', dayCur, dayDays, dayDetail)}
      ${row('Night VFR', ngtCur, null, ngtDetail)}
      ${row('Flight Review', bfrCur, bfrDays!==null&&bfrDays<60?bfrDays:null, bfrDetail)}
    </div>
    <div style="margin-top:12px;font-size:11px;color:var(--faint)">Based on ${flights.length} logged flight${flights.length!==1?'s':''}</div>
  `;
}

// ─── charts ───────────────────────────────────────────────────────────────────
function buildVolumeChart(activities) {
  const cfg = getChartCfg();
  const days = {}, cutoff = Date.now() - 30*86400000;
  for (const a of activities) {
    const ts = new Date(a.startTimeLocal||0).getTime();
    const dur = (a.movingDuration || a.duration || 0) / 3600;
    if (ts < cutoff || dur <= 0) continue;
    const day = new Date(ts).toISOString().slice(0,10);
    if (!days[day]) days[day] = { running:0, cycling:0, swimming:0, rowing:0, other:0 };
    days[day][normSport(a.activityType?.typeKey)] += dur;
  }
  const sorted = Object.keys(days).sort();
  const step = Math.max(1, Math.floor(sorted.length / 6));
  const labels = sorted.map((d,i) => i%step===0 ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '');
  const sports = ['running','cycling','swimming','rowing','other'].filter(sp => sorted.some(d => days[d][sp] > 0));
  _cjsRender(document.getElementById('chart-volume'), {
    type: 'bar',
    data: {
      labels,
      datasets: sports.map(sp => ({
        label: SPORT_CFG[sp].label,
        data: sorted.map(d => parseFloat((days[d][sp]||0).toFixed(2))),
        backgroundColor: SPORT_CFG[sp].color + 'c8',
        borderRadius: 2,
        maxBarThickness: 22,
        stack: 'vol',
      }))
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: cfg.legendClr, font: CJ_FONT, boxWidth: 8, boxHeight: 8, padding: 10, usePointStyle: true, pointStyle: 'circle' } },
        tooltip: { ...cfg.tt, callbacks: {
          label: c => c.raw > 0 ? `${c.dataset.label}: ${c.raw.toFixed(1)} hr` : null,
          footer: items => { const t = items.reduce((s,c)=>s+c.raw,0); return t > 0 ? `Total: ${t.toFixed(1)} hr` : null; },
        }},
      },
      scales: { x: cfg.scaleX, y: { ...cfg.scaleY, stacked: true, ticks: { ...cfg.scaleY.ticks, callback: v => v.toFixed(1) } } },
    }
  });
}

function buildLoadChart(activities) {
  const cfg = getChartCfg();
  const cutoff = Date.now() - 30*86400000;
  const dayMap = {};
  for (const a of activities) {
    const ts = new Date(a.startTimeLocal).getTime();
    if (ts < cutoff || !a.activityTrainingLoad) continue;
    const day = new Date(ts).toISOString().slice(0,10);
    if (!dayMap[day]) dayMap[day] = { load: 0, sport: 'other', topLoad: 0 };
    dayMap[day].load += a.activityTrainingLoad;
    if (a.activityTrainingLoad > dayMap[day].topLoad) {
      dayMap[day].topLoad = a.activityTrainingLoad;
      dayMap[day].sport = normSport(a.activityType?.typeKey);
    }
  }
  const sorted = Object.keys(dayMap).sort();
  const loads  = sorted.map(d => Math.round(dayMap[d].load));
  const colors = sorted.map(d => SPORT_CFG[dayMap[d].sport].color + 'c8');
  const step   = Math.max(1, Math.floor(sorted.length / 6));
  const labels = sorted.map((d,i) => i%step===0 ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '');
  const avg7   = loads.map((_,i) => { const sl=loads.slice(Math.max(0,i-6),i+1); return Math.round(sl.reduce((s,v)=>s+v,0)/sl.length); });
  _cjsRender(document.getElementById('chart-load'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Load', data: loads, backgroundColor: colors, borderRadius: 3, maxBarThickness: 22, order: 2 },
        { label: '7d avg', data: avg7, type: 'line', borderColor: cfg.tickColor, borderWidth: 1.5,
          borderDash: [3,3], pointRadius: 0, fill: false, order: 1, tension: 0.3 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { ...cfg.tt, callbacks: { label: c => c.dataset.label === '7d avg' ? `7d avg: ${c.raw}` : `Load: ${c.raw}` } } },
      scales: { x: cfg.scaleX, y: cfg.scaleY },
    }
  });
}

function buildHRChart(activities) {
  const cfg = getChartCfg();
  const cutoff = Date.now() - 7*86400000;
  const dayMap = {};
  for (const a of activities) {
    const ts = new Date(a.startTimeLocal).getTime();
    if (ts < cutoff || !a.averageHR) continue;
    const day = new Date(ts).toISOString().slice(0,10);
    if (!dayMap[day]) dayMap[day] = { avgHRs: [], maxHR: 0 };
    dayMap[day].avgHRs.push(a.averageHR);
    dayMap[day].maxHR = Math.max(dayMap[day].maxHR, a.maxHR||0);
  }
  const sorted = Object.keys(dayMap).sort();
  const labels = sorted.map(d => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
  const avgHRs = sorted.map(d => Math.round(dayMap[d].avgHRs.reduce((s,v)=>s+v,0)/dayMap[d].avgHRs.length));
  const maxHRs = sorted.map(d => dayMap[d].maxHR || null);
  _cjsRender(document.getElementById('chart-hr'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Avg HR', data: avgHRs,
          borderColor: '#b85e7a', fill: false, borderWidth: 2, tension: 0.3,
          pointRadius: 4, pointBackgroundColor: '#b85e7a', pointBorderWidth: 0, pointHoverRadius: 6 },
        { label: 'Max HR', data: maxHRs,
          borderColor: '#c99c3a', fill: false, borderWidth: 1.5,
          borderDash: [4,3], tension: 0.3, pointRadius: 2, pointBackgroundColor: '#c99c3a', pointBorderWidth: 0 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: cfg.legendClr, font: CJ_FONT, boxWidth: 8, boxHeight: 8, padding: 10, usePointStyle: true, pointStyle: 'line' } },
        tooltip: { ...cfg.tt, callbacks: { label: c => c.raw !== null ? `${c.dataset.label}: ${c.raw} bpm` : null } },
      },
      scales: { x: cfg.scaleX, y: cfg.scaleY },
    }
  });
}

function buildZonesChart(activities) {
  const cfg = getChartCfg();
  document.getElementById('zones-label').textContent = '· last 7d';
  const cutoff = Date.now() - 7*86400000;
  const zoneMins = [0, 0, 0, 0, 0];
  let hasData = false;
  const arr = Array.isArray(activities) ? activities : (activities ? [activities] : []);
  for (const a of arr) {
    const ts = new Date(a.startTimeLocal||0).getTime();
    if (ts < cutoff) continue;
    for (let i = 0; i < 5; i++) {
      const secs = a['hrTimeInZone_'+(i+1)] || 0;
      zoneMins[i] += Math.round(secs / 60);
      if (secs > 0) hasData = true;
    }
  }
  const el = document.getElementById('chart-zones');
  if (!hasData) { el.style.height = 'auto'; el.textContent = 'No zone data'; return; }
  _cjsRender(el, {
    type: 'bar',
    data: {
      labels: HR_ZONES.map(z => z.name),
      datasets: [{ label: 'Minutes', data: zoneMins,
        backgroundColor: HR_ZONES.map(z => z.color + 'c8'), borderRadius: 3, maxBarThickness: 18 }]
    },
    options: {
      indexAxis: 'y',
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { ...cfg.tt, callbacks: {
        label: c => { const m = c.raw; return m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m`; }
      }}},
      scales: {
        x: { ...cfg.scaleY, ticks: { ...cfg.scaleY.ticks, callback: v => v >= 60 ? Math.floor(v/60)+'h' : v+'m' } },
        y: { ...cfg.scaleX, ticks: { ...cfg.scaleX.ticks, font: { ...CJ_FONT, size: 10 } } },
      },
    }
  }, 160);
}

async function showActivityDetail(id) {
  const a = window._acts?.[id];
  if (!a) { navigate('activities'); return; }

  const sport = normSport(a.activityType?.typeKey);
  const { color, icon, label } = SPORT_CFG[sport];

  showView('activity-detail', {
    back: 'activities',
    title: a.activityName || label,
  });

  const content = document.getElementById('activity-detail-content');
  const heroKpis = [
    a.distance > 0 ? { label:'Distance', val: fmtDist(a.distance), color } : null,
    (a.movingDuration||a.duration) > 0 ? { label:'Duration', val: fmtTime(a.movingDuration||a.duration), color: 'var(--champagne)' } : null,
    a.averageSpeed > 0 ? { label: sport==='cycling'?'Speed':'Pace', val: fmtSpeed(a.averageSpeed, sport), color:'var(--champagne)' } : null,
    a.averageHR > 0 ? { label:'Avg HR', val: a.averageHR+' bpm', color:'oklch(65% 0.15 350)' } : null,
  ].filter(Boolean);

  content.innerHTML = `
    <div class="detail-header">
      <div class="detail-sport-chip">
        <i class="ph-bold ${icon}" style="color:${color};font-size:13px"></i>
        ${label}
        <span style="color:var(--rule-strong)">·</span>
        ${fmtDateLong(a.startTimeLocal)}
      </div>
      <div class="detail-title">${esc(a.activityName||label)}</div>
      <div class="hero-kpis">
        ${heroKpis.map(k => `<div class="hero-kpi">
          <div class="label">${k.label}</div>
          <div class="val" style="color:${k.color}">${esc(k.val)}</div>
        </div>`).join('')}
      </div>
    </div>
    <div id="act-detail-body">
      <div style="display:flex;align-items:center;gap:8px;color:var(--muted)"><div class="spinner"></div> Loading…</div>

  try {
    const detail = await fetch('/api/activities/' + id).then(r => r.json());

function buildActivityDetailHTML(a, detail) {
  const sport  = normSport(a.activityType?.typeKey);
  const s      = detail.summaryDTO || {};
  const splits = (detail.splitSummaries || []).filter(sp => sp.distance > 0 || sp.duration > 0);
  const meta   = detail.metadataDTO || {};
  const bbDiff = s.differenceBodyBattery ?? a.differenceBodyBattery;

  const metrics = [
    ['Avg HR',        a.averageHR ? Math.round(a.averageHR)+' bpm' : null,      'oklch(65% 0.15 350)'],
    ['Max HR',        a.maxHR ? Math.round(a.maxHR)+' bpm' : null,              'oklch(72% 0.17 55)'],
    ['Min HR',        s.minHR ? Math.round(s.minHR)+' bpm' : null,              'oklch(68% 0.15 235)'],
    ['Avg Power',     (s.averagePower||a.avgPower) ? Math.round(s.averagePower||a.avgPower)+' W' : null, 'oklch(80% 0.17 85)'],
    ['Norm Power',    (s.normalizedPower||a.normPower) ? Math.round(s.normalizedPower||a.normPower)+' W' : null, 'oklch(80% 0.17 85)'],

    <div class="section-label" style="margin-bottom:12px">Training Effect</div>

          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }

  const descHTML = a.description ? `<hr class="detail-rule"><div class="desc-block">${esc(a.description)}</div>` : '';

  return metricsHTML + teHTML + zonesHTML + splitsHTML + descHTML;
}

async function initFlightDetailMap(f) {
  const container = document.getElementById('fd-map');
  if (!container) return;

  const mapStyle = document.documentElement.getAttribute('data-theme') === 'light'
    ? 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json'
    : 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
  _fdMap = new maplibregl.Map({
    container: 'fd-map',
    style: mapStyle,
    center: [f.departure?.lon || -122.0, f.departure?.lat || 37.5],
    zoom: 8,
    attributionControl: false,
  });
  _fdMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  _fdMap.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  _fdMap.on('load', async () => {
    let coords = [];
    if (f.has_track) {
      try {
        const pts = await fetch('/api/flights/' + f.id + '/track').then(r => r.ok ? r.json() : []);
        coords = pts.map(p => [p.lon, p.lat]);
      } catch(_) {}
    }
    if (coords.length < 2) {
      if (f.departure?.lon) coords.push([f.departure.lon, f.departure.lat]);
      if (f.via_airports) for (const a of f.via_airports) { if (a.lon) coords.push([a.lon, a.lat]); }
      if (f.arrival?.lon)  coords.push([f.arrival.lon,  f.arrival.lat]);
    }

    if (coords.length >= 2) {
      _fdMap.addSource('route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } },
      });
      _fdMap.addLayer({ id:'route-glow', type:'line', source:'route',
        paint: { 'line-color': typeColor(f.training_type), 'line-width': 6, 'line-opacity': 0.2, 'line-blur': 4 } });
      _fdMap.addLayer({ id:'route-line', type:'line', source:'route',
        paint: { 'line-color': typeColor(f.training_type), 'line-width': 2.5, 'line-opacity': 0.9 } });

      const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      _fdMap.fitBounds(bounds, { padding: 56, duration: 600 });
    }

    const apts = [];
    if (f.departure?.lon) apts.push(f.departure);
    if (f.via_airports)   f.via_airports.filter(a=>a.lon).forEach(a => apts.push(a));
    if (f.arrival?.lon)   apts.push(f.arrival);

    if (apts.length) {
      _fdMap.addSource('apts', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: apts.map(a => ({
          type: 'Feature',
          properties: { icao: a.icao, name: a.name },
          geometry: { type: 'Point', coordinates: [a.lon, a.lat] },
        })) },
      });
      _fdMap.addLayer({ id:'apts-dot', type:'circle', source:'apts',
        paint: { 'circle-radius': 5, 'circle-color': 'oklch(84% 0.19 80.46)', 'circle-stroke-width': 2, 'circle-stroke-color': 'oklch(4% 0.004 95)' } });
      _fdMap.addLayer({ id:'apts-lbl', type:'symbol', source:'apts',
        layout: { 'text-field': ['get','icao'], 'text-size': 11, 'text-offset': [0, 1.5], 'text-anchor': 'top', 'text-font':['Noto Sans Regular'] },
        paint:  { 'text-color': 'oklch(84% 0.19 80.46)', 'text-halo-color': 'oklch(4% 0.004 95)', 'text-halo-width': 1.5 } });

      _fdMap.on('click', 'apts-dot', e => {
        const p = e.features[0].properties;
        new maplibregl.Popup({ offset: 10, closeButton: false })
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(`<strong>${p.icao}</strong>${p.name?'<br>'+p.name:''}`)
          .addTo(_fdMap);
      });
      _fdMap.on('mouseenter', 'apts-dot', () => _fdMap.getCanvas().style.cursor = 'pointer');
      _fdMap.on('mouseleave', 'apts-dot', () => _fdMap.getCanvas().style.cursor = '');
    }
  });
}

// ─── row-level delete (logbook list) ─────────────────────────────────────────
function rowConfirmDelete(id) {
  const area = document.getElementById('ra-' + id);
  if (!area) return;
  area.style.opacity = '1';
  area.innerHTML = `
    <div class="row-confirm">
      <span class="row-confirm-label">Delete?</span>
      <button class="row-btn danger" title="Confirm delete"
        onclick="event.stopPropagation();rowDoDelete('${id}',this)">
        <i class="ph-bold ph-check"></i>
      </button>
      <button class="row-btn" title="Cancel"
        onclick="event.stopPropagation();renderFlights(window._flights)">
        <i class="ph-bold ph-x"></i>
      </button>
    </div>`;
}

async function rowDoDelete(id, btn) {
  btn.disabled = true;
  try {
    const res = await fetch('/api/flights/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error('Delete failed');
    window._flights = (window._flights || []).filter(f => String(f.id) !== String(id));
    await loadFlights();
  } catch(e) {
    renderFlights(window._flights); // reset row
  }
}

// ─── flight delete ────────────────────────────────────────────────────────────
function confirmDeleteFlight(id) {
  const area = document.getElementById('flight-action-area');
  if (!area) return;
  area.innerHTML = `
    <span style="font-size:13px;color:var(--warn)">Delete this flight?</span>
    <button class="btn-ghost" onclick="deleteFlight(${id})"
      style="font-size:12px;padding:6px 12px;color:var(--warn);border-color:var(--warn)">
      <i class="ph-bold ph-trash"></i> Yes, delete
    </button>
    <button class="btn-ghost" onclick="showFlightDetail(${id})"
      style="font-size:12px;padding:6px 12px">Cancel</button>
  `;
}

async function deleteFlight(id) {
  try {
    const res = await fetch('/api/flights/' + id, { method: 'DELETE' });
    if (!res.ok) throw new Error('Delete failed');
    window._flights = (window._flights || []).filter(f => String(f.id) !== String(id));
    renderFlights(window._flights);
    navigate('logbook');
    loadFlights().catch(() => {});
  } catch(err) {
    const area = document.getElementById('flight-action-area');
    if (area) area.innerHTML = `<span style="color:var(--warn);font-size:13px">${esc(err.message)}</span>`;
  }
}

// ─── log flight form ──────────────────────────────────────────────────────────
async function showLogFlightView(editId) {
  const isEdit = !!editId;
  const existingFlight = isEdit ? (window._flights || []).find(f => String(f.id) === String(editId)) : null;

  showView('log-flight', { back: 'logbook', title: isEdit ? 'Edit Flight' : 'Log Flight' });
  const content = document.getElementById('log-flight-content');
  content.innerHTML = '<div style="padding:40px;text-align:center"><div class="spinner"></div></div>';

  let aircraft = [], instructors = [];
  try {
    [aircraft, instructors] = await Promise.all([
      fetch('/api/aircraft').then(r => r.ok ? r.json() : []),
      fetch('/api/instructors').then(r => r.ok ? r.json() : []),
    ]);
  } catch(_) {}

  content.innerHTML = buildFlightFormHTML(aircraft, instructors, isEdit ? editId : null);
  document.getElementById('flight-form').addEventListener('submit', handleFlightSubmit);
  document.getElementById('add-approach-btn').addEventListener('click', addApproachRow);

  if (existingFlight) {
    populateFlightForm(existingFlight, instructors);
  } else {
    document.getElementById('ff-date').value = new Date().toISOString().slice(0, 10);
  }
}

    <label class="form-label" for="${id}">${label}</label>

}
function intField(id, name, label) {
  return `<div class="form-field">
    <label class="form-label" for="${id}">${label}</label>
    <input class="form-input" type="number" id="${id}" name="${name}" step="1" min="0" placeholder="0">

}

function populateFlightForm(f, instructors) {
  const set = (name, val) => {
    const el = document.querySelector(`[name="${name}"]`);
    if (el && val != null && val !== '') el.value = val;
  };
  // Date comes as "2026-05-10", input[type=date] wants "YYYY-MM-DD"
  set('date', f.date);
  set('aircraft_id', f.aircraft?.id);
  set('departure_icao', f.departure?.icao || '');
  set('arrival_icao', f.arrival?.icao || '');
  set('via', (f.via || []).join(', '));
  set('training_type', f.training_type);

  // Match instructor by id (now returned by API)
  if (f.instructor_id) set('instructor_id', f.instructor_id);

  // Time fields
  ['total_duration','dual_received','dual_given','pic','sic','solo',
   'cross_country','night','actual_instrument','instrument'].forEach(name => {
    const v = f[name] || f['simulated_instrument' === name ? 'simulated_instrument' : name];
    // instrument column is returned as simulated_instrument in the API
    const apiKey = name === 'instrument' ? 'simulated_instrument' : name;
    if (f[apiKey] > 0) set(name, parseFloat(f[apiKey]).toFixed(1));
  });

  // Operations
  ['takeoffs','landings','night_takeoffs','night_landings','holds'].forEach(name => {
    if (f[name] > 0) set(name, f[name]);
  });
  if (f.distance_nm) set('distance_nm', f.distance_nm);

  // Hobbs/Tach — expand section if values present
  if (f.hobbs_start || f.hobbs_end || f.tach_start || f.tach_end) {
    const fields = document.getElementById('hobbs-fields');
    const icon = document.getElementById('hobbs-toggle-icon');
    if (fields) fields.style.display = 'grid';
    if (icon) icon.textContent = '▾ collapse';
    set('hobbs_start', f.hobbs_start);
    set('hobbs_end', f.hobbs_end);
    set('tach_start', f.tach_start);
    set('tach_end', f.tach_end);
  }

  // Remarks
  if (f.remarks) set('remarks', f.remarks);

  // Approaches
  for (const ap of f.approaches || []) {
    const row = addApproachRow();
    row.querySelector('.ap-type').value = ap.approach_type || '';
    row.querySelector('.ap-icao').value = ap.airport_icao || '';
    row.querySelector('.ap-rwy').value = ap.runway || '';
    row.querySelector('.ap-ctl').checked = !!ap.circle_to_land;
  }
}

async function handleFlightSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const submitBtn = document.getElementById('ff-submit');
  const errEl = document.getElementById('flight-form-error');
  errEl.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<div class="spinner" style="width:14px;height:14px;margin-right:6px"></div> Saving…';

  const viaRaw = form.via.value.trim();
  const via = viaRaw ? viaRaw.split(',').map(s => s.trim().toUpperCase()).filter(Boolean) : [];

  const approaches = Array.from(document.querySelectorAll('.approach-row')).map(row => ({
    approach_type: row.querySelector('.ap-type').value,
    airport_icao: row.querySelector('.ap-icao').value.trim().toUpperCase(),
    runway: row.querySelector('.ap-rwy').value.trim(),
    circle_to_land: row.querySelector('.ap-ctl').checked,
  })).filter(a => a.approach_type && a.airport_icao);

  const g = name => {
    const el = form.querySelector(`[name="${name}"]`);
    return el ? el.value : '';
  };
  const fv = name => parseFloat(g(name)) || 0;
  const iv = name => parseInt(g(name)) || 0;
  const sv = name => { const v = g(name).trim(); return v || null; };

  const body = {
    date: g('date'),
    aircraft_id: parseInt(g('aircraft_id')),
    departure_icao: g('departure_icao').toUpperCase(),
    arrival_icao: g('arrival_icao').toUpperCase(),
    via,
    training_type: g('training_type') || null,
    total_duration: fv('total_duration'),
    dual_received: fv('dual_received'),
    dual_given: fv('dual_given'),
    pic: fv('pic'),
    sic: fv('sic'),
    solo: fv('solo'),
    cross_country: fv('cross_country'),
    night: fv('night'),
    actual_instrument: fv('actual_instrument'),
    instrument: fv('instrument'),
    takeoffs: iv('takeoffs'),
    landings: iv('landings'),
    night_takeoffs: iv('night_takeoffs'),
    night_landings: iv('night_landings'),
    holds: iv('holds'),
    distance_nm: sv('distance_nm') ? parseFloat(sv('distance_nm')) : null,
    hobbs_start: sv('hobbs_start') ? parseFloat(sv('hobbs_start')) : null,
    hobbs_end: sv('hobbs_end') ? parseFloat(sv('hobbs_end')) : null,
    tach_start: sv('tach_start') ? parseFloat(sv('tach_start')) : null,
    tach_end: sv('tach_end') ? parseFloat(sv('tach_end')) : null,
    instructor_id: sv('instructor_id') ? parseInt(sv('instructor_id')) : null,
    remarks: sv('remarks'),
    approaches,
  };

  const editFlightId = g('edit_flight_id');
  const isEdit = !!editFlightId;
  const url = isEdit ? `/api/flights/${editFlightId}` : '/api/flights';
  const method = isEdit ? 'PUT' : 'POST';
  const btnLabel = isEdit ? 'Save Changes' : 'Log Flight';

  try {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      throw new Error(d.error || `Server error ${res.status}`);
    }
    await loadFlights();
    if (isEdit) {
      navigate('flight', editFlightId);
    } else {
      navigate('logbook');
    }
  } catch(err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.innerHTML = `<i class="ph-bold ph-paper-plane-tilt"></i> ${btnLabel}`;
  }
}

// ─── flight modal ─────────────────────────────────────────────────────────────
const _m = { step:0, editId:null, aircraft:null, date:null, dep:null, previewMap:null };

function openFlightModal(editId = null) {
  _m.editId = editId ? String(editId) : null;
  _m.aircraft = null; _m.date = null; _m.dep = null;
  if (_m.previewMap) { try{_m.previewMap.remove();}catch(_){} _m.previewMap=null; }
  document.getElementById('flight-modal-overlay').style.display = 'flex';
  document.getElementById('modal-title').textContent = editId ? 'Edit Flight' : 'Log Flight';
  if (editId) {
    const f = (window._flights||[]).find(f=>String(f.id)===String(editId));
    if (f) { _m.aircraft = f.aircraft; _m.date = f.date; _m.dep = f.departure?.icao||''; }
    showModalSteps(3);
    renderModalStep3(f || null);
  } else {
    showModalSteps(0);
    renderModalStep1();
  }
}

function closeFlightModal() {
  document.getElementById('flight-modal-overlay').style.display = 'none';
  if (_m.previewMap) { try{_m.previewMap.remove();}catch(_){} _m.previewMap=null; }
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeFlightModal(); });

function showModalSteps(active) {
  const el = document.getElementById('modal-steps');
  el.style.display = active > 0 ? 'flex' : 'none';
  [1,2,3].forEach(i => {
    const t = document.getElementById('mstab-'+i);
    if (!t) return;
    t.className = 'ms-tab' + (i===active?' active':i<active?' done':'');
  });
  if (active > 0) {
    document.getElementById('mstab-1').onclick = active>1 ? ()=>renderModalStep1() : null;
    document.getElementById('mstab-2').onclick = active>2 ? ()=>renderModalStep2FromCache() : null;
  }
}

  const tail = document.getElementById('ms-tail')?.value?.trim();

let _tailCache = {};
async function onTailLookup(tail) {
  if (!tail || tail.length < 3) {
    _m.aircraft = null;
    document.getElementById('ms-ac-card').innerHTML = '';
    updateStep1Btn();
    return;
  }
  const status = document.getElementById('ms-tail-status');
  if (!status) return;
  status.innerHTML = '<span class="spinner" style="width:10px;height:10px;vertical-align:middle;display:inline-block"></span>';

  if (_tailCache[tail]) {
    _m.aircraft = _tailCache[tail];
    status.textContent = '✓'; status.style.color = 'var(--run)';
    renderAircraftEnrichCard(_m.aircraft);
    updateStep1Btn(); return;
  }

  // 1. Internal DB
  const allAc = await fetch('/api/aircraft').then(r=>r.ok?r.json():[]).catch(()=>[]);
  const found = allAc.find(a=>a.tail_number.toUpperCase()===tail);
  if (found) {
    _m.aircraft = _tailCache[tail] = found;
    status.textContent = '✓ in logbook'; status.style.color = 'var(--run)';
    renderAircraftEnrichCard(found);
    updateStep1Btn();
    // Background: enrich with mode_s_hex + performance if not already stored
    if (!found.mode_s_hex) {
      fetch('/api/external/aircraft/'+encodeURIComponent(tail))
        .then(r=>r.ok?r.json():null).then(reg => {
          if (!reg?.mode_s_hex) return;
          _m.aircraft.mode_s_hex = reg.mode_s_hex;
          _m.aircraft.performance = reg.performance || null;
          _m.aircraft.photo_url   = _m.aircraft.photo_url || reg.photo_url || null;
          _tailCache[tail] = _m.aircraft;
        }).catch(()=>{});
    }
    return;
  }

  // 2. FAA registry + adsbdb via proxy
  status.textContent = 'Searching FAA registry…'; status.style.color = 'var(--faint)';
  try {
    const reg = await fetch('/api/external/aircraft/'+encodeURIComponent(tail)).then(r=>r.ok?r.json():null).catch(()=>null);
    if (reg && reg.make) {
      const ac = {
        id: null, tail_number: tail, _fromReg: true,
        make: reg.make,
        model: reg.model,
        year: reg.year || null,
        engine_type: reg.engine_type || null,
        engine_hp: null,
        seats: reg.seats || null,
        ifr_equipped: null,
        glass_cockpit: null,
        type_code: reg.type_code || null,
        category: reg.category || 'Airplane',
        aircraft_class: reg.aircraft_class || 'ASEL',
        gear_type: reg.gear_type || 'fixed_tricycle',
        is_complex: reg.is_complex || false,
        is_high_performance: reg.is_high_performance || false,
        is_pressurized: false,
        mode_s_hex: reg.mode_s_hex || null,
        owner: reg.owner || null,
        photo_url: reg.photo_url || null,
        status: reg.status || null,
        _sources: reg.sources || [],
      };
      _m.aircraft = _tailCache[tail] = ac;
      const srcLabel = ac._sources.includes('faa_html') ? '✓ FAA registry' : '✓ found';
      status.textContent = srcLabel; status.style.color = 'oklch(65% 0.16 145)';
      renderAircraftEnrichCard(ac, true);
    } else {
      status.textContent = 'Not found in registry'; status.style.color = 'var(--faint)';
      document.getElementById('ms-ac-card').innerHTML =
        `<div style="font-size:12px;color:var(--faint);padding:10px 0">Not found. You can still continue and fill all fields manually.</div>`;
      _m.aircraft = { id:null, tail_number:tail, make:'', model:'', _unknown:true };
    }
  } catch(_) {
    status.textContent = ''; _m.aircraft = null;
  }
  updateStep1Btn();
}

function renderAircraftEnrichCard(ac, fromReg = false) {
  const card = document.getElementById('ms-ac-card');
  if (!card) return;
  const specs = [
    ac.engine_type && ['Engine', ac.engine_type + (ac.engine_hp ? ' · ' + ac.engine_hp + ' HP' : '')],
    ac.seats       && ['Seats',  ac.seats],
    ac.type_code   && ['ICAO Type', ac.type_code],
    ac.aircraft_class && ['Class', ac.aircraft_class],
    ac.gear_type   && ['Gear', ac.gear_type.replace(/_/g,' ')],
    ac.is_complex  && ['Complex', 'Yes'],
    ac.ifr_equipped != null && ['IFR', ac.ifr_equipped ? 'Equipped' : 'VFR only'],
    ac.glass_cockpit && ['Avionics', 'Glass cockpit'],
    ac.owner       && ['Owner', ac.owner],
    ac.status      && ac.status !== 'Valid' && ['Status', ac.status],
  ].filter(Boolean);

  const srcBadge = fromReg
    ? `<span style="font-size:10px;font-weight:400;color:var(--faint);margin-left:6px">
         ${(ac._sources||[]).join(' + ') || 'FAA registry'}
       </span>`
    : '';
  const unknownBadge = ac._unknown
    ? `<span style="font-size:10px;font-weight:400;color:var(--warn);margin-left:6px">specs unknown</span>`
    : '';

  const photoHtml = ac.photo_url
    ? `<img src="${esc(ac.photo_url)}" alt="Aircraft photo" style="max-width:100%;border-radius:4px;margin-top:8px;opacity:0.85">`
    : '';

  card.innerHTML = `
    <div class="ac-enrich">
      <div class="ac-enrich-title">
        <i class="ph-bold ph-airplane-tilt" style="color:var(--patina-text)"></i>
        ${esc(ac.tail_number)}${ac.make && ac.model ? ' — ' + esc(ac.make) + ' ' + esc(ac.model) : ''}${ac.year ? ' ' + ac.year : ''}
        ${srcBadge}${unknownBadge}
      </div>
      ${specs.length ? `<div class="ac-enrich-specs">${specs.map(([k,v]) => `<div><span class="ac-spec-k">${k}</span> <span class="ac-spec-v">${esc(String(v))}</span></div>`).join('')}</div>` : ''}
      ${photoHtml}
      ${fromReg && !ac.id ? `<div style="margin-top:10px">
        <button class="btn-link" onclick="addAircraftToDB()">
          <i class="ph-bold ph-plus-circle"></i> Add to my aircraft list
        </button>
        <span style="font-size:11px;color:var(--faint);margin-left:8px">HP, IFR, glass cockpit — fill in the form</span>
      </div>` : ''}
    </div>`;
}

async function addAircraftToDB() {
  if (!_m.aircraft || _m.aircraft.id) return;
  const ac = _m.aircraft;
  try {
    const res = await fetch('/api/aircraft', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        tail_number:       ac.tail_number,
        make:              ac.make || 'Unknown',
        model:             ac.model || 'Unknown',
        year:              ac.year || null,
        engine_type:       ac.engine_type || null,
        engine_hp:         ac.engine_hp || null,
        seats:             ac.seats || null,
        ifr_equipped:      ac.ifr_equipped || false,
        glass_cockpit:     ac.glass_cockpit || false,
        type_code:         ac.type_code || null,
        category:          ac.category || 'Airplane',
        aircraft_class:    ac.aircraft_class || 'ASEL',
        gear_type:         ac.gear_type || 'fixed_tricycle',
        is_complex:        ac.is_complex || false,
        is_high_performance: ac.is_high_performance || false,
        mode_s_hex:        ac.mode_s_hex || null,
        notes: ac.owner ? `Owner: ${ac.owner}` : null,
      }),
    });
    if (!res.ok) throw new Error();
    const created = await res.json();
    _m.aircraft = _tailCache[ac.tail_number] = created;
    const status = document.getElementById('ms-tail-status');
    if (status) { status.textContent = '✓ added to logbook'; status.style.color = 'var(--run)'; }
    renderAircraftEnrichCard(created);
    updateStep1Btn();
  } catch(_) {}
}

async function onStep1Continue() {
  _m.date = document.getElementById('ms-date').value;
  _m.dep  = document.getElementById('ms-dep').value.trim().toUpperCase();
  const tail     = (_m.aircraft?.tail_number||'').toUpperCase();
  const modeS    = _m.aircraft?.mode_s_hex || null;

  // Fetch logbook entries + OpenSky detected flights in parallel
  const dbPromise = (tail && _m.date && _m.dep)
    ? fetch('/api/flights?'+new URLSearchParams({ date:_m.date, departure:_m.dep, tail })).then(r=>r.ok?r.json():[]).catch(()=>[])
    : Promise.resolve([]);

  const oskyPromise = (modeS && _m.date && _m.dep)
    ? fetch('/api/external/flights-detected?'+new URLSearchParams({ departure:_m.dep, date:_m.date, icao24:modeS })).then(r=>r.ok?r.json():{flights:[]}).catch(()=>({flights:[]}))
    : Promise.resolve({flights:[]});

  const [dbFlights, oskyResult] = await Promise.all([dbPromise, oskyPromise]);

  _m._matches   = Array.isArray(dbFlights) ? dbFlights : [];
  _m._detected  = oskyResult.flights || [];
  _m._oskyAuth  = oskyResult.needs_auth || false;

  renderModalStep2(_m._matches, _m._detected);
}

// Step 2 ──────────────────────────────────────────────────────────────────────
function renderModalStep2FromCache() { renderModalStep2(_m._matches||[], _m._detected||[]); }

function renderModalStep2(flights, detected = []) {
  _m.step = 2; showModalSteps(2);
  document.getElementById('modal-ft').style.display = 'none';
  if (_m.previewMap) { try{_m.previewMap.remove();}catch(_){} _m.previewMap=null; }

  const dateLabel = new Date(_m.date+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const tail = _m.aircraft?.tail_number || '';

  // Logbook entries (already in DB)
  const dbHTML = flights.map(f => {
    const col = typeColor(f.training_type);
    return `<div class="fpl-item" data-fid="${f.id}" data-src="db">
      <span class="fl-type-dot" style="background:${col}"></span>
      <div style="flex:1;min-width:0">
        <div class="fpl-route">${esc(routeLabel(f))}</div>
        <div class="fpl-meta">${esc(typeLabel(f.training_type))} · ${fmtHrs(f.total_duration)} · ${f.takeoffs||0} T/O · ${f.landings||0} Lnd</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:13px;font-weight:500;color:var(--body-text)">${fmtHrs(f.total_duration)}</div>
        <div style="font-size:11px;color:var(--faint)">in logbook</div>
      </div>
    </div>`;
  }).join('');

  // OpenSky-detected flights not already in DB (filter by arrival icao to avoid dupes)
  const dbArrivals = new Set(flights.map(f=>f.arrival_icao));
  const newDetected = detected.filter(d => !dbArrivals.has(d.arrival_icao));
  const detectedHTML = newDetected.map((d, i) => {
    const dep = d.departure_time ? new Date(d.departure_time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/Los_Angeles'}) : '';
    const dur = d.duration_min != null ? `${Math.floor(d.duration_min/60)}h ${d.duration_min%60}m` : '';
    const arr = d.arrival_icao || 'Unknown arrival';
    return `<div class="fpl-item fpl-detected" data-did="${i}" data-src="osky"
              onclick="onOskyFlightSelected(${JSON.stringify(JSON.stringify(d)).slice(1,-1)})">
      <span class="fl-type-dot" style="background:var(--patina-text)"></span>
      <div style="flex:1;min-width:0">
        <div class="fpl-route">${esc(_m.dep)} → ${esc(arr)}</div>
        <div class="fpl-meta">ADS-B detected${dep?' · '+dep+' local':''} ${dur?'· '+dur:''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:11px;color:var(--patina-text);font-weight:500">Import</div>
        <div style="font-size:10px;color:var(--faint)">OpenSky</div>
      </div>
    </div>`;
  }).join('');

  const hasAny = flights.length > 0 || newDetected.length > 0;
  const oskyNote = _m._oskyAuth
    ? `<div style="margin-top:12px;padding:10px 12px;background:var(--graphite);border-radius:6px;font-size:11px;color:var(--faint)">
         <i class="ph-bold ph-info"></i>
         Add <code>OPENSKY_CLIENT_ID</code> and <code>OPENSKY_CLIENT_SECRET</code> to your .env for historical ADS-B flight detection.
         Get credentials at <a href="https://opensky-network.org" target="_blank" style="color:var(--patina-text)">opensky-network.org</a> → My OpenSky → API Access
       </div>`
    : (newDetected.length > 0 ? `<div style="font-size:11px;color:var(--faint);margin-top:8px;padding:0 4px"><i class="ph-bold ph-broadcast"></i> ADS-B routes detected via OpenSky Network — click to import</div>` : '');

  document.getElementById('modal-bd').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
      <button class="btn-link" onclick="renderModalStep1()" style="font-size:13px">
        <i class="ph-bold ph-caret-left"></i> Back
      </button>
      <div style="font-size:13px;color:var(--muted)">
        ${esc(tail)} from <strong style="color:var(--champagne)">${esc(_m.dep)}</strong>
        on <strong style="color:var(--champagne)">${esc(dateLabel)}</strong>
      </div>
    </div>
    ${hasAny ? `
      ${flights.length ? `<div id="modal-preview-map"></div>` : ''}
      <div class="fpl">
        ${dbHTML}
        ${detectedHTML}
        <div class="fpl-new" onclick="onModalNewFlight()">
          <i class="ph-bold ph-plus-circle"></i> Log a new flight on this date
        </div>
      </div>
      ${oskyNote}` :
    `<div style="padding:24px 0 16px;text-align:center">
       <i class="ph-bold ph-airplane-landing" style="font-size:36px;color:var(--faint);display:block;margin-bottom:12px"></i>
       <div style="color:var(--muted);font-size:13px">No existing entries found for this aircraft on ${esc(dateLabel)}.</div>
     </div>
     ${oskyNote}
     <button class="btn-primary" style="margin-top:16px" onclick="onModalNewFlight()">
       <i class="ph-bold ph-plus"></i> Log this flight
     </button>`
    }`;

  if (flights.length) {
    requestAnimationFrame(() => initPreviewMap(flights));
    document.querySelectorAll('.fpl-item[data-src="db"]').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.fpl-item').forEach(i=>i.classList.remove('sel'));
        item.classList.add('sel');
        const fid = item.dataset.fid;
        const f = flights.find(x=>String(x.id)===fid);
        if (f) { highlightRoute(String(f.id)); onModalFlightSelected(f); }
      });
      item.addEventListener('mouseenter', () => highlightRoute(item.dataset.fid));
      item.addEventListener('mouseleave', () => highlightRoute(null));
    });
  }
}

async function onOskyFlightSelected(detectedJson) {
  const d = JSON.parse(detectedJson);
  document.querySelectorAll('.fpl-item').forEach(i=>i.classList.remove('sel'));
  document.querySelector(`.fpl-detected[data-did="${d._idx||0}"]`)?.classList.add('sel');

  // Fetch GPS track in background
  if (d.icao24 && d.first_seen_unix) {
    fetch(`/api/external/flight-track?icao24=${encodeURIComponent(d.icao24)}&time=${d.first_seen_unix}`)
      .then(r=>r.ok?r.json():null)
      .then(tr => { if (tr?.track?.path?.length) _m._oskyTrack = tr.track; })
      .catch(()=>{});
  }

  // Pre-populate Step 3 as a new flight with detected values
  _m.editId = null;
  _m._oskyDetected = d;
  document.getElementById('modal-title').textContent = 'Log Detected Flight';
  renderModalStep3(null, d);
}

function initPreviewMap(flights) {
  const container = document.getElementById('modal-preview-map');
  if (!container || _m.previewMap) return;
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  _m.previewMap = new maplibregl.Map({
    container: 'modal-preview-map', zoom: 8, attributionControl: false,
    style: dark
      ? 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
      : 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [flights[0]?.departure?.lon||-122, flights[0]?.departure?.lat||37.5],
  });
  _m.previewMap.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');
  _m.previewMap.on('load', () => {
    const allCoords = [];
    flights.forEach(f => {
      const coords = flightCoords(f);
      if (coords.length < 2) return;
      allCoords.push(...coords);
      const col = typeColor(f.training_type);
      _m.previewMap.addSource('fl'+f.id, { type:'geojson', data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}} });
      _m.previewMap.addLayer({ id:'fl'+f.id+'g', type:'line', source:'fl'+f.id, paint:{'line-color':col,'line-width':6,'line-opacity':0.15,'line-blur':4} });
      _m.previewMap.addLayer({ id:'fl'+f.id, type:'line', source:'fl'+f.id, paint:{'line-color':col,'line-width':2,'line-opacity':0.75,'line-dasharray':[2,0]} });
    });
    const aptSet = {}, aptFeats = [];
    flights.forEach(f => {
      [f.departure,...(f.via_airports||[]),f.arrival].forEach(a => {
        if (a?.lon && !aptSet[a.icao]) { aptSet[a.icao]=1; aptFeats.push({type:'Feature',properties:{icao:a.icao},geometry:{type:'Point',coordinates:[a.lon,a.lat]}}); }
      });
    });
    if (aptFeats.length) {
      _m.previewMap.addSource('pmapts',{type:'geojson',data:{type:'FeatureCollection',features:aptFeats}});
      _m.previewMap.addLayer({id:'pmapts',type:'circle',source:'pmapts',paint:{'circle-radius':5,'circle-color':'oklch(84% 0.19 80.46)','circle-stroke-width':1.5,'circle-stroke-color':'oklch(4% 0.004 95)'}});
    }
    if (allCoords.length) {
      const b = allCoords.reduce((b,c)=>b.extend(c), new maplibregl.LngLatBounds(allCoords[0],allCoords[0]));
      _m.previewMap.fitBounds(b, {padding:40,duration:400});
    }
  });
}

function flightCoords(f) {
  const c = [];
  if (f.departure?.lon) c.push([f.departure.lon, f.departure.lat]);
  (f.via_airports||[]).forEach(a => { if(a?.lon) c.push([a.lon,a.lat]); });
  if (f.arrival?.lon) c.push([f.arrival.lon, f.arrival.lat]);
  return c;
}

function highlightRoute(activeId) {
  if (!_m.previewMap || !_m._matches) return;
  _m._matches.forEach(f => {
    const lid = 'fl'+f.id, gid = lid+'g';
    if (!_m.previewMap.getLayer(lid)) return;
    const isActive = activeId === null || String(f.id) === String(activeId);
    _m.previewMap.setPaintProperty(lid,'line-width', isActive ? 3 : 1.5);
    _m.previewMap.setPaintProperty(lid,'line-opacity', isActive ? 1 : 0.3);
    _m.previewMap.setPaintProperty(gid,'line-opacity', isActive ? 0.25 : 0.05);
  });
}

function onModalNewFlight() { _m.editId = null; document.getElementById('modal-title').textContent='Log Flight'; renderModalStep3(null); }
function onModalFlightSelected(f) { _m.editId = String(f.id); document.getElementById('modal-title').textContent='Edit Flight'; renderModalStep3(f); }

      </div>
      <div class="form-field">
        <label class="form-label">Aircraft</label>
        <select class="form-select" name="aircraft_id" required>
          <option value="">Select…</option>${acOpts}
        </select>
      </div>
      <div class="form-field">
        <label class="form-label">Departure</label>
        <input class="form-input" type="text" name="departure_icao" placeholder="KSQL"
          value="${existing?.departure?.icao||detected?.departure_icao||_m.dep||''}" maxlength="6" style="text-transform:uppercase"
          id="mf-dep" oninput="onMFRouteChange()">
      </div>
      <div class="form-field">
        <label class="form-label">Training Type</label>
        <select class="form-select" name="training_type"><option value="">—</option>${typeOpts}</select>
      </div>
    </div>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0">
      <div class="form-field">
        <label class="form-label">Via Airports <span style="font-weight:400;text-transform:none;letter-spacing:0">(comma-sep)</span></label>
        <input class="form-input" type="text" name="via" placeholder="KHAF, KPAO"

      </div>
      <div class="form-field">
        <label class="form-label">Arrival</label>
        <input class="form-input" type="text" name="arrival_icao" placeholder="KWVI"
          value="${existing?.arrival?.icao||(detected?.arrival_icao||'')}" maxlength="6" style="text-transform:uppercase"
          id="mf-arr" oninput="onMFRouteChange()">
      </div>
    </div>
    ${detected ? `<div style="margin-top:8px;padding:8px 12px;background:var(--graphite);border-radius:6px;font-size:11px;color:var(--patina-text)">
      <i class="ph-bold ph-broadcast"></i>
      ADS-B detected via OpenSky · Dep ${detected.departure_time ? new Date(detected.departure_time).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',timeZone:'America/Los_Angeles'})+' local' : ''}${detected.duration_min?' · '+Math.floor(detected.duration_min/60)+'h '+detected.duration_min%60+'m':''}

    <!-- Airport info cards (async) -->

      ${mfNum('night','Night')}
      ${mfNum('actual_instrument','Actual IFR')}
      ${mfNum('instrument','Sim Inst')}
    </div>
