global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
          # Lowest priority, so a specific plain-HTTP route (the mail server's
          # ACME challenge path) wins; everything else still redirects to HTTPS.
          priority: 1
  websecure:
    address: ":443"
    # Sites behind Cloudflare's proxy (flightpad.io): accept the visitor's
    # address from Cloudflare's own servers only (www.cloudflare.com/ips).
    forwardedHeaders:
      trustedIPs:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"

certificatesResolvers:
  letsencrypt:
    acme:
      email: markgacoka@gmail.com
      storage: /acme.json
      # TLS-ALPN on :443, so the plain-HTTP challenge path on :80 stays free
      # for the mail server's own certificate (mail.gacoka.com, see docs/mail.md).
      tlsChallenge: {}

  # DNS-01 through Cloudflare's API, for domains whose DNS is at Cloudflare and
  # whose traffic goes through its proxy (the TLS challenge can't reach us
  # through the proxy). Needs CF_DNS_API_TOKEN (Zone → DNS → Edit) in
  # /var/www/app/.env; a site opts in with certresolver=cloudflare.
  cloudflare:
    acme:
      email: markgacoka@gmail.com
      storage: /acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

providers:
  docker:
    exposedByDefault: false
    network: web
