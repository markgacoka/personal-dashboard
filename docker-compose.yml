networks:
  web:
    name: web

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - /var/www/app/acme.json:/acme.json
    networks:
      - web

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - /var/www/app/.env
    volumes:
      - /var/www/app/garmin-session:/data/garmin-session
      - /var/www/app/data:/app/data
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`gacoka.com`) || Host(`www.gacoka.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
      # https://mail.gacoka.com opens the webmail in the dashboard.
      - "traefik.http.routers.mail-web.rule=Host(`mail.gacoka.com`)"
      - "traefik.http.routers.mail-web.entrypoints=websecure"
      - "traefik.http.routers.mail-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mail-web.middlewares=to-webmail"
      - "traefik.http.routers.mail-web.service=app"
      - "traefik.http.middlewares.to-webmail.redirectregex.regex=^https://mail\\.gacoka\\.com/.*"
      - "traefik.http.middlewares.to-webmail.redirectregex.replacement=https://gacoka.com/#mail"
    depends_on:
      traefik:
        condition: service_started
      postgres:
        condition: service_healthy

  # Mail server for @gacoka.com (docs/mail.md). The dashboard reaches it over
  # this network at http://stalwart:8080 (JMAP); port 8080 is never published.
  # Public: 25 (incoming mail), 465 (sending from mail apps), 993 (IMAP).
  # Outgoing mail relays through Resend; Stalwart reads the relay password
  # from MAIL_RELAY_SECRET. STALWART_RECOVERY_ADMIN is only used during first setup.
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "993:993"
    environment:
      MAIL_RELAY_SECRET: ${MAIL_RELAY_SECRET:-}
      STALWART_RECOVERY_ADMIN: admin:${MAIL_ADMIN_PASSWORD:-}
    volumes:
      - /var/www/app/mail/etc:/etc/stalwart
      - /var/www/app/mail/data:/var/lib/stalwart
    networks:
      - web
    labels:
      # Let's Encrypt HTTP-01 for mail.gacoka.com: only the challenge path is
      # routed to Stalwart (plain HTTP, port 80). Its admin UI stays private.
      - "traefik.enable=true"
      - "traefik.http.routers.mail-acme.rule=Host(`mail.gacoka.com`) && PathPrefix(`/.well-known/acme-challenge/`)"
      - "traefik.http.routers.mail-acme.entrypoints=web"
      - "traefik.http.routers.mail-acme.service=mail-acme"
      - "traefik.http.services.mail-acme.loadbalancer.server.port=8080"

  # Run on demand to (re-)authenticate with Garmin via headless Chromium.
  # Chromium's real TLS fingerprint bypasses Cloudflare's bot detection on Garmin's SSO.
  # Tokens are saved to the shared garmin-session volume and reused by the api service.
  #
  # Usage:  docker compose --profile auth run --rm garmin-auth
  garmin-auth:
    profiles: ["auth"]
    build:
      context: .
      dockerfile: api/Dockerfile.auth
    env_file:
      - /var/www/app/.env
    volumes:
      - /var/www/app/garmin-session:/data/garmin-session
    networks:
      - web
