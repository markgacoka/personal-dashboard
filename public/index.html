<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gacoka — Athlete Dashboard</title>

  <!-- DaisyUI v4 component styles + CSS vars -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <!-- Tailwind CDN v3 — scans DOM and generates utility classes -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Icons -->
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
  <!-- React 18 -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Recharts (depends on React) -->
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.13.0/umd/Recharts.min.js"></script>
  <!-- Babel — transpiles JSX at runtime -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

  <style>
    /* Recharts text uses DaisyUI base-content colour */
    .recharts-text { font-size: 11px; }
    .recharts-cartesian-grid-horizontal line,
    .recharts-cartesian-grid-vertical line { stroke-opacity: 0.08; }
    .activity-row { cursor: pointer; transition: background 0.12s; }
    .activity-row:hover { background: rgba(255,255,255,0.04); }
    [data-theme="light"] .activity-row:hover { background: rgba(0,0,0,0.04); }
    .zone-bar { height: 6px; border-radius: 3px; transition: width 0.4s ease; }
    /* Fix Tailwind CDN occasionally conflicting with DaisyUI btn */
    .btn { text-transform: none; }
  </style>
</head>
<body class="bg-base-100 min-h-screen">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;
const {
  AreaChart, Area, BarChart, Bar, LineChart, Line,
  XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, Cell
} = window.Recharts;

// ─── constants ───────────────────────────────────────────────────────────────
const M_TO_MI = 0.000621371;

const SPORT = {
  running:  { color: '#4ade80', icon: 'ph-person-simple-run' },
  cycling:  { color: '#facc15', icon: 'ph-bicycle' },
  swimming: { color: '#38bdf8', icon: 'ph-waves' },
  rowing:   { color: '#f472b6', icon: 'ph-rowing' },
  other:    { color: '#a78bfa', icon: 'ph-activity' },
};

const HR_ZONES = [
  { name: 'Z1 Recovery',  color: '#38bdf8' },
  { name: 'Z2 Base',      color: '#4ade80' },
  { name: 'Z3 Tempo',     color: '#facc15' },
  { name: 'Z4 Threshold', color: '#fb923c' },
  { name: 'Z5 VO2Max',    color: '#f87171' },
];

const SPLIT_META = {
  INTERVAL_WARMUP:   { label: 'Warmup',   color: '#4ade80' },
  INTERVAL_ACTIVE:   { label: 'Active',   color: '#f87171' },
  INTERVAL_RECOVERY: { label: 'Recovery', color: '#38bdf8' },
  INTERVAL_COOLDOWN: { label: 'Cooldown', color: '#818cf8' },
  RWD_RUN:           { label: 'Run',      color: '#4ade80' },
  RWD_STAND:         { label: 'Stand',    color: '#6b7280' },
  RWD_WALK:          { label: 'Walk',     color: '#a78bfa' },
};

// ─── formatters ──────────────────────────────────────────────────────────────
const fmtMi = m => (m * M_TO_MI).toFixed(2) + ' mi';
const fmtDist = m => !m ? '—' : m * M_TO_MI >= 0.05 ? fmtMi(m) : Math.round(m) + ' m';

const fmtTime = s => {
  if (!s) return '—';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${String(sec).padStart(2,'0')}s`;
  return `${sec}s`;
};

const fmtPace = mps => {
  if (!mps || mps <= 0) return '—';
  const spm = 1609.344 / mps;
  return `${Math.floor(spm/60)}:${String(Math.round(spm%60)).padStart(2,'0')}/mi`;
};

const fmtSpeed = (mps, sport) => {
  if (!mps) return '—';
  return sport === 'cycling' ? `${(mps * 2.23694).toFixed(1)} mph` : fmtPace(mps);
};

const fmtDate = str => !str ? '—' : new Date(str).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

const normSport = t => {
  if (!t) return 'other';
  const l = t.toLowerCase();
  if (l.includes('run') || l.includes('treadmill')) return 'running';
  if (l.includes('cycl') || l.includes('bike') || l.includes('ride')) return 'cycling';
  if (l.includes('swim')) return 'swimming';
  if (l.includes('row')) return 'rowing';
  return 'other';
};

// ─── API ─────────────────────────────────────────────────────────────────────
const api = path => fetch(path).then(r => r.json());

async function loadAll() {
  const today = new Date().toISOString().slice(0, 10);
  const [athlete, activities, weekly, daily] = await Promise.all([
    api('/api/athlete'),
    api('/api/activities?limit=200'),
    api('/api/stats/weekly'),
    api(`/api/stats/daily?date=${today}`).catch(() => ({})),
  ]);
  return { athlete, activities: Array.isArray(activities) ? activities : [], weekly, daily: daily || {} };
}

// ─── Theme hook ───────────────────────────────────────────────────────────────
function useTheme() {
  const [theme, setTheme] = useState(() => localStorage.getItem('dash-theme') || 'dim');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const toggle = useCallback(() => {
    setTheme(t => {
      const next = t === 'dim' ? 'light' : 'dim';
      localStorage.setItem('dash-theme', next);
      return next;
    });
  }, []);
  return [theme, toggle];
}

// ─── Stat tile ────────────────────────────────────────────────────────────────
function StatTile({ icon, label, value, unit, color }) {
  return (
    <div className="stat">
      <div className="stat-figure text-2xl" style={{ color }}>
        <i className={`ph-bold ${icon}`} />
      </div>
      <div className="stat-title text-xs">{label}</div>
      <div className="stat-value text-xl font-bold" style={{ color }}>{value}</div>
      {unit && <div className="stat-desc">{unit}</div>}
    </div>
  );
}

// ─── Sport tile ───────────────────────────────────────────────────────────────
function SportTile({ sport, stats }) {
  const { color, icon } = SPORT[sport] || SPORT.other;
  return (
    <div className="card bg-base-200 shadow border border-base-300">
      <div className="card-body p-4 gap-2">
        <div className="flex items-center gap-2">
          <i className={`ph-bold ${icon} text-xl`} style={{ color }} />
          <span className="font-semibold text-sm capitalize">{sport}</span>
          <span className="ml-auto badge badge-sm badge-ghost opacity-50">{stats.count || 0}×</span>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div>
            <div className="text-xs opacity-50">Distance</div>
            <div className="font-bold text-sm" style={{ color }}>{fmtDist(stats.distance_m)}</div>
          </div>
          <div>
            <div className="text-xs opacity-50">Time</div>
            <div className="font-bold text-sm">{fmtTime(stats.moving_time_s)}</div>
          </div>
        </div>
        {stats.calories > 0 && (
          <div className="text-xs opacity-40">{Math.round(stats.calories).toLocaleString()} kcal</div>
        )}
      </div>
    </div>
  );
}

// ─── Zone bars ────────────────────────────────────────────────────────────────
function ZoneBars({ zones }) {
  const total = zones.reduce((s, z) => s + z.secs, 0);
  if (!total) return null;
  return (
    <div className="space-y-1.5">
      {zones.filter(z => z.secs > 0).map(z => (
        <div key={z.name} className="flex items-center gap-2">
          <span className="text-xs w-28 opacity-60 shrink-0">{z.name}</span>
          <div className="flex-1 bg-base-300 rounded-full overflow-hidden" style={{ height: 6 }}>
            <div className="zone-bar" style={{ width: `${(z.secs/total*100).toFixed(1)}%`, background: z.color }} />
          </div>
          <span className="text-xs w-10 text-right opacity-60 shrink-0">{fmtTime(z.secs)}</span>
        </div>
      ))}
    </div>
  );
}

// ─── Activity detail (expanded) ───────────────────────────────────────────────
function ActivityDetail({ activity: a, detail }) {
  const sport = normSport(a.activityType?.typeKey);
  const s = detail?.summaryDTO || {};
  const splits = (detail?.splitSummaries || []).filter(sp => sp.distance > 0 || sp.duration > 0);
  const meta = detail?.metadataDTO || {};

  const metrics = [
    ['Avg HR',       a.averageHR     ? `${Math.round(a.averageHR)} bpm`  : null, '#f472b6'],
    ['Max HR',       a.maxHR         ? `${Math.round(a.maxHR)} bpm`      : null, '#fb923c'],
    ['Min HR',       s.minHR         ? `${Math.round(s.minHR)} bpm`      : null, '#38bdf8'],
    ['Avg Power',    (s.averagePower||a.avgPower)   ? `${Math.round(s.averagePower||a.avgPower)} W`  : null, '#facc15'],
    ['Norm Power',   (s.normalizedPower||a.normPower) ? `${Math.round(s.normalizedPower||a.normPower)} W` : null, '#facc15'],
    ['Max Power',    (s.maxPower||a.maxPower)       ? `${Math.round(s.maxPower||a.maxPower)} W`     : null, '#fb923c'],
    ['Pace',         fmtSpeed(s.averageSpeed||a.averageSpeed, sport) !== '—' ? fmtSpeed(s.averageSpeed||a.averageSpeed, sport) : null],
    ['Max Pace',     fmtSpeed(s.maxSpeed||a.maxSpeed, sport) !== '—' ? fmtSpeed(s.maxSpeed||a.maxSpeed, sport) : null],
    ['Cadence',      (s.averageRunCadence||a.averageRunningCadenceInStepsPerMinute) ? `${Math.round(s.averageRunCadence||a.averageRunningCadenceInStepsPerMinute)} spm` : null],
    ['Max Cadence',  a.maxRunningCadenceInStepsPerMinute ? `${a.maxRunningCadenceInStepsPerMinute} spm` : null],
    ['Stride',       (s.strideLength||a.avgStrideLength) ? `${((s.strideLength||a.avgStrideLength)/100).toFixed(2)} m` : null],
    ['Gnd Contact',  (s.groundContactTime||a.avgGroundContactTime) ? `${Math.round(s.groundContactTime||a.avgGroundContactTime)} ms` : null],
    ['Vert Osc',     (s.verticalOscillation||a.avgVerticalOscillation) ? `${(s.verticalOscillation||a.avgVerticalOscillation).toFixed(1)} cm` : null],
    ['Vert Ratio',   (s.verticalRatio||a.avgVerticalRatio) ? `${(s.verticalRatio||a.avgVerticalRatio).toFixed(1)}%` : null],
    ['Trng Load',    (s.activityTrainingLoad||a.activityTrainingLoad) ? Math.round(s.activityTrainingLoad||a.activityTrainingLoad) : null, '#818cf8'],
    ['Calories',     (s.calories||a.calories) ? `${s.calories||a.calories} kcal` : null],
    ['Body Battery', (s.differenceBodyBattery??a.differenceBodyBattery) != null ? `${(s.differenceBodyBattery??a.differenceBodyBattery)>0?'+':''}${s.differenceBodyBattery??a.differenceBodyBattery}` : null,
      (s.differenceBodyBattery??a.differenceBodyBattery) > 0 ? '#4ade80' : '#f87171'],
    ['Stamina Start',s.beginPotentialStamina ? `${s.beginPotentialStamina}%` : null],
    ['Stamina End',  s.endPotentialStamina   ? `${s.endPotentialStamina}%`   : null],
    ['Total Work',   s.totalWork   ? `${s.totalWork.toFixed(1)} kJ`  : null],
    ['Impact Load',  s.impactLoad  ? s.impactLoad.toLocaleString()   : null],
    ['Hydration',    s.waterEstimated ? `${s.waterEstimated} ml`     : null],
    ['Workout Feel', s.directWorkoutFeel ? `${s.directWorkoutFeel}/100` : null],
    ['RPE',          s.directWorkoutRpe  ? `${s.directWorkoutRpe}/100`  : null],
    ['Steps',        (s.steps||a.steps) ? (s.steps||a.steps).toLocaleString() : null],
    ['Mod Intensity',s.moderateIntensityMinutes ? `${s.moderateIntensityMinutes} min` : null],
    ['Vig Intensity',s.vigorousIntensityMinutes ? `${s.vigorousIntensityMinutes} min` : null],
    ['Laps',         meta.lapCount != null ? meta.lapCount : null],
  ].filter(([, v]) => v != null);

  const hrZones = HR_ZONES.map((z, i) => ({ ...z, secs: a[`hrTimeInZone_${i+1}`] || 0 }));
  const pwrZones = HR_ZONES.map((z, i) => ({ name: `PZ${i+1}`, color: z.color, secs: a[`powerTimeInZone_${i+1}`] || 0 }));
  const hasHRZones  = hrZones.some(z => z.secs > 0);
  const hasPwrZones = pwrZones.some(z => z.secs > 0);

  return (
    <div className="px-4 pb-5 pt-4 space-y-5 border-t border-base-300">

      {/* metrics grid */}
      <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2">
        {metrics.map(([label, value, color]) => (
          <div key={label} className="bg-base-300 rounded-lg p-2.5">
            <div className="text-xs opacity-50 mb-0.5">{label}</div>
            <div className="font-bold text-sm" style={color ? { color } : {}}>{value}</div>
          </div>
        ))}
      </div>

      {/* training effect */}
      {(a.aerobicTrainingEffect > 0 || a.anaerobicTrainingEffect > 0) && (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {a.aerobicTrainingEffect > 0 && (
            <div className="bg-base-300 rounded-lg p-3">
              <div className="text-xs opacity-50 mb-1">Aerobic Training Effect</div>
              <div className="flex items-center gap-3">
                <div className="text-3xl font-black text-success">{a.aerobicTrainingEffect.toFixed(1)}</div>
                <div>
                  <div className="font-bold text-sm text-success capitalize">{a.trainingEffectLabel?.toLowerCase()}</div>
                  <div className="text-xs opacity-50">{a.aerobicTrainingEffectMessage?.replace(/_/g,' ').toLowerCase()}</div>
                </div>
              </div>
            </div>
          )}
          {a.anaerobicTrainingEffect > 0 && (
            <div className="bg-base-300 rounded-lg p-3">
              <div className="text-xs opacity-50 mb-1">Anaerobic Training Effect</div>
              <div className="flex items-center gap-3">
                <div className="text-3xl font-black text-warning">{a.anaerobicTrainingEffect.toFixed(1)}</div>
                <div className="text-xs opacity-50">{a.anaerobicTrainingEffectMessage?.replace(/_/g,' ').toLowerCase()}</div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* HR + power zones */}
      {(hasHRZones || hasPwrZones) && (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
          {hasHRZones && (
            <div>
              <div className="text-xs font-semibold opacity-50 uppercase tracking-wider mb-2">Heart Rate Zones</div>
              <ZoneBars zones={hrZones} />
            </div>
          )}
          {hasPwrZones && (
            <div>
              <div className="text-xs font-semibold opacity-50 uppercase tracking-wider mb-2">Power Zones</div>
              <ZoneBars zones={pwrZones} />
            </div>
          )}
        </div>
      )}

      {/* splits table */}
      {splits.length > 0 && (
        <div>
          <div className="text-xs font-semibold opacity-50 uppercase tracking-wider mb-2">Intervals & Splits</div>
          <div className="overflow-x-auto">
            <table className="table table-xs w-full">
              <thead>
                <tr>
                  <th>Type</th><th>n</th><th>Dist</th><th>Time</th>
                  <th>Pace</th><th>Avg HR</th><th>Max HR</th>
                  <th>Avg W</th><th>NP</th><th>Cadence</th>
                  <th>Stride</th><th>Vert Osc</th><th>GCT</th><th>Cal</th>
                </tr>
              </thead>
              <tbody>
                {splits.map((sp, i) => {
                  const m = SPLIT_META[sp.splitType] || { label: sp.splitType, color: '#888' };
                  return (
                    <tr key={i}>
                      <td>
                        <span className="badge badge-xs badge-outline" style={{ borderColor: m.color+'80', color: m.color }}>
                          {m.label}
                        </span>
                      </td>
                      <td className="opacity-40">{sp.noOfSplits || 1}</td>
                      <td>{fmtDist(sp.distance)}</td>
                      <td>{fmtTime(sp.movingDuration || sp.duration)}</td>
                      <td className="font-mono text-xs">{fmtSpeed(sp.averageMovingSpeed || sp.averageSpeed, sport)}</td>
                      <td>{sp.averageHR ? Math.round(sp.averageHR) : '—'}</td>
                      <td>{sp.maxHR ? Math.round(sp.maxHR) : '—'}</td>
                      <td>{sp.averagePower ? `${Math.round(sp.averagePower)}W` : '—'}</td>
                      <td>{sp.normalizedPower ? `${Math.round(sp.normalizedPower)}W` : '—'}</td>
                      <td>{sp.averageRunCadence ? Math.round(sp.averageRunCadence) : '—'}</td>
                      <td>{sp.strideLength ? `${(sp.strideLength/100).toFixed(2)}m` : '—'}</td>
                      <td>{sp.verticalOscillation ? `${sp.verticalOscillation.toFixed(1)}cm` : '—'}</td>
                      <td>{sp.groundContactTime ? `${Math.round(sp.groundContactTime)}ms` : '—'}</td>
                      <td>{sp.calories || '—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {a.description && (
        <div className="text-xs opacity-40 italic border-l-2 border-base-300 pl-3">{a.description}</div>
      )}
    </div>
  );
}

// ─── Expandable activity row ───────────────────────────────────────────────────
function ActivityRow({ activity: a }) {
  const [open, setOpen] = useState(false);
  const [detail, setDetail] = useState(null);
  const [loading, setLoading] = useState(false);

  const sport = normSport(a.activityType?.typeKey);
  const { color, icon } = SPORT[sport] || SPORT.other;

  const toggle = async () => {
    if (!open && !detail && !loading) {
      setLoading(true);
      try { setDetail(await api(`/api/activities/${a.activityId}`)); }
      catch(e) { console.error(e); }
      finally { setLoading(false); }
    }
    setOpen(o => !o);
  };

  return (
    <div className="border-b border-base-300 last:border-0">
      <div className="activity-row px-4 py-3 flex items-center gap-3" onClick={toggle}>
        <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0"
             style={{ background: color + '20' }}>
          <i className={`ph-bold ${icon} text-sm`} style={{ color }} />
        </div>
        <div className="flex-1 min-w-0">
          <div className="font-medium text-sm truncate">{a.activityName || sport}</div>
          <div className="text-xs opacity-50">{fmtDate(a.startTimeLocal)}</div>
        </div>
        <div className="hidden sm:flex items-center gap-5 text-right shrink-0">
          {a.distance > 0 && (
            <div>
              <div className="text-sm font-bold" style={{ color }}>{fmtDist(a.distance)}</div>
              <div className="text-xs opacity-40">{fmtTime(a.movingDuration || a.duration)}</div>
            </div>
          )}
          {!a.distance && a.movingDuration > 0 && (
            <div className="text-sm font-bold">{fmtTime(a.movingDuration)}</div>
          )}
          {a.averageHR > 0 && (
            <div>
              <div className="text-sm font-bold" style={{ color: '#f472b6' }}>{a.averageHR} bpm</div>
              <div className="text-xs opacity-40">avg HR</div>
            </div>
          )}
          {a.averageSpeed > 0 && a.distance > 0 && (
            <div className="hidden md:block">
              <div className="text-sm font-mono">{fmtSpeed(a.averageSpeed, sport)}</div>
              <div className="text-xs opacity-40">pace</div>
            </div>
          )}
          {a.activityTrainingLoad > 0 && (
            <div className="hidden lg:block">
              <div className="text-sm font-bold" style={{ color: '#818cf8' }}>{Math.round(a.activityTrainingLoad)}</div>
              <div className="text-xs opacity-40">load</div>
            </div>
          )}
          {a.trainingEffectLabel && (
            <span className="badge badge-sm badge-outline opacity-50 hidden xl:inline-flex capitalize">
              {a.trainingEffectLabel.toLowerCase()}
            </span>
          )}
        </div>
        <div className="ml-2 shrink-0 opacity-40">
          {loading
            ? <span className="loading loading-spinner loading-xs" />
            : <i className={`ph-bold ph-caret-${open ? 'up' : 'down'} text-sm`} />}
        </div>
      </div>
      {open && (
        detail
          ? <ActivityDetail activity={a} detail={detail} />
          : <div className="px-4 pb-3 flex items-center gap-2 opacity-40 text-sm">
              <span className="loading loading-spinner loading-xs" /> Loading…
            </div>
      )}
    </div>
  );
}

// ─── Charts ───────────────────────────────────────────────────────────────────
function VolumeTrend({ activities }) {
  const data = useMemo(() => {
    const days = {}, cutoff = Date.now() - 30*86400000;
    for (const a of activities) {
      const ts = new Date(a.startTimeLocal||0).getTime();
      if (ts < cutoff || !a.distance) continue;
      const day = new Date(ts).toISOString().slice(0,10);
      if (!days[day]) days[day] = { day, running:0, cycling:0, swimming:0, rowing:0, other:0 };
      days[day][normSport(a.activityType?.typeKey)] += a.distance * M_TO_MI;
    }
    return Object.values(days).sort((a,b)=>a.day.localeCompare(b.day)).map(d=>({
      ...d, day: new Date(d.day).toLocaleDateString('en-US',{month:'short',day:'numeric'})
    }));
  }, [activities]);

  if (!data.length) return <p className="text-center opacity-40 py-8 text-sm">No data</p>;
  return (
    <ResponsiveContainer width="100%" height={200}>
      <AreaChart data={data} margin={{top:5,right:8,left:-10,bottom:0}}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="day" tick={{fontSize:10}} interval="preserveStartEnd" />
        <YAxis tick={{fontSize:10}} unit="mi" />
        <Tooltip formatter={v=>`${v.toFixed(2)} mi`} />
        <Legend wrapperStyle={{fontSize:11}} />
        {['running','cycling','swimming','rowing','other'].map(sp=>(
          <Area key={sp} type="monotone" dataKey={sp} stackId="1"
            stroke={SPORT[sp].color} fill={SPORT[sp].color} fillOpacity={0.55} dot={false} />
        ))}
      </AreaChart>
    </ResponsiveContainer>
  );
}

function HRTrend({ activities }) {
  const data = useMemo(() => {
    const cutoff = Date.now() - 7*86400000;
    return activities
      .filter(a => new Date(a.startTimeLocal).getTime() >= cutoff && a.averageHR)
      .sort((a,b) => new Date(a.startTimeLocal)-new Date(b.startTimeLocal))
      .map(a => ({ day:fmtDate(a.startTimeLocal), avgHR:Math.round(a.averageHR), maxHR:Math.round(a.maxHR||0) }));
  }, [activities]);

  if (!data.length) return <p className="text-center opacity-40 py-8 text-sm">No data</p>;
  return (
    <ResponsiveContainer width="100%" height={200}>
      <LineChart data={data} margin={{top:5,right:8,left:-10,bottom:0}}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="day" tick={{fontSize:10}} />
        <YAxis tick={{fontSize:10}} unit="bpm" domain={['auto','auto']} />
        <Tooltip formatter={v=>`${v} bpm`} />
        <Legend wrapperStyle={{fontSize:11}} />
        <Line type="monotone" dataKey="avgHR" stroke="#f472b6" strokeWidth={2} dot={{r:3}} name="Avg HR" />
        <Line type="monotone" dataKey="maxHR" stroke="#fb923c" strokeWidth={1.5} dot={{r:2}} strokeDasharray="4 2" name="Max HR" />
      </LineChart>
    </ResponsiveContainer>
  );
}

function LoadTrend({ activities }) {
  const data = useMemo(() => {
    const cutoff = Date.now() - 30*86400000;
    return activities
      .filter(a => new Date(a.startTimeLocal).getTime() >= cutoff && a.activityTrainingLoad)
      .sort((a,b) => new Date(a.startTimeLocal)-new Date(b.startTimeLocal))
      .map(a => ({ day:fmtDate(a.startTimeLocal), load:Math.round(a.activityTrainingLoad), sport:normSport(a.activityType?.typeKey) }));
  }, [activities]);

  if (!data.length) return <p className="text-center opacity-40 py-8 text-sm">No data</p>;
  return (
    <ResponsiveContainer width="100%" height={200}>
      <BarChart data={data} margin={{top:5,right:8,left:-10,bottom:0}}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="day" tick={{fontSize:10}} interval="preserveStartEnd" />
        <YAxis tick={{fontSize:10}} />
        <Tooltip formatter={v=>`${v} load`} />
        <Bar dataKey="load" radius={[3,3,0,0]}>
          {data.map((d,i) => <Cell key={i} fill={SPORT[d.sport]?.color||SPORT.other.color} />)}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

function HRZoneChart({ activity }) {
  if (!activity) return null;
  const zones = HR_ZONES.map((z,i)=>({ ...z, mins:Math.round((activity[`hrTimeInZone_${i+1}`]||0)/60) })).filter(z=>z.mins>0);
  if (!zones.length) return <p className="text-center opacity-40 py-8 text-sm">No zone data</p>;
  return (
    <ResponsiveContainer width="100%" height={160}>
      <BarChart data={zones} margin={{top:5,right:8,left:-10,bottom:0}}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="name" tick={{fontSize:10}} />
        <YAxis tick={{fontSize:10}} unit="m" />
        <Tooltip formatter={v=>`${v} min`} />
        <Bar dataKey="mins" radius={[4,4,0,0]}>
          {zones.map((z,i)=><Cell key={i} fill={z.color} />)}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(null);
  const [err,  setErr]  = useState(null);
  const [theme, toggleTheme] = useTheme();

  useEffect(() => { loadAll().then(setData).catch(e => setErr(e.message)); }, []);

  if (err) return (
    <div className="flex items-center justify-center min-h-screen">
      <div className="alert alert-error max-w-md">
        <i className="ph-bold ph-warning-circle text-xl" />
        <span>Load failed: {err}</span>
      </div>
    </div>
  );

  const athlete    = data?.athlete || {};
  const activities = data?.activities || [];
  const bySport    = data?.weekly?.by_sport || {};
  const daily      = data?.daily || {};

  const steps  = daily.steps;
  const rhr    = daily.heart_rate?.restingHeartRate;
  const maxHRd = daily.heart_rate?.maxHeartRate;
  const sleep  = daily.sleep?.dailySleepDTO?.sleepTimeSeconds;
  const spo2   = daily.sleep?.wellnessSpO2SleepSummaryDTO?.averageSPO2;
  const latest = activities[0];

  return (
    <div className="min-h-screen bg-base-100">

      {/* navbar */}
      <div className="navbar bg-base-200 border-b border-base-300 px-4 sm:px-6 sticky top-0 z-50 shadow-sm">
        <div className="flex-1 flex items-center gap-3">
          {athlete.profileImageUrlSmall
            ? <div className="avatar"><div className="w-9 rounded-full ring ring-primary ring-offset-base-100 ring-offset-1"><img src={athlete.profileImageUrlSmall} alt="avatar" /></div></div>
            : <div className="avatar placeholder"><div className="bg-neutral text-neutral-content rounded-full w-9"><i className="ph-bold ph-user text-lg" /></div></div>
          }
          <div>
            <div className="font-bold text-sm leading-tight">{athlete.fullName || 'Athlete'}</div>
            <div className="text-xs opacity-50 leading-tight">Ironman Trainee · 2026 SF Marathon</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-xs opacity-40 hidden sm:block">
            {new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
          </span>
          <button onClick={toggleTheme} className="btn btn-ghost btn-sm btn-circle" title="Toggle theme">
            <i className={`ph-bold ${theme === 'dim' ? 'ph-sun' : 'ph-moon'} text-lg`} />
          </button>
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">

        {/* wellness */}
        <section>
          <h2 className="text-xs font-semibold opacity-50 uppercase tracking-wider mb-3 flex items-center gap-1.5">
            <i className="ph-bold ph-heartbeat" /> Today
          </h2>
          <div className="stats stats-horizontal bg-base-200 shadow w-full flex-wrap">
            {!data
              ? [1,2,3,4,5].map(i=><div key={i} className="stat"><div className="skeleton h-4 w-20 mb-2 rounded"/><div className="skeleton h-8 w-16 rounded"/></div>)
              : <>
                  <StatTile icon="ph-person-simple-walk" label="Steps"      value={steps  ? steps.toLocaleString() : '—'}                          color="#4ade80" />
                  <StatTile icon="ph-heart"              label="Resting HR"  value={rhr    ? `${rhr}`    : '—'} unit={rhr    ? 'bpm'   : undefined} color="#f472b6" />
                  <StatTile icon="ph-heartbeat"          label="Max HR"      value={maxHRd ? `${maxHRd}` : '—'} unit={maxHRd ? 'bpm'   : undefined} color="#fb923c" />
                  <StatTile icon="ph-moon"               label="Sleep"       value={sleep  ? `${(sleep/3600).toFixed(1)}` : '—'} unit={sleep ? 'hrs' : undefined} color="#818cf8" />
                  <StatTile icon="ph-wind"               label="SpO₂"        value={spo2   ? `${Math.round(spo2)}%` : '—'}                          color="#38bdf8" />
                </>
            }
          </div>
        </section>

        {/* weekly */}
        <section>
          <h2 className="text-xs font-semibold opacity-50 uppercase tracking-wider mb-3 flex items-center gap-1.5">
            <i className="ph-bold ph-calendar-check" /> This Week
          </h2>
          {!data
            ? <div className="grid grid-cols-2 md:grid-cols-4 gap-3">{[1,2,3,4].map(i=><div key={i} className="card bg-base-200 shadow h-28"><div className="card-body p-4"><div className="skeleton h-full w-full rounded"/></div></div>)}</div>
            : <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                {['running','cycling','swimming','rowing'].map(sp=>(
                  <SportTile key={sp} sport={sp} stats={bySport[sp]||{count:0,distance_m:0,moving_time_s:0,calories:0}} />
                ))}
              </div>
          }
        </section>

        {/* charts */}
        <section className="grid grid-cols-1 lg:grid-cols-2 gap-4">
          {[
            { title: '30-Day Volume',      icon: 'ph-chart-line-up', color: '#4ade80', Component: VolumeTrend,  props: { activities } },
            { title: '7-Day Heart Rate',   icon: 'ph-heartbeat',     color: '#f472b6', Component: HRTrend,      props: { activities } },
            { title: '30-Day Trng Load',   icon: 'ph-lightning',     color: '#facc15', Component: LoadTrend,    props: { activities } },
            { title: 'Last Activity Zones',icon: 'ph-chart-bar',     color: '#38bdf8', Component: HRZoneChart,  props: { activity: latest } },
          ].map(({ title, icon, color, Component, props }) => (
            <div key={title} className="card bg-base-200 shadow border border-base-300">
              <div className="card-body p-4">
                <h3 className="font-semibold text-sm flex items-center gap-2 mb-3">
                  <i className={`ph-bold ${icon}`} style={{ color }} /> {title}
                </h3>
                {!data ? <div className="skeleton h-48 w-full rounded" /> : <Component {...props} />}
              </div>
            </div>
          ))}
        </section>

        {/* activity list */}
        <section>
          <div className="card bg-base-200 shadow border border-base-300">
            <div className="px-4 py-3 border-b border-base-300 flex items-center gap-2">
              <i className="ph-bold ph-list-bullets opacity-60" />
              <h3 className="font-semibold text-sm">Recent Activities</h3>
              {data && <span className="ml-auto text-xs opacity-40">{activities.length} loaded · tap to expand</span>}
            </div>
            {!data
              ? <div className="p-4 space-y-3">{[1,2,3,4,5].map(i=><div key={i} className="skeleton h-12 w-full rounded"/>)}</div>
              : <div>{activities.slice(0,50).map(a=><ActivityRow key={a.activityId} activity={a} />)}</div>
            }
          </div>
        </section>

        <footer className="text-center text-xs opacity-20 py-4">gacoka.com · Garmin Connect</footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
