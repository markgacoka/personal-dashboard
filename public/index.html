<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gacoka — Athlete Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.13.0/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: oklch(var(--b1)); min-height: 100vh; }
    .recharts-text { fill: oklch(var(--bc) / 0.6) !important; font-size: 11px; }
    .recharts-cartesian-grid-horizontal line,
    .recharts-cartesian-grid-vertical line { stroke: oklch(var(--bc) / 0.08) !important; }
    .recharts-tooltip-wrapper .recharts-default-tooltip {
      background: oklch(var(--b2)) !important;
      border: 1px solid oklch(var(--bc) / 0.15) !important;
      border-radius: 8px !important;
      color: oklch(var(--bc)) !important;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const {
  AreaChart, Area, BarChart, Bar, LineChart, Line,
  XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer
} = window.Recharts;

// ── colour palette per sport ──────────────────────────────────────────────────
const SPORT_COLORS = {
  running:    '#4ade80',
  cycling:    '#facc15',
  swimming:   '#38bdf8',
  rowing:     '#f472b6',
  other:      '#a78bfa',
};

const SPORT_ICONS = {
  running:  'ph-person-simple-run',
  cycling:  'ph-bicycle',
  swimming: 'ph-waves',
  rowing:   'ph-rowing',
  other:    'ph-activity',
};

const HR_ZONE_COLORS = ['#38bdf8','#4ade80','#facc15','#fb923c','#f87171'];

// ── helpers ───────────────────────────────────────────────────────────────────
function fmtDist(m) {
  if (!m) return '—';
  return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m)} m`;
}

function fmtTime(s) {
  if (!s) return '—';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function fmtDate(str) {
  if (!str) return '—';
  const d = new Date(str);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function normalizeType(t) {
  if (!t) return 'other';
  const l = t.toLowerCase();
  if (l.includes('run'))  return 'running';
  if (l.includes('cycl') || l.includes('bike') || l.includes('ride')) return 'cycling';
  if (l.includes('swim')) return 'swimming';
  if (l.includes('row'))  return 'rowing';
  return 'other';
}

// ── API fetchers ──────────────────────────────────────────────────────────────
async function fetchAll() {
  const today = new Date().toISOString().slice(0, 10);
  const [athlete, activities, weekly, daily] = await Promise.all([
    fetch('/api/athlete').then(r => r.json()),
    fetch('/api/activities?limit=200').then(r => r.json()),
    fetch('/api/stats/weekly').then(r => r.json()),
    fetch(`/api/stats/daily?date=${today}`).then(r => r.json()).catch(() => ({})),
  ]);
  return { athlete, activities: activities || [], weekly: weekly || {}, daily: daily || {} };
}

// ── Skeleton loading state ────────────────────────────────────────────────────
function SkeletonCard({ rows = 1 }) {
  return (
    <div className="card bg-base-200 shadow">
      <div className="card-body gap-3">
        {Array.from({ length: rows }).map((_, i) => (
          <div key={i} className="skeleton h-4 w-full rounded"></div>
        ))}
      </div>
    </div>
  );
}

// ── Wellness stat ─────────────────────────────────────────────────────────────
function StatTile({ icon, label, value, unit, color }) {
  return (
    <div className="stat bg-base-200 rounded-xl">
      <div className="stat-figure text-2xl" style={{ color }}>
        <i className={`ph-bold ${icon}`}></i>
      </div>
      <div className="stat-title text-xs opacity-60">{label}</div>
      <div className="stat-value text-2xl font-bold" style={{ color }}>{value}</div>
      {unit && <div className="stat-desc opacity-50">{unit}</div>}
    </div>
  );
}

// ── Sport tile ────────────────────────────────────────────────────────────────
function SportTile({ sport, stats }) {
  const color = SPORT_COLORS[sport] || SPORT_COLORS.other;
  const icon  = SPORT_ICONS[sport]  || SPORT_ICONS.other;
  const label = sport.charAt(0).toUpperCase() + sport.slice(1);
  return (
    <div className="card bg-base-200 shadow border border-base-300">
      <div className="card-body p-4 gap-2">
        <div className="flex items-center gap-2">
          <i className={`ph-bold ${icon} text-xl`} style={{ color }}></i>
          <span className="font-semibold text-sm">{label}</span>
        </div>
        <div className="grid grid-cols-3 gap-2 mt-1">
          <div>
            <div className="text-xs opacity-50">Distance</div>
            <div className="font-bold text-sm" style={{ color }}>{fmtDist(stats.distance_m)}</div>
          </div>
          <div>
            <div className="text-xs opacity-50">Time</div>
            <div className="font-bold text-sm">{fmtTime(stats.moving_time_s)}</div>
          </div>
          <div>
            <div className="text-xs opacity-50">Sessions</div>
            <div className="font-bold text-sm">{stats.count ?? 0}</div>
          </div>
        </div>
        {stats.calories > 0 && (
          <div className="text-xs opacity-40">{Math.round(stats.calories).toLocaleString()} kcal</div>
        )}
      </div>
    </div>
  );
}

// ── 30-day volume trend (stacked area) ───────────────────────────────────────
function VolumeTrend({ activities }) {
  const data = useMemo(() => {
    const days = {};
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    for (const a of activities) {
      const ts = new Date(a.startTimeLocal || a.beginTimestamp || 0).getTime();
      if (ts < cutoff) continue;
      const day = new Date(ts).toISOString().slice(0, 10);
      if (!days[day]) days[day] = { day, running: 0, cycling: 0, swimming: 0, rowing: 0, other: 0 };
      const sport = normalizeType(a.activityType?.typeKey || a.sport || '');
      days[day][sport] = (days[day][sport] || 0) + (a.distance || 0) / 1000;
    }
    return Object.values(days).sort((a, b) => a.day.localeCompare(b.day)).map(d => ({
      ...d,
      day: new Date(d.day).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
    }));
  }, [activities]);

  if (!data.length) return <div className="text-center opacity-40 py-8 text-sm">No activity data</div>;

  return (
    <ResponsiveContainer width="100%" height={200}>
      <AreaChart data={data} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="day" tick={{ fontSize: 10 }} interval="preserveStartEnd" />
        <YAxis tick={{ fontSize: 10 }} unit="km" />
        <Tooltip formatter={(v) => `${v.toFixed(1)} km`} />
        <Legend wrapperStyle={{ fontSize: 11 }} />
        {['running','cycling','swimming','rowing','other'].map(sport => (
          <Area
            key={sport}
            type="monotone"
            dataKey={sport}
            stackId="1"
            stroke={SPORT_COLORS[sport]}
            fill={SPORT_COLORS[sport]}
            fillOpacity={0.6}
            dot={false}
          />
        ))}
      </AreaChart>
    </ResponsiveContainer>
  );
}

// ── 7-day resting HR trend ────────────────────────────────────────────────────
function HRTrend({ activities }) {
  const data = useMemo(() => {
    const cutoff = Date.now() - 7 * 24 * 3600 * 1000;
    return activities
      .filter(a => {
        const ts = new Date(a.startTimeLocal || a.beginTimestamp || 0).getTime();
        return ts >= cutoff && a.averageHR;
      })
      .sort((a, b) => new Date(a.startTimeLocal).getTime() - new Date(b.startTimeLocal).getTime())
      .map(a => ({
        day: fmtDate(a.startTimeLocal),
        avgHR: Math.round(a.averageHR),
        maxHR: Math.round(a.maxHR || 0),
      }));
  }, [activities]);

  if (!data.length) return <div className="text-center opacity-40 py-8 text-sm">No HR data</div>;

  return (
    <ResponsiveContainer width="100%" height={200}>
      <LineChart data={data} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="day" tick={{ fontSize: 10 }} />
        <YAxis tick={{ fontSize: 10 }} unit="bpm" domain={['auto','auto']} />
        <Tooltip formatter={(v) => `${v} bpm`} />
        <Legend wrapperStyle={{ fontSize: 11 }} />
        <Line type="monotone" dataKey="avgHR" stroke="#f472b6" strokeWidth={2} dot={{ r: 3 }} name="Avg HR" />
        <Line type="monotone" dataKey="maxHR" stroke="#fb923c" strokeWidth={1.5} dot={{ r: 2 }} strokeDasharray="4 2" name="Max HR" />
      </LineChart>
    </ResponsiveContainer>
  );
}

// ── Last-activity HR zone bar chart ──────────────────────────────────────────
function HRZoneChart({ activity }) {
  if (!activity) return null;
  const zones = [1,2,3,4,5].map(i => ({
    zone: `Z${i}`,
    minutes: Math.round((activity[`hrTimeInZone_${i}`] || 0) / 60),
  })).filter(z => z.minutes > 0);

  if (!zones.length) return <div className="text-center opacity-40 py-8 text-sm">No HR zone data</div>;

  return (
    <ResponsiveContainer width="100%" height={160}>
      <BarChart data={zones} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="zone" tick={{ fontSize: 11 }} />
        <YAxis tick={{ fontSize: 10 }} unit="m" />
        <Tooltip formatter={(v) => `${v} min`} />
        {zones.map((z, i) => (
          <Bar key={z.zone} dataKey="minutes" fill={HR_ZONE_COLORS[i] || '#888'} radius={[4,4,0,0]} />
        ))}
      </BarChart>
    </ResponsiveContainer>
  );
}

// ── Training load trend (last 30 days) ───────────────────────────────────────
function TrainingLoadTrend({ activities }) {
  const data = useMemo(() => {
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    return activities
      .filter(a => {
        const ts = new Date(a.startTimeLocal || 0).getTime();
        return ts >= cutoff && a.activityTrainingLoad;
      })
      .sort((a, b) => new Date(a.startTimeLocal).getTime() - new Date(b.startTimeLocal).getTime())
      .map(a => ({
        day: fmtDate(a.startTimeLocal),
        load: Math.round(a.activityTrainingLoad),
        sport: normalizeType(a.activityType?.typeKey || ''),
      }));
  }, [activities]);

  if (!data.length) return <div className="text-center opacity-40 py-8 text-sm">No training load data</div>;

  return (
    <ResponsiveContainer width="100%" height={200}>
      <BarChart data={data} margin={{ top: 5, right: 10, left: -20, bottom: 0 }}>
        <CartesianGrid strokeDasharray="3 3" />
        <XAxis dataKey="day" tick={{ fontSize: 10 }} interval="preserveStartEnd" />
        <YAxis tick={{ fontSize: 10 }} />
        <Tooltip formatter={(v) => `${v} load`} />
        <Bar dataKey="load" radius={[3,3,0,0]}>
          {data.map((entry, i) => (
            <rect key={i} fill={SPORT_COLORS[entry.sport] || SPORT_COLORS.other} />
          ))}
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

// ── Activity table ────────────────────────────────────────────────────────────
function ActivityTable({ activities }) {
  const rows = activities.slice(0, 25);
  return (
    <div className="overflow-x-auto">
      <table className="table table-xs table-zebra w-full">
        <thead>
          <tr>
            <th>Date</th>
            <th>Sport</th>
            <th>Distance</th>
            <th>Duration</th>
            <th>Avg HR</th>
            <th>Load</th>
            <th>Body Battery</th>
            <th>Training Effect</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((a, i) => {
            const sport = normalizeType(a.activityType?.typeKey || a.sport || '');
            const color = SPORT_COLORS[sport];
            const bodyBat = a.differenceBodyBattery;
            const bbColor = bodyBat > 0 ? '#4ade80' : bodyBat < 0 ? '#f87171' : 'inherit';
            return (
              <tr key={a.activityId || i}>
                <td className="opacity-70">{fmtDate(a.startTimeLocal)}</td>
                <td>
                  <span className="flex items-center gap-1">
                    <i className={`ph-bold ${SPORT_ICONS[sport] || SPORT_ICONS.other} text-sm`} style={{ color }}></i>
                    <span className="capitalize text-xs">{sport}</span>
                  </span>
                </td>
                <td>{fmtDist(a.distance)}</td>
                <td>{fmtTime(a.movingDuration || a.duration)}</td>
                <td>
                  {a.averageHR ? (
                    <span className="badge badge-sm" style={{ backgroundColor: '#f472b620', color: '#f472b6', border: 'none' }}>
                      {Math.round(a.averageHR)} bpm
                    </span>
                  ) : '—'}
                </td>
                <td>{a.activityTrainingLoad ? Math.round(a.activityTrainingLoad) : '—'}</td>
                <td>
                  {bodyBat !== undefined && bodyBat !== null ? (
                    <span className="font-mono font-bold text-xs" style={{ color: bbColor }}>
                      {bodyBat > 0 ? '+' : ''}{bodyBat}
                    </span>
                  ) : '—'}
                </td>
                <td>
                  {a.trainingEffectLabel ? (
                    <span className="badge badge-xs badge-outline opacity-70">{a.trainingEffectLabel}</span>
                  ) : '—'}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    fetchAll()
      .then(setData)
      .catch(e => setError(e.message));
  }, []);

  if (error) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <div className="alert alert-error max-w-md">
          <i className="ph-bold ph-warning-circle text-xl"></i>
          <span>Failed to load data: {error}</span>
        </div>
      </div>
    );
  }

  const athlete   = data?.athlete || {};
  const activities = data?.activities || [];
  const weekly    = data?.weekly?.by_sport || {};
  const daily     = data?.daily || {};

  const steps     = daily.steps;
  const rhr       = daily.heart_rate?.restingHeartRate;
  const sleepSecs = daily.sleep?.dailySleepDTO?.sleepTimeSeconds;
  const spo2      = daily.sleep?.wellnessSpO2SleepSummaryDTO?.averageSPO2;
  const latestActivity = activities[0];

  const sportKeys = ['running','cycling','swimming','rowing'];
  const activeSports = sportKeys.filter(s => weekly[s]?.count > 0);

  return (
    <div className="min-h-screen bg-base-100">

      {/* ── Navbar ──────────────────────────────────────────────── */}
      <div className="navbar bg-base-200 border-b border-base-300 px-6 sticky top-0 z-50 shadow-sm">
        <div className="flex-1 flex items-center gap-3">
          {athlete.profileImageUrlSmall ? (
            <div className="avatar">
              <div className="w-9 rounded-full ring ring-primary ring-offset-base-100 ring-offset-1">
                <img src={athlete.profileImageUrlSmall} alt="avatar" />
              </div>
            </div>
          ) : (
            <div className="avatar placeholder">
              <div className="bg-neutral text-neutral-content rounded-full w-9">
                <i className="ph-bold ph-user text-lg"></i>
              </div>
            </div>
          )}
          <div>
            <div className="font-bold text-sm leading-tight">
              {athlete.fullName || 'Athlete'}
            </div>
            <div className="text-xs opacity-50 leading-tight">Ironman Trainee · 2026 SF Marathon</div>
          </div>
        </div>
        <div className="flex-none flex items-center gap-2 text-xs opacity-50">
          <i className="ph-bold ph-clock"></i>
          <span>{new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}</span>
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-4 py-6 space-y-6">

        {/* ── Wellness row ────────────────────────────────────────── */}
        <section>
          <div className="flex items-center gap-2 mb-3">
            <i className="ph-bold ph-heartbeat opacity-60"></i>
            <h2 className="text-sm font-semibold opacity-60 uppercase tracking-wider">Today's Wellness</h2>
          </div>
          <div className="stats stats-horizontal bg-base-200 shadow w-full flex-wrap">
            {!data ? (
              <>
                {[1,2,3,4].map(i => (
                  <div key={i} className="stat">
                    <div className="skeleton h-4 w-20 mb-2"></div>
                    <div className="skeleton h-8 w-16"></div>
                  </div>
                ))}
              </>
            ) : (
              <>
                <StatTile
                  icon="ph-person-simple-walk"
                  label="Steps"
                  value={steps ? steps.toLocaleString() : '—'}
                  color="#4ade80"
                />
                <StatTile
                  icon="ph-heart"
                  label="Resting HR"
                  value={rhr ? `${rhr}` : '—'}
                  unit={rhr ? 'bpm' : undefined}
                  color="#f472b6"
                />
                <StatTile
                  icon="ph-moon"
                  label="Sleep"
                  value={sleepSecs ? `${(sleepSecs / 3600).toFixed(1)}` : '—'}
                  unit={sleepSecs ? 'hours' : undefined}
                  color="#818cf8"
                />
                <StatTile
                  icon="ph-wind"
                  label="SpO2"
                  value={spo2 ? `${Math.round(spo2)}%` : '—'}
                  color="#38bdf8"
                />
              </>
            )}
          </div>
        </section>

        {/* ── Weekly sport tiles ───────────────────────────────────── */}
        <section>
          <div className="flex items-center gap-2 mb-3">
            <i className="ph-bold ph-calendar-check opacity-60"></i>
            <h2 className="text-sm font-semibold opacity-60 uppercase tracking-wider">This Week</h2>
          </div>
          {!data ? (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {[1,2,3,4].map(i => <SkeletonCard key={i} rows={3} />)}
            </div>
          ) : (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              {sportKeys.map(sport => (
                <SportTile key={sport} sport={sport} stats={weekly[sport] || { count: 0, distance_m: 0, moving_time_s: 0, calories: 0 }} />
              ))}
            </div>
          )}
        </section>

        {/* ── Charts row ─────────────────────────────────────────── */}
        <section className="grid grid-cols-1 lg:grid-cols-2 gap-4">

          {/* 30-day volume */}
          <div className="card bg-base-200 shadow border border-base-300">
            <div className="card-body p-4">
              <div className="flex items-center gap-2 mb-3">
                <i className="ph-bold ph-chart-line-up text-lg" style={{ color: '#4ade80' }}></i>
                <h3 className="font-semibold text-sm">30-Day Volume</h3>
              </div>
              {!data ? (
                <div className="skeleton h-48 w-full rounded"></div>
              ) : (
                <VolumeTrend activities={activities} />
              )}
            </div>
          </div>

          {/* 7-day HR trend */}
          <div className="card bg-base-200 shadow border border-base-300">
            <div className="card-body p-4">
              <div className="flex items-center gap-2 mb-3">
                <i className="ph-bold ph-heartbeat text-lg" style={{ color: '#f472b6' }}></i>
                <h3 className="font-semibold text-sm">7-Day Heart Rate</h3>
              </div>
              {!data ? (
                <div className="skeleton h-48 w-full rounded"></div>
              ) : (
                <HRTrend activities={activities} />
              )}
            </div>
          </div>

          {/* Training load */}
          <div className="card bg-base-200 shadow border border-base-300">
            <div className="card-body p-4">
              <div className="flex items-center gap-2 mb-3">
                <i className="ph-bold ph-lightning text-lg" style={{ color: '#facc15' }}></i>
                <h3 className="font-semibold text-sm">30-Day Training Load</h3>
              </div>
              {!data ? (
                <div className="skeleton h-48 w-full rounded"></div>
              ) : (
                <TrainingLoadTrend activities={activities} />
              )}
            </div>
          </div>

          {/* Last activity HR zones */}
          <div className="card bg-base-200 shadow border border-base-300">
            <div className="card-body p-4">
              <div className="flex items-center gap-2 mb-1">
                <i className="ph-bold ph-chart-bar text-lg" style={{ color: '#38bdf8' }}></i>
                <h3 className="font-semibold text-sm">HR Zones</h3>
                {latestActivity && (
                  <span className="text-xs opacity-40 ml-auto">
                    last activity · {fmtDate(latestActivity.startTimeLocal)}
                  </span>
                )}
              </div>
              {latestActivity && (
                <div className="flex gap-3 mb-2 flex-wrap">
                  {latestActivity.aerobicTrainingEffect > 0 && (
                    <span className="badge badge-sm badge-outline" style={{ borderColor: '#4ade8060', color: '#4ade80' }}>
                      Aerobic {latestActivity.aerobicTrainingEffect?.toFixed(1)}
                    </span>
                  )}
                  {latestActivity.anaerobicTrainingEffect > 0 && (
                    <span className="badge badge-sm badge-outline" style={{ borderColor: '#fb923c60', color: '#fb923c' }}>
                      Anaerobic {latestActivity.anaerobicTrainingEffect?.toFixed(1)}
                    </span>
                  )}
                  {latestActivity.trainingEffectLabel && (
                    <span className="badge badge-sm badge-ghost opacity-60">{latestActivity.trainingEffectLabel}</span>
                  )}
                </div>
              )}
              {!data ? (
                <div className="skeleton h-40 w-full rounded"></div>
              ) : (
                <HRZoneChart activity={latestActivity} />
              )}
            </div>
          </div>
        </section>

        {/* ── Activity table ───────────────────────────────────────── */}
        <section>
          <div className="card bg-base-200 shadow border border-base-300">
            <div className="card-body p-4">
              <div className="flex items-center gap-2 mb-3">
                <i className="ph-bold ph-list-bullets text-lg opacity-70"></i>
                <h3 className="font-semibold text-sm">Recent Activities</h3>
                {data && (
                  <span className="text-xs opacity-40 ml-auto">{activities.length} loaded</span>
                )}
              </div>
              {!data ? (
                <div className="space-y-2">
                  {[1,2,3,4,5].map(i => <div key={i} className="skeleton h-8 w-full rounded"></div>)}
                </div>
              ) : (
                <ActivityTable activities={activities} />
              )}
            </div>
          </div>
        </section>

        <footer className="text-center text-xs opacity-20 py-4">
          gacoka.com · data from Garmin Connect
        </footer>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
