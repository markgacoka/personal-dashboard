name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  VPS_HOST: 89.116.157.98
  VPS_USER: gacoka
  DEPLOY_PATH: /var/www/app
  HEALTHCHECK_URL: https://gacoka.com/health

jobs:
  deploy:
    name: Deploy → gacoka.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ env.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create archive
        run: |
          tar czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='api/node_modules' \
            public/ \
            api/ \
            nginx/

      - name: Ship to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            deploy.tar.gz \
            "${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/tmp/deploy-${{ github.sha }}.tar.gz"

      - name: Deploy
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
          RELEASE_DIR="${DEPLOY_PATH}/releases/${SHORT}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ env.VPS_USER }}@${{ env.VPS_HOST }}" bash << EOF
          set -euo pipefail

          mkdir -p "${RELEASE_DIR}"
          tar xzf /tmp/deploy-${SHA}.tar.gz -C "${RELEASE_DIR}"
          rm /tmp/deploy-${SHA}.tar.gz

          # Link shared .env into release so the API picks it up
          ln -sf "${DEPLOY_PATH}/.env" "${RELEASE_DIR}/api/.env"

          # Install API dependencies
          cd "${RELEASE_DIR}/api" && npm ci --omit=dev && cd -

          # Swap symlink
          ln -sfn "${RELEASE_DIR}" "${DEPLOY_PATH}/current"

          # Install nginx config and reload
          sudo cp "${DEPLOY_PATH}/current/nginx/gacoka.com" /etc/nginx/sites-available/gacoka.com
          sudo nginx -t
          sudo nginx -s reload

          # Restart API process (start on first deploy)
          pm2 restart dashboard-api 2>/dev/null \
            || pm2 start "${DEPLOY_PATH}/current/api/ecosystem.config.cjs" --env production
          pm2 save

          echo "Deployed ${SHORT} → ${DEPLOY_PATH}/current"

          ls -1dt "${DEPLOY_PATH}/releases"/*/ 2>/dev/null | tail -n +6 | xargs rm -rf || true
          EOF

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ env.HEALTHCHECK_URL }}" 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "${{ env.HEALTHCHECK_URL }} → HTTP $STATUS" && exit 0
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
