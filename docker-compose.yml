networks:
  web:
    name: web

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - /var/www/app/acme.json:/acme.json
    networks:
      - web

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    env_file:
      - /var/www/app/.env
    volumes:
      - /var/www/app/garmin-session:/data/garmin-session
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`gacoka.com`) || Host(`www.gacoka.com`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"
    depends_on:
      - traefik

  # Run on demand to (re-)authenticate with Garmin via headless Chromium.
  # Chromium's real TLS fingerprint bypasses Cloudflare's bot detection on Garmin's SSO.
  # Tokens are saved to the shared garmin-session volume and reused by the api service.
  #
  # Usage:  docker compose --profile auth run --rm garmin-auth
  garmin-auth:
    profiles: ["auth"]
    build:
      context: .
      dockerfile: api/Dockerfile.auth
    env_file:
      - /var/www/app/.env
    volumes:
      - /var/www/app/garmin-session:/data/garmin-session
    networks:
      - web
