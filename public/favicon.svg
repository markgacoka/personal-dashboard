<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark lacquer background, matching the app's own dark surface -->
  <rect width="32" height="32" rx="7" fill="#0a0909"/>
  <!-- Four quadrants — the same motif as the app's own Overview icon,
       standing for the dashboard's four tracked domains (fitness, flights,
       finances, chess) rather than favoring just one of them -->
  <rect x="6"  y="6"  width="9" height="9" rx="2" fill="#d4a520"/>
  <rect x="17" y="6"  width="9" height="9" rx="2" fill="#d4a520" fill-opacity="0.45"/>
  <rect x="6"  y="17" width="9" height="9" rx="2" fill="#d4a520" fill-opacity="0.45"/>
  <rect x="17" y="17" width="9" height="9" rx="2" fill="#d4a520"/>
</svg>
