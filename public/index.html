<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gacoka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts@3/dist/apexcharts.min.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface-2: #21262d;
      --border:    #30363d;
      --border-subtle: #21262d;
      --text:      #e6edf3;
      --text-secondary: #c9d1d9;
      --muted:     #8b949e;
      --subtle:    #6e7681;
      --green:  #3fb950;
      --blue:   #58a6ff;
      --purple: #bc8cff;
      --orange: #f0883e;
      --rose:   #f85149;
      --amber:  #e3b341;
      --teal:   #39d353;
      --pink:   #db61a2;
      --run:  #3fb950;
      --bike: #e3b341;
      --swim: #58a6ff;
      --row:  #db61a2;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
    }
    [data-theme="light"] {
      --bg:        #f6f8fa;
      --surface:   #ffffff;
      --surface-2: #f0f3f6;
      --border:    #d0d7de;
      --border-subtle: #e8ecf0;
      --text:      #1c2128;
      --text-secondary: #24292f;
      --muted:     #57606a;
      --subtle:    #6e7781;
    }

    html, body {
      height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'cv02', 'cv03', 'cv04';
    }

    /* ─── Typography scale ─────────────────────────────────────── */
    .eyebrow {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
    }
    .page-title {
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.025em; line-height: 1.2;
      color: var(--text);
    }
    .metric-label {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--muted);
    }
    .metric-val {
      font-size: 20px; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; line-height: 1.1;
    }
    .metric-val-lg {
      font-size: 28px; font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em; line-height: 1;
    }
    .metric-unit {
      font-size: 12px; font-weight: 400;
      color: var(--muted); margin-left: 2px;
    }
    .body-sm { font-size: 12px; color: var(--muted); line-height: 1.4; }
    h2 {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted);
      display: flex; align-items: center; gap: 6px;
    }

    /* ─── Layout helpers ───────────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    @media (max-width: 960px) { .grid-4, .grid-5 { grid-template-columns: repeat(2, 1fr); } .grid-2 { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { .grid-4, .grid-5 { grid-template-columns: 1fr 1fr; } }

    /* ─── Components ───────────────────────────────────────────── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-sm { padding: 14px 18px; }
    .badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 20px;
      border: 1px solid currentColor; opacity: 0.85;
    }
    .skel { background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius); }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .section-header {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    /* ─── App Shell ────────────────────────────────────────────── */
    .app-shell { display: flex; height: 100vh; overflow: hidden; }

    /* ─── Sidebar ──────────────────────────────────────────────── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; transition: width 0.22s ease;
    }
    .sidebar.collapsed { width: 52px; }

    .sb-head {
      height: 54px; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px;
      padding: 0 10px 0 14px;
      border-bottom: 1px solid var(--border); overflow: hidden;
    }
    .sb-logo { font-size: 13px; font-weight: 700; flex: 1; white-space: nowrap; letter-spacing: -0.01em; }
    .sidebar.collapsed .sb-logo { display: none; }
    .sb-toggle { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: var(--radius-sm); width: 28px; height: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color .15s, border-color .15s; }
    .sb-toggle:hover { color: var(--text); border-color: var(--muted); }

    .sb-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0 16px; }

    .sb-group-hdr {
      height: 30px; display: flex; align-items: center; gap: 8px;
      padding: 0 14px; cursor: pointer; user-select: none;
      font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--subtle); white-space: nowrap; margin-top: 12px;
    }
    .sb-group-hdr:hover { color: var(--muted); }
    .sb-caret { margin-left: auto; font-size: 10px; flex-shrink: 0; transition: transform 0.18s; }
    .sb-group-hdr.closed .sb-caret { transform: rotate(-90deg); }

    .sb-group-items { max-height: 200px; overflow: hidden; transition: max-height 0.22s ease; }
    .sb-group-items.closed { max-height: 0; }

    .sb-item {
      height: 36px; display: flex; align-items: center; gap: 10px;
      padding: 0 8px 0 24px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap;
      border-radius: var(--radius-sm); margin: 1px 8px;
      transition: background 0.1s, color 0.1s;
    }
    .sb-item:hover { background: var(--surface-2); color: var(--text-secondary); }
    .sb-item.active { background: var(--surface-2); color: var(--blue); }
    .sb-item i { font-size: 15px; flex-shrink: 0; width: 18px; text-align: center; }

    .sidebar.collapsed .sb-group-hdr { padding: 0; justify-content: center; margin-top: 8px; height: 20px; border-top: 1px solid var(--border); }
    .sidebar.collapsed .sb-group-hdr span,
    .sidebar.collapsed .sb-caret { display: none; }
    .sidebar.collapsed .sb-group-items { max-height: 200px !important; }
    .sidebar.collapsed .sb-item { padding: 0; justify-content: center; margin: 2px 4px; }
    .sidebar.collapsed .sb-lbl { display: none; }

    /* ─── Main wrap ────────────────────────────────────────────── */
    .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      height: 54px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px; padding: 0 24px;
    }
    .back-btn {
      display: none; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      background: none; border: none; cursor: pointer;
      padding: 6px 10px 6px 6px; border-radius: var(--radius-sm);
      transition: color .15s, background .15s;
      flex-shrink: 0;
    }
    .back-btn:hover { color: var(--text); background: var(--surface-2); }
    .back-btn i { font-size: 14px; }
    .back-sep { width: 1px; height: 18px; background: var(--border); flex-shrink: 0; }
    .topbar-title { font-size: 15px; font-weight: 600; flex: 1; letter-spacing: -0.01em; }
    .nav-date { font-size: 12px; color: var(--muted); }
    .icon-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: var(--radius-sm); width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s; }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }

    .view-scroller { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 28px 28px 48px; }
    .view { display: none; }
    .view.active { display: block; }

    .section { margin-top: 28px; }
    .section-first { margin-top: 0; }
    .section > h2, .section-first > h2 { margin-bottom: 12px; }

    /* ─── Avatar ───────────────────────────────────────────────── */
    .avatar { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; border: 2px solid var(--border); flex-shrink: 0; background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ─── Wellness tiles ───────────────────────────────────────── */
    .wellness-card { display: flex; flex-direction: column; gap: 6px; }
    .wellness-card .trend { font-size: 12px; color: var(--muted); }
    .trend.up   { color: var(--green); }
    .trend.down { color: var(--rose); }

    /* ─── Sport summary ────────────────────────────────────────── */
    .sport-card { display: flex; flex-direction: column; gap: 12px; }
    .sport-header { display: flex; align-items: center; gap: 8px; }
    .sport-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sport-name { font-size: 14px; font-weight: 600; }
    .sport-count { font-size: 12px; color: var(--muted); margin-left: auto; }
    .sport-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sport-metric-label { font-size: 11px; color: var(--muted); margin-bottom: 1px; letter-spacing: 0.02em; }
    .sport-metric-val   { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ─── Activity list ────────────────────────────────────────── */
    .act-list { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
    .act-row { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    .act-row:last-child { border-bottom: none; }
    .act-row:hover { background: var(--surface-2); }
    .act-summary { padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
    .act-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    .act-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.01em; }
    .act-date { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .act-kpis { margin-left: auto; display: flex; gap: 22px; flex-shrink: 0; align-items: center; }
    .act-kpi  { text-align: right; }
    .act-kpi-v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .act-kpi-l { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .row-arrow { color: var(--subtle); flex-shrink: 0; font-size: 14px; margin-left: 6px; }
    .act-row:hover .row-arrow { color: var(--muted); }

    /* ─── Activity detail page ─────────────────────────────────── */
    .detail-hero {
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .detail-sport-chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 500; color: var(--muted);
      margin-bottom: 10px;
    }
    .hero-kpis {
      display: flex; gap: 32px; flex-wrap: wrap;
      margin-top: 16px;
    }
    .hero-kpi { display: flex; flex-direction: column; gap: 3px; }
    .hero-kpi .label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .hero-kpi .val   { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }

    .detail-metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px; }
    .detail-metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .detail-metric .label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    .detail-metric .val   { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .te-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
    .te-score { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .te-lbl   { font-size: 14px; font-weight: 600; margin-top: 4px; }
    .te-msg   { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

    .zone-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .zone-name { font-size: 12px; color: var(--muted); width: 100px; flex-shrink: 0; font-weight: 500; }
    .zone-bar-track { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; flex: 1; }
    .zone-bar-fill  { height: 6px; border-radius: 3px; transition: width 0.5s ease; }
    .zone-time { font-size: 12px; color: var(--muted); width: 40px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

    .splits-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .splits-table th { text-align: left; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .splits-table td { padding: 9px 12px; border-bottom: 1px solid var(--border-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .splits-table tr:last-child td { border-bottom: none; }
    .splits-table tr:hover td { background: var(--surface-2); }

    .desc-block { font-size: 13px; color: var(--muted); line-height: 1.6; border-left: 2px solid var(--border); padding-left: 14px; }

    /* ─── Logbook ──────────────────────────────────────────────── */
    .logbook-stat { display: flex; flex-direction: column; gap: 4px; }
    .logbook-stat .lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .logbook-stat .val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.025em; }
    .logbook-stat .sub { font-size: 12px; color: var(--muted); }

    .fl-list { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: var(--surface); }
    .fl-row { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    .fl-row:last-child { border-bottom: none; }
    .fl-row:hover { background: var(--surface-2); }
    .fl-summary { padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
    .fl-type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .fl-info { flex: 1; min-width: 0; }
    .fl-route { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .fl-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .fl-kpis  { display: flex; gap: 22px; align-items: center; flex-shrink: 0; }
    .fl-kpi   { text-align: right; }
    .fl-kpi-v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .fl-kpi-l { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .fl-row:hover .row-arrow { color: var(--muted); }

    /* ─── Flight detail page ───────────────────────────────────── */
    .flight-route-header {
      display: flex; align-items: flex-start; gap: 14px;
      flex-wrap: wrap; margin-bottom: 6px;
    }
    .flight-route-label {
      font-size: 24px; font-weight: 800;
      letter-spacing: -0.03em; line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .flight-meta { font-size: 13px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .flight-meta-sep { color: var(--border); }
    .flight-hero-stats { display: flex; gap: 32px; flex-wrap: wrap; margin-top: 20px; }
    .flight-hero-stat .label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .flight-hero-stat .val   { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
    .flight-hero-stat .unit  { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 2px; }

    #fd-map-container { height: 380px; border-radius: var(--radius-lg); overflow: hidden; margin: 24px 0; border: 1px solid var(--border); }
    #fd-map { height: 100%; }

    .ac-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; }
    .ac-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--blue); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .ac-specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 20px; font-size: 13px; color: var(--muted); }
    .ac-spec-key { font-weight: 500; color: var(--text-secondary); }

    .approach-tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); color: var(--teal); border-color: color-mix(in srgb, var(--teal) 40%, transparent); background: color-mix(in srgb, var(--teal) 8%, transparent); }
    .type-badge { display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; padding: 3px 9px; border-radius: 20px; border: 1px solid currentColor; opacity: 0.85; }

    /* ─── Charts ───────────────────────────────────────────────── */
    .apexcharts-tooltip { background: var(--surface) !important; border: 1px solid var(--border) !important; color: var(--text) !important; font-family: 'Inter', sans-serif !important; font-size: 12px !important; box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important; }
    .apexcharts-tooltip-title { background: var(--surface-2) !important; border-bottom: 1px solid var(--border) !important; font-weight: 600 !important; }
    .apexcharts-xaxistooltip { background: var(--surface) !important; border-color: var(--border) !important; color: var(--text) !important; }
    .apexcharts-xaxistooltip-bottom::before, .apexcharts-xaxistooltip-bottom::after { border-bottom-color: var(--border) !important; }

    /* ─── MapLibre overrides ───────────────────────────────────── */
    .maplibregl-popup-content { background: var(--surface) !important; color: var(--text) !important; border: 1px solid var(--border) !important; border-radius: 10px !important; font-family: 'Inter', sans-serif !important; font-size: 13px !important; padding: 12px 16px !important; box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important; }
    .maplibregl-popup-tip { border-top-color: var(--border) !important; border-bottom-color: var(--border) !important; }
    .maplibregl-ctrl-group { background: var(--surface) !important; border: 1px solid var(--border) !important; }
    .maplibregl-ctrl-group button { background: var(--surface) !important; color: var(--muted) !important; border-bottom-color: var(--border) !important; }
    .maplibregl-ctrl-group button:hover { background: var(--surface-2) !important; }

    /* ─── data note ────────────────────────────────────────────── */
    .data-note { font-size: 12px; color: var(--subtle); display: flex; align-items: center; gap: 4px; }

    @media (max-width: 700px) {
      .fl-kpis, .act-kpis { display: none; }
      .sidebar { width: 52px; }
      .sb-logo { display: none !important; }
      .view-scroller { padding: 20px 16px 40px; }
    }
  </style>
</head>
<body>
<div class="app-shell">

  <!-- ─── SIDEBAR ──────────────────────────────────────────────── -->
  <nav class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="avatar" id="nav-avatar">
        <i class="ph-bold ph-user" style="color:var(--muted)"></i>
      </div>
      <div class="sb-logo" id="nav-name">Loading…</div>
      <button class="sb-toggle" id="sb-toggle" title="Toggle sidebar">
        <i class="ph-bold ph-sidebar-simple"></i>
      </button>
    </div>

    <div class="sb-nav">
      <div class="sb-group-hdr" id="sbh-fitness">
        <span>Fitness</span>
        <i class="ph-bold ph-caret-down sb-caret"></i>
      </div>
      <div class="sb-group-items" id="sbi-fitness">
        <div class="sb-item" data-view="overview">
          <i class="ph-bold ph-squares-four"></i>

<script>
'use strict';

// ─── constants ────────────────────────────────────────────────────────────────
const M_TO_MI = 0.000621371;

const SPORT_CFG = {
  running:  { color: '#3fb950', icon: 'ph-person-simple-run',  label: 'Running'  },
  cycling:  { color: '#e3b341', icon: 'ph-bicycle',             label: 'Cycling'  },
  swimming: { color: '#58a6ff', icon: 'ph-waves',               label: 'Swimming' },
  rowing:   { color: '#db61a2', icon: 'ph-rowing',              label: 'Rowing'   },
  other:    { color: '#8b949e', icon: 'ph-activity',            label: 'Other'    },
};

const HR_ZONES = [
  { name: 'Z1 Recovery',  color: '#58a6ff' },
  { name: 'Z2 Base',      color: '#3fb950' },
  { name: 'Z3 Tempo',     color: '#e3b341' },
  { name: 'Z4 Threshold', color: '#f0883e' },
  { name: 'Z5 VO2Max',    color: '#f85149' },
];

const SPLIT_META = {
  INTERVAL_WARMUP:   { label: 'Warmup',   color: '#3fb950' },
  INTERVAL_ACTIVE:   { label: 'Active',   color: '#f85149' },
  INTERVAL_RECOVERY: { label: 'Recovery', color: '#58a6ff' },
  INTERVAL_COOLDOWN: { label: 'Cooldown', color: '#bc8cff' },
  RWD_RUN:           { label: 'Run',      color: '#3fb950' },
  RWD_STAND:         { label: 'Stand',    color: '#6e7681' },
  RWD_WALK:          { label: 'Walk',     color: '#8b949e' },
};

const TYPE_CFG = {
  maneuvers:     { color: '#bc8cff', label: 'Maneuvers' },
  pattern:       { color: '#3fb950', label: 'Pattern'   },
  'x-country':   { color: '#58a6ff', label: 'X-Country' },
  night:         { color: '#e3b341', label: 'Night'     },
  instrument:    { color: '#39d353', label: 'Instrument'},
  solo:          { color: '#db61a2', label: 'Solo'      },
  checkride_prep:{ color: '#f0883e', label: 'Checkride Prep' },
};

const VIEW_TITLES = {
  overview: 'Overview', activities: 'Activities',
  logbook: 'Logbook', 'activity-detail': '', 'flight-detail': '',
};

// ─── lazy init flags ──────────────────────────────────────────────────────────
let _chartsBuilt = false;
let _fdMap = null; // flight detail map instance

// ─── theme ────────────────────────────────────────────────────────────────────
let theme = localStorage.getItem('dash-theme') || 'dark';
applyTheme(theme);
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const icon = document.getElementById('theme-icon');
  if (icon) icon.className = 'ph-bold ' + (t === 'dark' ? 'ph-sun' : 'ph-moon');
}
document.getElementById('theme-btn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('dash-theme', theme);
  applyTheme(theme);
});

// ─── date ─────────────────────────────────────────────────────────────────────
document.getElementById('nav-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

// ─── formatters ───────────────────────────────────────────────────────────────
function fmtMi(m)   { return (m * M_TO_MI).toFixed(2) + ' mi'; }
function fmtDist(m) { if (!m) return '—'; return m * M_TO_MI >= 0.05 ? fmtMi(m) : Math.round(m) + ' m'; }
function fmtTime(s) {
  if (!s) return '—';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${String(sec).padStart(2,'0')}s`;
  return `${sec}s`;
}
function fmtPace(mps) {
  if (!mps || mps <= 0) return '—';
  const spm = 1609.344 / mps;
  return `${Math.floor(spm/60)}:${String(Math.round(spm%60)).padStart(2,'0')}/mi`;
}
function fmtSpeed(mps, sport) {
  if (!mps) return '—';
  return sport === 'cycling' ? (mps * 2.23694).toFixed(1) + ' mph' : fmtPace(mps);
}
function fmtDate(str) {
  if (!str) return '—';
  return new Date(str).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function fmtDateLong(str) {
  if (!str) return '—';
  return new Date(str).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
function fmtHrs(h) { if (!h || parseFloat(h) <= 0) return '—'; return parseFloat(h).toFixed(1) + 'h'; }
function normSport(t) {
  if (!t) return 'other';
  const l = t.toLowerCase();
  if (l.includes('run') || l.includes('treadmill')) return 'running';
  if (l.includes('cycl') || l.includes('bike') || l.includes('ride')) return 'cycling';
  if (l.includes('swim')) return 'swimming';
  if (l.includes('row')) return 'rowing';
  return 'other';
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function typeColor(t) { return (TYPE_CFG[t]||{}).color || '#8b949e'; }
function typeLabel(t) { return (TYPE_CFG[t]||{}).label || (t||'Other'); }
function routeLabel(f) {
  const stops = [f.departure?.icao || f.departure_icao];
  if (f.via && f.via.length) stops.push(...f.via);
  stops.push(f.arrival?.icao || f.arrival_icao);
  return stops.join(' → ');
}

// ─── chart defaults ───────────────────────────────────────────────────────────
const CHART_OPTS = {
  chart: { background: 'transparent', toolbar: { show: false }, fontFamily: 'Inter, sans-serif', foreColor: '#8b949e' },
  grid:  { borderColor: '#21262d', strokeDashArray: 3 },
  tooltip: { theme: 'dark' },
  stroke: { curve: 'smooth' },
};

// ─── view / router ────────────────────────────────────────────────────────────
function showView(viewId, opts = {}) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + viewId);
  if (el) el.classList.add('active');

  // Sidebar active state (detail pages highlight parent)
  const sidebarKey = { 'activity-detail': 'activities', 'flight-detail': 'logbook' }[viewId] || viewId;
  document.querySelectorAll('.sb-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll(`.sb-item[data-view="${sidebarKey}"]`).forEach(n => n.classList.add('active'));

  // Topbar
  const backBtn  = document.getElementById('back-btn');
  const backSep  = document.getElementById('back-sep');
  const backLbl  = document.getElementById('back-label');
  const topTitle = document.getElementById('topbar-title');

  if (opts.back) {
    backBtn.style.display = 'flex';
    backSep.style.display = 'block';
    backBtn.dataset.back  = opts.back;
    backLbl.textContent   = VIEW_TITLES[opts.back] || opts.back;
  } else {
    backBtn.style.display = 'none';
    backSep.style.display = 'none';
  }

  topTitle.textContent = opts.title || VIEW_TITLES[viewId] || '';
  document.getElementById('view-scroller').scrollTop = 0;
  if (!opts.back) localStorage.setItem('dash-view', viewId);
}

document.getElementById('back-btn').addEventListener('click', () => {
  const dest = document.getElementById('back-btn').dataset.back || 'overview';
  navigate(dest);
});

function navigate(view, id) {
  const hash = id ? `#${view}/${id}` : `#${view}`;
  history.pushState(null, '', hash);
  route(view, id);
}

function route(view, id) {
  if (!view) {
    const saved = localStorage.getItem('dash-view') || 'overview';
    const raw = location.hash.slice(1) || (saved === 'trends' ? 'overview' : saved);
    const [v, i] = raw.split('/');
    view = v; id = i;
  }
  switch (view) {
    case 'activities':
      showView('activities', { title: 'Activities' });
      break;
    case 'activity':
      if (id) showActivityDetail(id);
      else showView('activities', { title: 'Activities' });
      break;
    case 'logbook':
      showView('logbook', { title: 'Logbook' });
      break;
    case 'flight':
      if (id) showFlightDetail(id);
      else showView('logbook', { title: 'Logbook' });
      break;
    default:
      showView('overview', { title: 'Overview' });
  }
}

window.addEventListener('popstate', () => route());

// ─── sidebar wiring ───────────────────────────────────────────────────────────
document.querySelectorAll('.sb-item').forEach(item => {
  item.addEventListener('click', () => navigate(item.dataset.view));
});

['fitness','flights'].forEach(grp => {
  const hdr   = document.getElementById('sbh-' + grp);
  const items = document.getElementById('sbi-' + grp);
  if (!hdr||!items) return;
  hdr.addEventListener('click', () => {
    hdr.classList.toggle('closed');
    items.classList.toggle('closed');
  });
});

const sidebar = document.getElementById('sidebar');
if (localStorage.getItem('dash-sidebar') === 'collapsed') sidebar.classList.add('collapsed');
document.getElementById('sb-toggle').addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
  localStorage.setItem('dash-sidebar', sidebar.classList.contains('collapsed') ? 'collapsed' : 'expanded');
});

// ─── wellness ─────────────────────────────────────────────────────────────────
function renderWellness(daily) {
  const d = daily;
  const steps = d.steps;
  const rhr   = d.heart_rate?.restingHeartRate;
  const avgRhr = d.heart_rate?.lastSevenDaysAvgRestingHeartRate;
  const maxHR  = d.heart_rate?.maxHeartRate;
  const sleep  = d.sleep?.dailySleepDTO?.sleepTimeSeconds;
  const deep   = d.sleep?.dailySleepDTO?.deepSleepSeconds;
  const rem    = d.sleep?.dailySleepDTO?.remSleepSeconds;
  const spo2   = d.sleep?.wellnessSpO2SleepSummaryDTO?.averageSPO2;

  if (d.date) {
    const el = document.getElementById('data-date');
    const isToday = d.date === new Date().toISOString().slice(0,10);
    el.textContent = isToday ? '' : '· as of ' + new Date(d.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }

  const tiles = [
    { icon:'ph-person-simple-walk', color:'var(--green)',  label:'Steps',
      value: steps ? steps.toLocaleString() : '—', unit:'',
      sub: steps ? (steps>=10000 ? '✓ Goal reached' : `${(10000-steps).toLocaleString()} to goal`) : '',
      subClass: steps>=10000 ? 'trend up' : 'trend' },
    { icon:'ph-heart',    color:'var(--rose)',   label:'Resting HR',
      value: rhr ? String(rhr) : '—', unit: rhr?'bpm':'',
      sub: avgRhr&&rhr ? (rhr<=avgRhr?`↓ ${avgRhr-rhr} below avg`:`↑ ${rhr-avgRhr} above avg`) : avgRhr?`7d avg: ${avgRhr}`:'' },
    { icon:'ph-heartbeat', color:'var(--orange)', label:'Max HR',
      value: maxHR ? String(maxHR) : '—', unit: maxHR?'bpm':'', sub:'' },
    { icon:'ph-moon',     color:'var(--purple)', label:'Sleep',
      value: sleep ? (sleep/3600).toFixed(1) : '—', unit: sleep?'hrs':'',
      sub: (deep&&rem) ? `${(deep/3600).toFixed(1)}h deep · ${(rem/3600).toFixed(1)}h REM` : '' },
    { icon:'ph-wind',     color:'var(--blue)',   label:'SpO₂',
      value: spo2 ? Math.round(spo2)+'%' : '—', unit:'',
      sub: spo2 ? (spo2>=95?'Normal':'Below normal') : '',
      subClass: spo2&&spo2<95?'trend down':'trend' },
  ];

  document.getElementById('wellness-row').innerHTML = tiles.map(t => `
    <div class="card card-sm wellness-card">
      <div class="eyebrow" style="display:flex;align-items:center;gap:5px">
        <i class="ph-bold ${t.icon}" style="color:${t.color};font-size:12px"></i>${t.label}
      </div>
      <div style="display:flex;align-items:baseline;gap:3px;margin-top:6px">
        <span class="metric-val" style="font-size:22px;color:${t.value==='—'?'var(--muted)':t.color}">${t.value}</span>
        ${t.unit ? `<span class="metric-unit">${t.unit}</span>` : ''}
      </div>
      ${t.sub ? `<div class="${t.subClass||'trend'}" style="margin-top:2px">${t.sub}</div>` : ''}
    </div>`).join('');
}

// ─── weekly ───────────────────────────────────────────────────────────────────
function renderWeekly(bySport) {
  const buckets = { running:null, cycling:null, swimming:null, rowing:null };
  for (const [key,val] of Object.entries(bySport)) {
    const b = normSport(key);
    if (b in buckets) {
      if (!buckets[b]) buckets[b] = { count:0, distance_m:0, moving_time_s:0, calories:0 };
      buckets[b].count += val.count;
      buckets[b].distance_m += val.distance_m;
      buckets[b].moving_time_s += val.moving_time_s;
      buckets[b].calories += val.calories;
    }
  }
  document.getElementById('weekly-row').innerHTML = ['running','cycling','swimming','rowing'].map(sp => {
    const s = buckets[sp];
    const { color, label } = SPORT_CFG[sp];
    if (!s || !s.count) return `
      <div class="card" style="opacity:0.4">
        <div class="sport-header"><span class="sport-dot" style="background:${color}"></span><span class="sport-name">${label}</span></div>
        <div class="body-sm" style="margin-top:10px">No sessions</div>
      </div>`;
    return `
      <div class="card sport-card">
        <div class="sport-header">
          <span class="sport-dot" style="background:${color}"></span>
          <span class="sport-name">${label}</span>
          <span class="sport-count">${s.count} session${s.count>1?'s':''}</span>
        </div>
        <div class="sport-metrics">
          <div><div class="sport-metric-label">Distance</div><div class="sport-metric-val" style="color:${color}">${fmtDist(s.distance_m)}</div></div>
          <div><div class="sport-metric-label">Time</div><div class="sport-metric-val">${fmtTime(s.moving_time_s)}</div></div>
          ${s.distance_m ? `<div><div class="sport-metric-label">Avg/session</div><div class="sport-metric-val">${fmtDist(s.distance_m/s.count)}</div></div>` : ''}
          ${s.calories ? `<div><div class="sport-metric-label">Calories</div><div class="sport-metric-val">${Math.round(s.calories).toLocaleString()}</div></div>` : ''}
        </div>
      </div>`;
  }).join('');
}

// ─── charts ───────────────────────────────────────────────────────────────────
function buildVolumeChart(activities) {
  const days = {}, cutoff = Date.now() - 30*86400000;
  for (const a of activities) {
    const ts = new Date(a.startTimeLocal||0).getTime();
    if (ts < cutoff || !a.distance) continue;
    const day = new Date(ts).toISOString().slice(0,10);
    if (!days[day]) days[day] = { running:0, cycling:0, swimming:0, rowing:0, other:0 };
    days[day][normSport(a.activityType?.typeKey)] += a.distance * M_TO_MI;
  }
  const sorted = Object.keys(days).sort();
  new ApexCharts(document.getElementById('chart-volume'), {
    ...CHART_OPTS,
    chart: { ...CHART_OPTS.chart, type: 'area', height: 190, stacked: true },
    series: ['running','cycling','swimming','rowing','other'].map(sp => ({
      name: SPORT_CFG[sp].label,
      data: sorted.map(d => parseFloat(((days[d]||{})[sp]||0).toFixed(2))),
    })),
    xaxis: { categories: sorted.map(d => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'})),
      labels: { style:{ fontSize:'11px' }, formatter:(v,i)=>{ const step=Math.max(1,Math.floor(sorted.length/6)); return i%step===0?v:''; } } },
    yaxis: { labels: { formatter: v => v.toFixed(1), style:{ fontSize:'11px' } } },
    colors: ['#3fb950','#e3b341','#58a6ff','#db61a2','#8b949e'],
    fill:  { type:'gradient', gradient:{ opacityFrom:0.7, opacityTo:0.2 } },
    stroke: { width: 1.5, curve: 'smooth' },
    dataLabels: { enabled: false },
    legend: { show: true, fontSize: '11px', offsetY: 4 },
    tooltip: { ...CHART_OPTS.tooltip, y: { formatter: v => v.toFixed(2)+' mi' } },
  }).render();
}

function buildLoadChart(activities) {
  const cutoff = Date.now() - 30*86400000;
  const recent = activities.filter(a => new Date(a.startTimeLocal).getTime() >= cutoff && a.activityTrainingLoad)
    .sort((a,b) => new Date(a.startTimeLocal)-new Date(b.startTimeLocal));
  const loads  = recent.map(a => Math.round(a.activityTrainingLoad));
  const avg7   = loads.map((_,i) => { const sl=loads.slice(Math.max(0,i-6),i+1); return Math.round(sl.reduce((s,v)=>s+v,0)/sl.length); });
  const sports = recent.map(a => normSport(a.activityType?.typeKey));
  new ApexCharts(document.getElementById('chart-load'), {
    ...CHART_OPTS,
    chart: { ...CHART_OPTS.chart, type: 'bar', height: 190 },
    series: [{ name:'Load', type:'bar', data:loads }, { name:'7d avg', type:'line', data:avg7 }],
    xaxis: { categories: recent.map(a => fmtDate(a.startTimeLocal)), labels:{ style:{fontSize:'11px'} } },
    yaxis: { labels: { style:{ fontSize:'11px' } } },
    colors: sports.map(sp => SPORT_CFG[sp].color).concat(['#8b949e']),
    plotOptions: { bar: { borderRadius:3, columnWidth:'65%' } },
    stroke: { width:[0,2], curve:'smooth' },
    dataLabels: { enabled:false },
    legend: { show:true, fontSize:'11px', offsetY:4 },
    fill: { opacity:[0.85,1] },
  }).render();
}

function buildHRChart(activities) {
  const cutoff = Date.now() - 7*86400000;
  const recent = activities.filter(a => new Date(a.startTimeLocal).getTime() >= cutoff && a.averageHR)
    .sort((a,b) => new Date(a.startTimeLocal)-new Date(b.startTimeLocal));
  new ApexCharts(document.getElementById('chart-hr'), {
    ...CHART_OPTS,
    chart: { ...CHART_OPTS.chart, type:'line', height:190 },
    series: [
      { name:'Avg HR', data: recent.map(a => Math.round(a.averageHR)) },
      { name:'Max HR', data: recent.map(a => Math.round(a.maxHR||0)) },
    ],
    xaxis: { categories: recent.map(a => fmtDate(a.startTimeLocal)), labels:{style:{fontSize:'11px'}} },
    yaxis: { labels: { formatter: v => v+' bpm', style:{fontSize:'11px'} } },
    colors: ['#db61a2','#f0883e'],
    stroke: { width:[2.5,1.5], dashArray:[0,4] },
    markers: { size:4 },
    dataLabels: { enabled:false },
    legend: { show:true, fontSize:'11px', offsetY:4 },
    tooltip: { ...CHART_OPTS.tooltip, y:{ formatter:v => v+' bpm' } },
  }).render();
}

function buildZonesChart(activity) {
  if (!activity) return;
  document.getElementById('zones-label').textContent = '· ' + fmtDate(activity.startTimeLocal);
  const zones = HR_ZONES.map((z,i) => ({ ...z, mins: Math.round((activity['hrTimeInZone_'+(i+1)]||0)/60) })).filter(z => z.mins > 0);
  if (!zones.length) { document.getElementById('chart-zones').textContent = 'No zone data'; return; }
  new ApexCharts(document.getElementById('chart-zones'), {
    ...CHART_OPTS,
    chart: { ...CHART_OPTS.chart, type:'bar', height:190 },
    series: [{ name:'Minutes', data:zones.map(z=>z.mins) }],
    xaxis: { categories: zones.map(z=>z.name), labels:{style:{fontSize:'11px'}} },
    yaxis: { labels: { formatter:v=>v+'m', style:{fontSize:'11px'} } },
    colors: zones.map(z=>z.color),
    plotOptions: { bar:{ distributed:true, borderRadius:4, columnWidth:'55%' } },
    dataLabels: { enabled:false },
    legend: { show:false },
    tooltip: { ...CHART_OPTS.tooltip, y:{ formatter:v=>v+' min' } },
  }).render();
}

// ─── activity list ────────────────────────────────────────────────────────────

// ─── activity detail page ─────────────────────────────────────────────────────
async function showActivityDetail(id) {
  const a = window._acts?.[id];
  if (!a) { navigate('activities'); return; }

  const sport = normSport(a.activityType?.typeKey);
  const { color, icon, label } = SPORT_CFG[sport];

  showView('activity-detail', {
    back: 'activities',
    title: a.activityName || label,
  });

  const content = document.getElementById('activity-detail-content');
  const heroKpis = [
    a.distance > 0 ? { label:'Distance', val: fmtDist(a.distance), color } : null,
    (a.movingDuration||a.duration) > 0 ? { label:'Duration', val: fmtTime(a.movingDuration||a.duration), color: 'var(--text)' } : null,
    a.averageSpeed > 0 ? { label: sport==='cycling'?'Speed':'Pace', val: fmtSpeed(a.averageSpeed, sport), color:'var(--text)' } : null,
    a.averageHR > 0 ? { label:'Avg HR', val: a.averageHR+' bpm', color:'#db61a2' } : null,
  ].filter(Boolean);

  content.innerHTML = `
    <div class="detail-hero">
      <div class="detail-sport-chip">
        <i class="ph-bold ${icon}" style="color:${color};font-size:14px"></i>
        ${label}
        <span style="color:var(--border)">·</span>
        ${fmtDateLong(a.startTimeLocal)}
      </div>
      <div class="page-title">${esc(a.activityName||label)}</div>
      <div class="hero-kpis">
        ${heroKpis.map(k => `<div class="hero-kpi">
          <div class="label">${k.label}</div>
          <div class="val" style="color:${k.color}">${esc(k.val)}</div>
        </div>`).join('')}
      </div>
    </div>
    <div id="act-detail-body">
      <div style="display:flex;align-items:center;gap:8px;color:var(--muted)"><div class="spinner"></div> Loading…</div>
    </div>`;

  try {
    const detail = await fetch('/api/activities/' + id).then(r => r.json());
    document.getElementById('act-detail-body').innerHTML = buildActivityDetailHTML(a, detail);
  } catch(e) {
    document.getElementById('act-detail-body').innerHTML =
      `<div style="color:var(--rose);font-size:13px">Failed to load activity detail.</div>`;
  }
}

function buildActivityDetailHTML(a, detail) {
  const sport  = normSport(a.activityType?.typeKey);
  const s      = detail.summaryDTO || {};
  const splits = (detail.splitSummaries || []).filter(sp => sp.distance > 0 || sp.duration > 0);
  const meta   = detail.metadataDTO || {};
  const bbDiff = s.differenceBodyBattery ?? a.differenceBodyBattery;

  const metrics = [
    ['Avg HR',        a.averageHR ? Math.round(a.averageHR)+' bpm' : null,      '#db61a2'],
    ['Max HR',        a.maxHR ? Math.round(a.maxHR)+' bpm' : null,              '#f0883e'],
    ['Min HR',        s.minHR ? Math.round(s.minHR)+' bpm' : null,              '#58a6ff'],
    ['Avg Power',     (s.averagePower||a.avgPower) ? Math.round(s.averagePower||a.avgPower)+' W' : null, '#e3b341'],
    ['Norm Power',    (s.normalizedPower||a.normPower) ? Math.round(s.normalizedPower||a.normPower)+' W' : null, '#e3b341'],
    ['Max Power',     (s.maxPower||a.maxPower) ? Math.round(s.maxPower||a.maxPower)+' W' : null, '#f0883e'],
    ['Pace',          fmtSpeed(s.averageSpeed||a.averageSpeed, sport) !== '—' ? fmtSpeed(s.averageSpeed||a.averageSpeed, sport) : null],
    ['Max Pace',      fmtSpeed(s.maxSpeed||a.maxSpeed, sport) !== '—' ? fmtSpeed(s.maxSpeed||a.maxSpeed, sport) : null],
    ['Cadence',       (s.averageRunCadence||a.averageRunningCadenceInStepsPerMinute) ? Math.round(s.averageRunCadence||a.averageRunningCadenceInStepsPerMinute)+' spm' : null],
    ['Stride',        (s.strideLength||a.avgStrideLength) ? ((s.strideLength||a.avgStrideLength)/100).toFixed(2)+' m' : null],
    ['Gnd Contact',   (s.groundContactTime||a.avgGroundContactTime) ? Math.round(s.groundContactTime||a.avgGroundContactTime)+' ms' : null],
    ['Vert Osc',      (s.verticalOscillation||a.avgVerticalOscillation) ? (s.verticalOscillation||a.avgVerticalOscillation).toFixed(1)+' cm' : null],
    ['Training Load', (s.activityTrainingLoad||a.activityTrainingLoad) ? Math.round(s.activityTrainingLoad||a.activityTrainingLoad) : null, '#bc8cff'],
    ['Calories',      (s.calories||a.calories) ? (s.calories||a.calories)+' kcal' : null],
    ['Body Battery',  bbDiff != null ? (bbDiff>0?'+':'')+bbDiff : null, bbDiff > 0 ? '#3fb950' : '#f85149'],
    ['Total Work',    s.totalWork ? s.totalWork.toFixed(1)+' kJ' : null],
    ['Steps',         (s.steps||a.steps) ? (s.steps||a.steps).toLocaleString() : null],
    ['Laps',          meta.lapCount != null ? String(meta.lapCount) : null],
  ].filter(([,v]) => v);

  const metricsHTML = metrics.length ? `
    <div class="section-header">Performance</div>
    <div class="detail-metric-grid">
      ${metrics.map(([l,v,c]) => `<div class="detail-metric">
        <div class="label">${l}</div>
        <div class="val" ${c?`style="color:${c}"`:''}>${esc(v)}</div>
      </div>`).join('')}
    </div>` : '';

  let teHTML = '';
  if (a.aerobicTrainingEffect > 0 || a.anaerobicTrainingEffect > 0) {
    teHTML = `<div class="section-header" style="margin-top:28px">Training Effect</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:24px">
      ${a.aerobicTrainingEffect > 0 ? `<div class="te-card">
        <div class="eyebrow" style="margin-bottom:8px">Aerobic</div>
        <div class="te-score" style="color:#3fb950">${a.aerobicTrainingEffect.toFixed(1)}</div>
        <div class="te-lbl" style="color:#3fb950">${esc((a.trainingEffectLabel||'').toLowerCase())}</div>
        <div class="te-msg">${esc((a.aerobicTrainingEffectMessage||'').replace(/_/g,' ').toLowerCase())}</div>
      </div>` : ''}
      ${a.anaerobicTrainingEffect > 0 ? `<div class="te-card">
        <div class="eyebrow" style="margin-bottom:8px">Anaerobic</div>
        <div class="te-score" style="color:#e3b341">${a.anaerobicTrainingEffect.toFixed(1)}</div>
        <div class="te-msg">${esc((a.anaerobicTrainingEffectMessage||'').replace(/_/g,' ').toLowerCase())}</div>
      </div>` : ''}
    </div>`;
  }

  const hrZones  = HR_ZONES.map((z,i) => ({ ...z, secs: a['hrTimeInZone_'+(i+1)] || 0 }));
  const pwrZones = HR_ZONES.map((z,i) => ({ name:'PZ'+(i+1), color:z.color, secs: a['powerTimeInZone_'+(i+1)] || 0 }));
  const hrTotal  = hrZones.reduce((s,z)=>s+z.secs,0);
  const pwrTotal = pwrZones.reduce((s,z)=>s+z.secs,0);
  const zoneBar  = (z,total) => `<div class="zone-row">
    <span class="zone-name">${z.name}</span>
    <div class="zone-bar-track"><div class="zone-bar-fill" style="width:${total?(z.secs/total*100).toFixed(1):0}%;background:${z.color}"></div></div>
    <span class="zone-time">${fmtTime(z.secs)}</span>
  </div>`;

  let zonesHTML = '';
  if (hrTotal || pwrTotal) {
    zonesHTML = `<div class="section-header" style="margin-top:28px">Zones</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin-bottom:24px">
      ${hrTotal  ? `<div><div class="eyebrow" style="margin-bottom:12px">Heart Rate</div>${hrZones.filter(z=>z.secs>0).map(z=>zoneBar(z,hrTotal)).join('')}</div>` : ''}
      ${pwrTotal ? `<div><div class="eyebrow" style="margin-bottom:12px">Power</div>${pwrZones.filter(z=>z.secs>0).map(z=>zoneBar(z,pwrTotal)).join('')}</div>` : ''}
    </div>`;
  }

  let splitsHTML = '';
  if (splits.length) {
    const sport2 = normSport(a.activityType?.typeKey);
    splitsHTML = `<div class="section-header" style="margin-top:28px">Intervals &amp; Splits</div>
    <div style="overflow-x:auto;margin-bottom:24px">
      <table class="splits-table">
        <thead><tr><th>Type</th><th>n</th><th>Dist</th><th>Time</th><th>Pace</th><th>Avg HR</th><th>Max HR</th><th>Avg W</th><th>NP</th><th>Cadence</th><th>Cal</th></tr></thead>
        <tbody>${splits.map(sp => {
          const m = SPLIT_META[sp.splitType] || { label:sp.splitType, color:'#8b949e' };
          return `<tr>
            <td><span class="badge" style="color:${m.color};border-color:${m.color}">${m.label}</span></td>
            <td style="color:var(--muted)">${sp.noOfSplits||1}</td>
            <td>${fmtDist(sp.distance)}</td>
            <td>${fmtTime(sp.movingDuration||sp.duration)}</td>
            <td>${fmtSpeed(sp.averageMovingSpeed||sp.averageSpeed, sport2)}</td>
            <td>${sp.averageHR ? Math.round(sp.averageHR) : '—'}</td>
            <td>${sp.maxHR ? Math.round(sp.maxHR) : '—'}</td>
            <td>${sp.averagePower ? Math.round(sp.averagePower)+'W' : '—'}</td>
            <td>${sp.normalizedPower ? Math.round(sp.normalizedPower)+'W' : '—'}</td>
            <td>${sp.averageRunCadence ? Math.round(sp.averageRunCadence) : '—'}</td>
            <td>${sp.calories||'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }

  const descHTML = a.description ? `<div class="section-header" style="margin-top:28px">Notes</div><div class="desc-block">${esc(a.description)}</div>` : '';

  return metricsHTML + teHTML + zonesHTML + splitsHTML + descHTML;
}

    <!-- Route Map -->
    <div id="fd-map-container">
      <div id="fd-map"></div>
    </div>

    <!-- All flight time metrics -->
    <div class="section-header">Flight Time Breakdown</div>
    <div class="detail-metric-grid">
      ${allMetrics.map(([l,v,c]) => `<div class="detail-metric">
        <div class="label">${l}</div>
        <div class="val" ${c?`style="color:${c}"`:''}>${esc(String(v))}</div>
      </div>`).join('')}
    </div>

    ${acHTML}

    ${(f.approaches&&f.approaches.length) ? `
    <div class="section-header" style="margin-top:28px">Approaches</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px">
      ${f.approaches.map(ap => `<span class="approach-tag">
        ${esc(ap.approach_type)} ${ap.runway?'Rwy '+esc(ap.runway):''} ${esc(ap.airport_icao||'')}${ap.circle_to_land?' C/L':''}
      </span>`).join('')}
    </div>` : ''}

    ${(f.flight_review||f.checkride||f.ipc) ? `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px">
      ${f.flight_review ? '<span class="type-badge" style="color:#e3b341;border-color:#e3b341">Flight Review</span>' : ''}
      ${f.checkride     ? '<span class="type-badge" style="color:#3fb950;border-color:#3fb950">Checkride</span>'    : ''}
      ${f.ipc           ? '<span class="type-badge" style="color:#58a6ff;border-color:#58a6ff">IPC</span>'          : ''}
    </div>` : ''}

    ${f.instructor_comments ? `
    <div class="section-header" style="margin-top:28px">Instructor Notes</div>
    <div class="desc-block" style="margin-bottom:24px">${esc(f.instructor_comments)}</div>` : ''}

    ${f.remarks ? `
    <div class="section-header" style="margin-top:${f.instructor_comments?'0':'28px'}">Remarks</div>
    <div class="desc-block">${esc(f.remarks)}</div>` : ''}

    ${f.foreflight_source ? `<div class="body-sm" style="margin-top:20px;color:var(--subtle)">· Imported from ForeFlight</div>` : ''}
  `;

  // Init the per-flight map after the DOM is painted
  if (_fdMap) { try { _fdMap.remove(); } catch(_) {} _fdMap = null; }
  requestAnimationFrame(() => initFlightDetailMap(f));
}

async function initFlightDetailMap(f) {
  const container = document.getElementById('fd-map');
  if (!container) return;

  _fdMap = new maplibregl.Map({
    container: 'fd-map',
    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
    center: [f.departure?.lon || -122.0, f.departure?.lat || 37.5],
    zoom: 8,
    attributionControl: false,
  });
  _fdMap.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  _fdMap.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  _fdMap.on('load', async () => {
    // Fetch GPS track if available
    let coords = [];
    if (f.has_track) {
      try {
        const pts = await fetch('/api/flights/' + f.id + '/track').then(r => r.ok ? r.json() : []);
        coords = pts.map(p => [p.lon, p.lat]);
      } catch(_) {}
    }
    if (coords.length < 2) {
      if (f.departure?.lon) coords.push([f.departure.lon, f.departure.lat]);
      if (f.via_airports) for (const a of f.via_airports) { if (a.lon) coords.push([a.lon, a.lat]); }
      if (f.arrival?.lon)  coords.push([f.arrival.lon,  f.arrival.lat]);
    }

    if (coords.length >= 2) {
      _fdMap.addSource('route', {
        type: 'geojson',
        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } },
      });
      _fdMap.addLayer({ id:'route-glow', type:'line', source:'route',
        paint: { 'line-color': typeColor(f.training_type), 'line-width': 6, 'line-opacity': 0.2, 'line-blur': 4 } });
      _fdMap.addLayer({ id:'route-line', type:'line', source:'route',
        paint: { 'line-color': typeColor(f.training_type), 'line-width': 2.5, 'line-opacity': 0.9 } });

      // Fit map to route
      const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      _fdMap.fitBounds(bounds, { padding: 56, duration: 600 });
    }

    // Airport markers
    const apts = [];
    if (f.departure?.lon) apts.push(f.departure);
    if (f.via_airports)   f.via_airports.filter(a=>a.lon).forEach(a => apts.push(a));
    if (f.arrival?.lon)   apts.push(f.arrival);

    if (apts.length) {
      _fdMap.addSource('apts', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: apts.map(a => ({
          type: 'Feature',
          properties: { icao: a.icao, name: a.name },
          geometry: { type: 'Point', coordinates: [a.lon, a.lat] },
        })) },
      });
      _fdMap.addLayer({ id:'apts-dot', type:'circle', source:'apts',
        paint: { 'circle-radius': 6, 'circle-color': '#58a6ff', 'circle-stroke-width': 2, 'circle-stroke-color': '#0d1117' } });
      _fdMap.addLayer({ id:'apts-lbl', type:'symbol', source:'apts',
        layout: { 'text-field': ['get','icao'], 'text-size': 11, 'text-offset': [0, 1.5], 'text-anchor': 'top', 'text-font':['Noto Sans Regular'] },
        paint:  { 'text-color': '#c9d1d9', 'text-halo-color': '#0d1117', 'text-halo-width': 1.5 } });

      _fdMap.on('click', 'apts-dot', e => {
        const p = e.features[0].properties;
        new maplibregl.Popup({ offset: 10, closeButton: false })
          .setLngLat(e.features[0].geometry.coordinates)
          .setHTML(`<strong>${p.icao}</strong>${p.name?'<br>'+p.name:''}`)
          .addTo(_fdMap);
      });
      _fdMap.on('mouseenter', 'apts-dot', () => _fdMap.getCanvas().style.cursor = 'pointer');
      _fdMap.on('mouseleave', 'apts-dot', () => _fdMap.getCanvas().style.cursor = '');
    }
  });
}

// ─── load flights ─────────────────────────────────────────────────────────────
async function loadFlights() {
  const [statsRes, flightsRes] = await Promise.allSettled([
    fetch('/api/stats/logbook').then(r => r.ok ? r.json() : null),
    fetch('/api/flights').then(r => r.ok ? r.json() : []),
  ]);
  const stats   = statsRes.status   === 'fulfilled' ? statsRes.value   : null;
  const flights = flightsRes.status === 'fulfilled' ? flightsRes.value : [];

  if (stats) renderLogbookStats(stats);
  else document.getElementById('logbook-stats').innerHTML =
    '<div style="color:var(--muted);font-size:13px;padding:14px">Flight data unavailable</div>';

  window._flights = Array.isArray(flights) ? flights : [];
  renderFlights(window._flights);
}

// ─── bootstrap ────────────────────────────────────────────────────────────────
(async function main() {
  const [athlete, activities, weekly, daily] = await Promise.all([
    fetch('/api/athlete').then(r => r.json()),
    fetch('/api/activities?limit=200').then(r => r.json()),
    fetch('/api/stats/weekly').then(r => r.json()),
    fetch('/api/stats/daily').then(r => r.json()).catch(() => ({})),
  ]);

  const name = athlete.fullName || 'Athlete';
  document.getElementById('nav-name').textContent = name;
  if (athlete.profileImageUrlSmall) {
    document.getElementById('nav-avatar').innerHTML =
      `<img src="${esc(athlete.profileImageUrlSmall)}" alt="avatar">`;
  }

  window._actsArr = Array.isArray(activities) ? activities : [];
  renderWellness(daily || {});
  renderWeekly((weekly && weekly.by_sport) || {});
  renderActivities(window._actsArr);

  // Build trend charts — they live on the overview page, always rendered
  buildVolumeChart(window._actsArr);
  buildLoadChart(window._actsArr);
  buildHRChart(window._actsArr);
  buildZonesChart(window._actsArr[0]);

  loadFlights().catch(err => {
    document.getElementById('logbook-stats').innerHTML =
      '<div style="color:var(--muted);font-size:13px;padding:14px">Flight data unavailable — DB not connected</div>';
    document.getElementById('fl-list').innerHTML =
      '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No flight data</div>';
    window._flights = [];
  });

  // Route after data is in place (handles direct deep links on load)
  route();
})().catch(err => {
  console.error(err);
  document.getElementById('act-list').innerHTML =
    `<div style="padding:40px;text-align:center;color:var(--rose);font-size:13px">Failed to load: ${esc(err.message)}</div>`;
  route();
});
</script>
