<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gacoka — Athlete Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    .row-toggle { cursor: pointer; transition: background 0.12s; }
    .row-toggle:hover { background: rgba(255,255,255,0.05); }
    [data-theme="light"] .row-toggle:hover { background: rgba(0,0,0,0.04); }
    .zone-bar { height: 6px; border-radius: 3px; transition: width 0.4s ease; }
    .detail-panel { display: none; }
    .detail-panel.open { display: block; }
    .chevron-icon { transition: transform 0.2s; }
    .chevron-icon.open { transform: rotate(180deg); }
    canvas { max-height: 200px; }
  </style>
</head>
<body class="min-h-screen bg-base-100">

<!-- NAVBAR -->
<nav class="navbar bg-base-200 border-b border-base-300 px-4 sm:px-6 sticky top-0 z-50 shadow-sm">
  <div class="flex-1 flex items-center gap-3">
    <div id="nav-avatar" class="avatar placeholder">
      <div class="bg-neutral text-neutral-content rounded-full w-9">
        <i class="ph-bold ph-user text-lg"></i>
      </div>
    </div>
    <div>
      <div id="nav-name" class="font-bold text-sm leading-tight">Loading…</div>
      <div class="text-xs opacity-50 leading-tight">Ironman Trainee · 2026 SF Marathon</div>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <span id="nav-date" class="text-xs opacity-40 hidden sm:block"></span>
    <button id="theme-toggle" class="btn btn-ghost btn-sm btn-circle" title="Toggle theme">
      <i class="ph-bold ph-sun text-lg"></i>
    </button>
  </div>
</nav>

<div class="max-w-7xl mx-auto px-4 py-6 space-y-6">

  <!-- WELLNESS -->
  <section>
    <h2 class="text-xs font-semibold opacity-50 uppercase tracking-wider mb-3 flex items-center gap-1.5">
      <i class="ph-bold ph-heartbeat"></i> Today
    </h2>
    <div class="stats stats-horizontal bg-base-200 shadow w-full flex-wrap" id="wellness-stats">
      <div class="stat"><div class="skeleton h-4 w-20 mb-2 rounded"></div><div class="skeleton h-8 w-16 rounded"></div></div>
      <div class="stat"><div class="skeleton h-4 w-20 mb-2 rounded"></div><div class="skeleton h-8 w-16 rounded"></div></div>
      <div class="stat"><div class="skeleton h-4 w-20 mb-2 rounded"></div><div class="skeleton h-8 w-16 rounded"></div></div>
      <div class="stat"><div class="skeleton h-4 w-20 mb-2 rounded"></div><div class="skeleton h-8 w-16 rounded"></div></div>
      <div class="stat"><div class="skeleton h-4 w-20 mb-2 rounded"></div><div class="skeleton h-8 w-16 rounded"></div></div>
    </div>
  </section>

  <!-- WEEKLY SPORTS -->
  <section>
    <h2 class="text-xs font-semibold opacity-50 uppercase tracking-wider mb-3 flex items-center gap-1.5">
      <i class="ph-bold ph-calendar-check"></i> This Week
    </h2>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="weekly-sports">
      <div class="card bg-base-200 shadow h-28"><div class="card-body"><div class="skeleton h-full w-full rounded"></div></div></div>
      <div class="card bg-base-200 shadow h-28"><div class="card-body"><div class="skeleton h-full w-full rounded"></div></div></div>
      <div class="card bg-base-200 shadow h-28"><div class="card-body"><div class="skeleton h-full w-full rounded"></div></div></div>
      <div class="card bg-base-200 shadow h-28"><div class="card-body"><div class="skeleton h-full w-full rounded"></div></div></div>
    </div>
  </section>

  <!-- CHARTS -->
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <div class="card bg-base-200 shadow border border-base-300">
      <div class="card-body p-4">
        <h3 class="font-semibold text-sm flex items-center gap-2 mb-3">
          <i class="ph-bold ph-chart-line-up" style="color:#4ade80"></i> 30-Day Volume
        </h3>
        <div style="position:relative;height:200px"><canvas id="chart-volume"></canvas></div>
      </div>
    </div>
    <div class="card bg-base-200 shadow border border-base-300">
      <div class="card-body p-4">
        <h3 class="font-semibold text-sm flex items-center gap-2 mb-3">
          <i class="ph-bold ph-heartbeat" style="color:#f472b6"></i> 7-Day Heart Rate
        </h3>
        <div style="position:relative;height:200px"><canvas id="chart-hr"></canvas></div>
      </div>
    </div>
    <div class="card bg-base-200 shadow border border-base-300">
      <div class="card-body p-4">
        <h3 class="font-semibold text-sm flex items-center gap-2 mb-3">
          <i class="ph-bold ph-lightning" style="color:#facc15"></i> 30-Day Training Load
        </h3>
        <div style="position:relative;height:200px"><canvas id="chart-load"></canvas></div>
      </div>
    </div>
    <div class="card bg-base-200 shadow border border-base-300">
      <div class="card-body p-4">
        <h3 class="font-semibold text-sm flex items-center gap-2 mb-3">
          <i class="ph-bold ph-chart-bar" style="color:#38bdf8"></i>
          <span>HR Zones</span>
          <span id="zones-subtitle" class="text-xs opacity-40 ml-auto"></span>
        </h3>
        <div style="position:relative;height:200px"><canvas id="chart-zones"></canvas></div>
      </div>
    </div>
  </section>

  <!-- ACTIVITY LIST -->
  <section>
    <div class="card bg-base-200 shadow border border-base-300">
      <div class="px-4 py-3 border-b border-base-300 flex items-center gap-2">
        <i class="ph-bold ph-list-bullets opacity-60"></i>
        <h3 class="font-semibold text-sm">Recent Activities</h3>
        <span id="activity-count" class="ml-auto text-xs opacity-40"></span>
      </div>
      <div id="activity-list">
        <div class="p-4 space-y-3">
          <div class="skeleton h-12 w-full rounded"></div>
          <div class="skeleton h-12 w-full rounded"></div>
          <div class="skeleton h-12 w-full rounded"></div>
          <div class="skeleton h-12 w-full rounded"></div>
          <div class="skeleton h-12 w-full rounded"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="text-center text-xs opacity-20 py-4">gacoka.com · Garmin Connect</footer>
</div>

<script>
'use strict';

// ─── constants ────────────────────────────────────────────────────────────────
const M_TO_MI = 0.000621371;
const SPORT = {
  running:  { color: '#4ade80', icon: 'ph-person-simple-run' },
  cycling:  { color: '#facc15', icon: 'ph-bicycle' },
  swimming: { color: '#38bdf8', icon: 'ph-waves' },
  rowing:   { color: '#f472b6', icon: 'ph-rowing' },
  other:    { color: '#a78bfa', icon: 'ph-activity' },
};
const HR_ZONES = [
  { name: 'Z1 Recovery',  color: '#38bdf8' },
  { name: 'Z2 Base',      color: '#4ade80' },
  { name: 'Z3 Tempo',     color: '#facc15' },
  { name: 'Z4 Threshold', color: '#fb923c' },
  { name: 'Z5 VO2Max',    color: '#f87171' },
];
const SPLIT_META = {
  INTERVAL_WARMUP:   { label: 'Warmup',   color: '#4ade80' },
  INTERVAL_ACTIVE:   { label: 'Active',   color: '#f87171' },
  INTERVAL_RECOVERY: { label: 'Recovery', color: '#38bdf8' },
  INTERVAL_COOLDOWN: { label: 'Cooldown', color: '#818cf8' },
  RWD_RUN:           { label: 'Run',      color: '#4ade80' },
  RWD_STAND:         { label: 'Stand',    color: '#6b7280' },
  RWD_WALK:          { label: 'Walk',     color: '#a78bfa' },
};

// ─── formatters ──────────────────────────────────────────────────────────────
function fmtDist(m) {
  if (!m) return '—';
  const mi = m * M_TO_MI;
  return mi >= 0.05 ? mi.toFixed(2) + ' mi' : Math.round(m) + ' m';
}
function fmtTime(s) {
  if (!s) return '—';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${String(sec).padStart(2,'0')}s`;
  return `${sec}s`;
}
function fmtPace(mps) {
  if (!mps || mps <= 0) return '—';
  const spm = 1609.344 / mps;
  return `${Math.floor(spm/60)}:${String(Math.round(spm%60)).padStart(2,'0')}/mi`;
}
function fmtSpeed(mps, sport) {
  if (!mps) return '—';
  return sport === 'cycling' ? (mps * 2.23694).toFixed(1) + ' mph' : fmtPace(mps);
}
function fmtDate(str) {
  if (!str) return '—';
  return new Date(str).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function normSport(t) {
  if (!t) return 'other';
  const l = t.toLowerCase();
  if (l.includes('run') || l.includes('treadmill')) return 'running';
  if (l.includes('cycl') || l.includes('bike') || l.includes('ride')) return 'cycling';
  if (l.includes('swim')) return 'swimming';
  if (l.includes('row')) return 'rowing';
  return 'other';
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── theme ────────────────────────────────────────────────────────────────────
let currentTheme = localStorage.getItem('dash-theme') || 'dim';
document.documentElement.setAttribute('data-theme', currentTheme);
document.getElementById('theme-toggle').querySelector('i').className =
  'ph-bold ' + (currentTheme === 'dim' ? 'ph-sun' : 'ph-moon') + ' text-lg';

document.getElementById('theme-toggle').addEventListener('click', () => {
  currentTheme = currentTheme === 'dim' ? 'light' : 'dim';
  localStorage.setItem('dash-theme', currentTheme);
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('theme-toggle').querySelector('i').className =
    'ph-bold ' + (currentTheme === 'dim' ? 'ph-sun' : 'ph-moon') + ' text-lg';
});

// ─── nav date ─────────────────────────────────────────────────────────────────
document.getElementById('nav-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

// ─── chart defaults ───────────────────────────────────────────────────────────
Chart.defaults.color = 'rgba(150,150,170,0.8)';
Chart.defaults.borderColor = 'rgba(150,150,170,0.1)';
Chart.defaults.font.size = 11;

function chartOpts(extra) {
  return Object.assign({
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { labels: { boxWidth: 10, padding: 10 } } },
  }, extra);
}

// ─── API ─────────────────────────────────────────────────────────────────────
async function api(path) {
  const r = await fetch(path);
  return r.json();
}

// ─── render wellness ─────────────────────────────────────────────────────────
function renderWellness(daily) {
  const steps = daily.steps;
  const rhr   = daily.heart_rate && daily.heart_rate.restingHeartRate;
  const maxHR = daily.heart_rate && daily.heart_rate.maxHeartRate;
  const sleepS = daily.sleep && daily.sleep.dailySleepDTO && daily.sleep.dailySleepDTO.sleepTimeSeconds;
  const spo2  = daily.sleep && daily.sleep.wellnessSpO2SleepSummaryDTO && daily.sleep.wellnessSpO2SleepSummaryDTO.averageSPO2;

  const tiles = [
    { icon: 'ph-person-simple-walk', label: 'Steps',      value: steps  ? steps.toLocaleString()          : '—', unit: '',      color: '#4ade80' },
    { icon: 'ph-heart',              label: 'Resting HR',  value: rhr    ? rhr                             : '—', unit: rhr  ? 'bpm' : '', color: '#f472b6' },
    { icon: 'ph-heartbeat',          label: 'Max HR',      value: maxHR  ? maxHR                           : '—', unit: maxHR? 'bpm' : '', color: '#fb923c' },
    { icon: 'ph-moon',               label: 'Sleep',       value: sleepS ? (sleepS/3600).toFixed(1)        : '—', unit: sleepS ? 'hrs' : '', color: '#818cf8' },
    { icon: 'ph-wind',               label: 'SpO₂',        value: spo2   ? Math.round(spo2) + '%'          : '—', unit: '',      color: '#38bdf8' },
  ];

  document.getElementById('wellness-stats').innerHTML = tiles.map(t => `
    <div class="stat">
      <div class="stat-figure text-2xl" style="color:${t.color}"><i class="ph-bold ${t.icon}"></i></div>
      <div class="stat-title text-xs">${t.label}</div>
      <div class="stat-value text-xl font-bold" style="color:${t.color}">${t.value}</div>
      ${t.unit ? `<div class="stat-desc">${t.unit}</div>` : ''}
    </div>
  `).join('');
}

// ─── render weekly sports ─────────────────────────────────────────────────────
function renderWeekly(bySport) {
  const sports = ['running','cycling','swimming','rowing'];
  document.getElementById('weekly-sports').innerHTML = sports.map(sp => {
    const s = bySport[sp] || {};
    const { color, icon } = SPORT[sp];
    return `
      <div class="card bg-base-200 shadow border border-base-300">
        <div class="card-body p-4 gap-2">
          <div class="flex items-center gap-2">
            <i class="ph-bold ${icon} text-xl" style="color:${color}"></i>
            <span class="font-semibold text-sm capitalize">${sp}</span>
            <span class="ml-auto badge badge-sm badge-ghost opacity-50">${s.count||0}×</span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div><div class="text-xs opacity-50">Distance</div><div class="font-bold text-sm" style="color:${color}">${fmtDist(s.distance_m)}</div></div>
            <div><div class="text-xs opacity-50">Time</div><div class="font-bold text-sm">${fmtTime(s.moving_time_s)}</div></div>
          </div>
          ${s.calories > 0 ? `<div class="text-xs opacity-40">${Math.round(s.calories).toLocaleString()} kcal</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// ─── charts ──────────────────────────────────────────────────────────────────
function renderVolumeChart(activities) {
  const days = {}, cutoff = Date.now() - 30*86400000;
  for (const a of activities) {
    const ts = new Date(a.startTimeLocal || 0).getTime();
    if (ts < cutoff || !a.distance) continue;
    const day = new Date(ts).toISOString().slice(0,10);
    if (!days[day]) days[day] = { running:0, cycling:0, swimming:0, rowing:0, other:0 };
    days[day][normSport(a.activityType && a.activityType.typeKey)] += a.distance * M_TO_MI;
  }
  const labels = Object.keys(days).sort().map(d => new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
  const dayVals = Object.keys(days).sort().map(d => days[d]);
  const sports = ['running','cycling','swimming','rowing','other'];

  new Chart(document.getElementById('chart-volume'), {
    type: 'bar',
    data: {
      labels,
      datasets: sports.map(sp => ({
        label: sp,
        data: dayVals.map(d => parseFloat((d[sp]||0).toFixed(2))),
        backgroundColor: SPORT[sp].color + 'aa',
        borderColor: SPORT[sp].color,
        borderWidth: 1,
        stack: 'v',
      }))
    },
    options: chartOpts({
      scales: {
        x: { stacked: true, ticks: { maxTicksLimit: 8 } },
        y: { stacked: true, title: { display: true, text: 'mi' } }
      }
    })
  });
}

function renderHRChart(activities) {
  const cutoff = Date.now() - 7*86400000;
  const recent = activities
    .filter(a => new Date(a.startTimeLocal).getTime() >= cutoff && a.averageHR)
    .sort((a,b) => new Date(a.startTimeLocal)-new Date(b.startTimeLocal));

  new Chart(document.getElementById('chart-hr'), {
    type: 'line',
    data: {
      labels: recent.map(a => fmtDate(a.startTimeLocal)),
      datasets: [
        { label: 'Avg HR', data: recent.map(a => Math.round(a.averageHR)), borderColor: '#f472b6', backgroundColor: '#f472b620', tension: 0.3, pointRadius: 4, fill: false },
        { label: 'Max HR', data: recent.map(a => Math.round(a.maxHR||0)),  borderColor: '#fb923c', backgroundColor: '#fb923c20', tension: 0.3, pointRadius: 3, borderDash: [4,3], fill: false },
      ]
    },
    options: chartOpts({ scales: { y: { title: { display: true, text: 'bpm' } } } })
  });
}

function renderLoadChart(activities) {
  const cutoff = Date.now() - 30*86400000;
  const recent = activities
    .filter(a => new Date(a.startTimeLocal).getTime() >= cutoff && a.activityTrainingLoad)
    .sort((a,b) => new Date(a.startTimeLocal)-new Date(b.startTimeLocal));

  new Chart(document.getElementById('chart-load'), {
    type: 'bar',
    data: {
      labels: recent.map(a => fmtDate(a.startTimeLocal)),
      datasets: [{
        label: 'Training Load',
        data: recent.map(a => Math.round(a.activityTrainingLoad)),
        backgroundColor: recent.map(a => (SPORT[normSport(a.activityType && a.activityType.typeKey)] || SPORT.other).color + 'bb'),
        borderRadius: 4,
      }]
    },
    options: chartOpts({ plugins: { legend: { display: false } }, scales: { x: { ticks: { maxTicksLimit: 10 } } } })
  });
}

function renderZoneChart(activity) {
  if (!activity) return;
  document.getElementById('zones-subtitle').textContent = 'last · ' + fmtDate(activity.startTimeLocal);
  const zones = HR_ZONES.map((z,i) => ({
    ...z,
    mins: Math.round((activity['hrTimeInZone_' + (i+1)] || 0) / 60)
  })).filter(z => z.mins > 0);

  if (!zones.length) return;
  new Chart(document.getElementById('chart-zones'), {
    type: 'bar',
    data: {
      labels: zones.map(z => z.name),
      datasets: [{
        data: zones.map(z => z.mins),
        backgroundColor: zones.map(z => z.color + 'cc'),
        borderColor: zones.map(z => z.color),
        borderWidth: 1,
        borderRadius: 4,
      }]
    },
    options: chartOpts({
      plugins: { legend: { display: false } },
      scales: { y: { title: { display: true, text: 'min' } } }
    })
  });
}

// ─── zone bars (inline HTML) ─────────────────────────────────────────────────
function zoneBarsHTML(zones) {
  const total = zones.reduce((s,z) => s+z.secs, 0);
  if (!total) return '';
  return zones.filter(z => z.secs > 0).map(z => `
    <div class="flex items-center gap-2">
      <span class="text-xs w-28 opacity-60 shrink-0">${z.name}</span>
      <div class="flex-1 bg-base-300 rounded-full overflow-hidden" style="height:6px">
        <div class="zone-bar" style="width:${(z.secs/total*100).toFixed(1)}%;background:${z.color}"></div>
      </div>
      <span class="text-xs w-10 text-right opacity-60 shrink-0">${fmtTime(z.secs)}</span>
    </div>
  `).join('');
}

// ─── activity detail HTML ─────────────────────────────────────────────────────
function buildDetailHTML(a, detail) {
  const sport = normSport(a.activityType && a.activityType.typeKey);
  const s = detail.summaryDTO || {};
  const splits = (detail.splitSummaries || []).filter(sp => sp.distance > 0 || sp.duration > 0);
  const meta = detail.metadataDTO || {};

  // metrics grid
  const metrics = [
    ['Avg HR',       a.averageHR ? Math.round(a.averageHR)+' bpm' : null, '#f472b6'],
    ['Max HR',       a.maxHR ? Math.round(a.maxHR)+' bpm' : null, '#fb923c'],
    ['Min HR',       s.minHR ? Math.round(s.minHR)+' bpm' : null, '#38bdf8'],
    ['Avg Power',    (s.averagePower||a.avgPower) ? Math.round(s.averagePower||a.avgPower)+' W' : null, '#facc15'],
    ['Norm Power',   (s.normalizedPower||a.normPower) ? Math.round(s.normalizedPower||a.normPower)+' W' : null, '#facc15'],
    ['Max Power',    (s.maxPower||a.maxPower) ? Math.round(s.maxPower||a.maxPower)+' W' : null, '#fb923c'],
    ['Pace',         fmtSpeed(s.averageSpeed||a.averageSpeed, sport)],
    ['Max Pace',     fmtSpeed(s.maxSpeed||a.maxSpeed, sport)],
    ['Cadence',      (s.averageRunCadence||a.averageRunningCadenceInStepsPerMinute) ? Math.round(s.averageRunCadence||a.averageRunningCadenceInStepsPerMinute)+' spm' : null],
    ['Max Cadence',  a.maxRunningCadenceInStepsPerMinute ? a.maxRunningCadenceInStepsPerMinute+' spm' : null],
    ['Stride',       (s.strideLength||a.avgStrideLength) ? ((s.strideLength||a.avgStrideLength)/100).toFixed(2)+' m' : null],
    ['Gnd Contact',  (s.groundContactTime||a.avgGroundContactTime) ? Math.round(s.groundContactTime||a.avgGroundContactTime)+' ms' : null],
    ['Vert Osc',     (s.verticalOscillation||a.avgVerticalOscillation) ? (s.verticalOscillation||a.avgVerticalOscillation).toFixed(1)+' cm' : null],
    ['Vert Ratio',   (s.verticalRatio||a.avgVerticalRatio) ? (s.verticalRatio||a.avgVerticalRatio).toFixed(1)+'%' : null],
    ['Trng Load',    (s.activityTrainingLoad||a.activityTrainingLoad) ? Math.round(s.activityTrainingLoad||a.activityTrainingLoad) : null, '#818cf8'],
    ['Calories',     (s.calories||a.calories) ? (s.calories||a.calories)+' kcal' : null],
    ['Body Battery', (s.differenceBodyBattery!=null?s.differenceBodyBattery:a.differenceBodyBattery)!=null ? ((s.differenceBodyBattery!=null?s.differenceBodyBattery:a.differenceBodyBattery)>0?'+':'')+String(s.differenceBodyBattery!=null?s.differenceBodyBattery:a.differenceBodyBattery) : null,
      (s.differenceBodyBattery!=null?s.differenceBodyBattery:a.differenceBodyBattery) > 0 ? '#4ade80' : '#f87171'],
    ['Stamina Start',s.beginPotentialStamina ? s.beginPotentialStamina+'%' : null],
    ['Stamina End',  s.endPotentialStamina   ? s.endPotentialStamina+'%'   : null],
    ['Total Work',   s.totalWork   ? s.totalWork.toFixed(1)+' kJ' : null],
    ['Impact Load',  s.impactLoad  ? s.impactLoad.toLocaleString() : null],
    ['Hydration',    s.waterEstimated ? s.waterEstimated+' ml' : null],
    ['Workout Feel', s.directWorkoutFeel ? s.directWorkoutFeel+'/100' : null],
    ['RPE',          s.directWorkoutRpe  ? s.directWorkoutRpe+'/100'  : null],
    ['Steps',        (s.steps||a.steps) ? (s.steps||a.steps).toLocaleString() : null],
    ['Mod Intensity',s.moderateIntensityMinutes ? s.moderateIntensityMinutes+' min' : null],
    ['Vig Intensity',s.vigorousIntensityMinutes ? s.vigorousIntensityMinutes+' min' : null],
    ['Laps',         meta.lapCount!=null ? meta.lapCount : null],
  ].filter(([,v]) => v && v !== '—');

  const metricsHTML = `
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2">
      ${metrics.map(([label,value,color]) => `
        <div class="bg-base-300 rounded-lg p-2.5">
          <div class="text-xs opacity-50 mb-0.5">${label}</div>
          <div class="font-bold text-sm" ${color?`style="color:${color}"`:''}>${esc(value)}</div>
        </div>
      `).join('')}
    </div>
  `;

  // training effect
  let effectHTML = '';
  if (a.aerobicTrainingEffect > 0 || a.anaerobicTrainingEffect > 0) {
    effectHTML = `
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${a.aerobicTrainingEffect > 0 ? `
          <div class="bg-base-300 rounded-lg p-3">
            <div class="text-xs opacity-50 mb-1">Aerobic Training Effect</div>
            <div class="flex items-center gap-3">
              <div class="text-3xl font-black text-success">${a.aerobicTrainingEffect.toFixed(1)}</div>
              <div>
                <div class="font-bold text-sm text-success capitalize">${esc((a.trainingEffectLabel||'').toLowerCase())}</div>
                <div class="text-xs opacity-50">${esc((a.aerobicTrainingEffectMessage||'').replace(/_/g,' ').toLowerCase())}</div>
              </div>
            </div>
          </div>
        ` : ''}
        ${a.anaerobicTrainingEffect > 0 ? `
          <div class="bg-base-300 rounded-lg p-3">
            <div class="text-xs opacity-50 mb-1">Anaerobic Training Effect</div>
            <div class="flex items-center gap-3">
              <div class="text-3xl font-black text-warning">${a.anaerobicTrainingEffect.toFixed(1)}</div>
              <div class="text-xs opacity-50">${esc((a.anaerobicTrainingEffectMessage||'').replace(/_/g,' ').toLowerCase())}</div>
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }

  // HR + power zones
  const hrZones  = HR_ZONES.map((z,i) => ({ ...z, secs: a['hrTimeInZone_'+(i+1)] || 0 }));
  const pwrZones = HR_ZONES.map((z,i) => ({ name:'PZ'+(i+1), color:z.color, secs: a['powerTimeInZone_'+(i+1)] || 0 }));
  const hasHR  = hrZones.some(z => z.secs > 0);
  const hasPwr = pwrZones.some(z => z.secs > 0);
  let zonesHTML = '';
  if (hasHR || hasPwr) {
    zonesHTML = `
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        ${hasHR ? `<div><div class="text-xs font-semibold opacity-50 uppercase tracking-wider mb-2">Heart Rate Zones</div>${zoneBarsHTML(hrZones)}</div>` : ''}
        ${hasPwr ? `<div><div class="text-xs font-semibold opacity-50 uppercase tracking-wider mb-2">Power Zones</div>${zoneBarsHTML(pwrZones)}</div>` : ''}
      </div>
    `;
  }

  // splits table
  let splitsHTML = '';
  if (splits.length > 0) {
    splitsHTML = `
      <div>
        <div class="text-xs font-semibold opacity-50 uppercase tracking-wider mb-2">Intervals &amp; Splits</div>
        <div class="overflow-x-auto">
          <table class="table table-xs w-full">
            <thead><tr>
              <th>Type</th><th>n</th><th>Dist</th><th>Time</th><th>Pace</th>
              <th>Avg HR</th><th>Max HR</th><th>Avg W</th><th>NP</th>
              <th>Cadence</th><th>Stride</th><th>Vert Osc</th><th>GCT</th><th>Cal</th>
            </tr></thead>
            <tbody>
              ${splits.map(sp => {
                const m = SPLIT_META[sp.splitType] || { label: sp.splitType, color: '#888' };
                return `
                  <tr>
                    <td><span class="badge badge-xs badge-outline" style="border-color:${m.color}80;color:${m.color}">${m.label}</span></td>
                    <td class="opacity-40">${sp.noOfSplits||1}</td>
                    <td>${fmtDist(sp.distance)}</td>
                    <td>${fmtTime(sp.movingDuration||sp.duration)}</td>
                    <td class="font-mono text-xs">${fmtSpeed(sp.averageMovingSpeed||sp.averageSpeed, sport)}</td>
                    <td>${sp.averageHR ? Math.round(sp.averageHR) : '—'}</td>
                    <td>${sp.maxHR ? Math.round(sp.maxHR) : '—'}</td>
                    <td>${sp.averagePower ? Math.round(sp.averagePower)+'W' : '—'}</td>
                    <td>${sp.normalizedPower ? Math.round(sp.normalizedPower)+'W' : '—'}</td>
                    <td>${sp.averageRunCadence ? Math.round(sp.averageRunCadence) : '—'}</td>
                    <td>${sp.strideLength ? (sp.strideLength/100).toFixed(2)+'m' : '—'}</td>
                    <td>${sp.verticalOscillation ? sp.verticalOscillation.toFixed(1)+'cm' : '—'}</td>
                    <td>${sp.groundContactTime ? Math.round(sp.groundContactTime)+'ms' : '—'}</td>
                    <td>${sp.calories||'—'}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }

  const descHTML = a.description ? `
    <div class="text-xs opacity-40 italic border-l-2 border-base-300 pl-3">${esc(a.description)}</div>
  ` : '';

  return `
    <div class="px-4 pb-5 pt-4 space-y-4 border-t border-base-300">
      ${metricsHTML}${effectHTML}${zonesHTML}${splitsHTML}${descHTML}
    </div>
  `;
}

// ─── render activity list ─────────────────────────────────────────────────────
function renderActivities(activities) {
  document.getElementById('activity-count').textContent = activities.length + ' loaded · tap to expand';

  const rows = activities.slice(0, 50).map(a => {
    const sport = normSport(a.activityType && a.activityType.typeKey);
    const { color, icon } = SPORT[sport] || SPORT.other;
    const id = 'act-' + a.activityId;

    return `
      <div class="border-b border-base-300 last:border-0">
        <div class="row-toggle px-4 py-3 flex items-center gap-3" data-id="${esc(String(a.activityId))}">
          <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background:${color}20">
            <i class="ph-bold ${icon} text-sm" style="color:${color}"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="font-medium text-sm truncate">${esc(a.activityName||sport)}</div>
            <div class="text-xs opacity-50">${fmtDate(a.startTimeLocal)}</div>
          </div>
          <div class="hidden sm:flex items-center gap-5 text-right shrink-0">
            ${a.distance > 0 ? `
              <div>
                <div class="text-sm font-bold" style="color:${color}">${fmtDist(a.distance)}</div>
                <div class="text-xs opacity-40">${fmtTime(a.movingDuration||a.duration)}</div>
              </div>` : (!a.distance && a.movingDuration > 0 ? `<div class="text-sm font-bold">${fmtTime(a.movingDuration)}</div>` : '')}
            ${a.averageHR > 0 ? `
              <div>
                <div class="text-sm font-bold" style="color:#f472b6">${a.averageHR} bpm</div>
                <div class="text-xs opacity-40">avg HR</div>
              </div>` : ''}
            ${a.averageSpeed > 0 && a.distance > 0 ? `
              <div class="hidden md:block">
                <div class="text-sm font-mono">${fmtSpeed(a.averageSpeed, sport)}</div>
                <div class="text-xs opacity-40">pace</div>
              </div>` : ''}
            ${a.activityTrainingLoad > 0 ? `
              <div class="hidden lg:block">
                <div class="text-sm font-bold" style="color:#818cf8">${Math.round(a.activityTrainingLoad)}</div>
                <div class="text-xs opacity-40">load</div>
              </div>` : ''}
            ${a.trainingEffectLabel ? `<span class="badge badge-sm badge-outline opacity-50 hidden xl:inline-flex capitalize">${esc(a.trainingEffectLabel.toLowerCase())}</span>` : ''}
          </div>
          <div class="ml-2 shrink-0 opacity-40">
            <i class="ph-bold ph-caret-down text-sm chevron-icon" id="chev-${esc(String(a.activityId))}"></i>
          </div>
        </div>
        <div class="detail-panel" id="${id}">
          <div class="px-4 pb-3 flex items-center gap-2 opacity-40 text-sm">
            <span class="loading loading-spinner loading-xs"></span> Loading…
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('activity-list').innerHTML = rows;

  // store activity data for lookup
  window._activityMap = {};
  for (const a of activities) {
    window._activityMap[a.activityId] = a;
  }

  // attach toggle listeners
  document.querySelectorAll('.row-toggle').forEach(row => {
    row.addEventListener('click', async () => {
      const actId = row.dataset.id;
      const panel = document.getElementById('act-' + actId);
      const chev  = document.getElementById('chev-' + actId);
      const isOpen = panel.classList.contains('open');

      if (isOpen) {
        panel.classList.remove('open');
        chev.classList.remove('open');
      } else {
        panel.classList.add('open');
        chev.classList.add('open');
        if (!panel.dataset.loaded) {
          panel.dataset.loaded = '1';
          try {
            const detail = await api('/api/activities/' + actId);
            const activity = window._activityMap[actId];
            panel.innerHTML = buildDetailHTML(activity, detail);
          } catch(e) {
            panel.innerHTML = `<div class="px-4 pb-3 text-xs opacity-50 text-error">Failed to load detail.</div>`;
          }
        }
      }
    });
  });
}

// ─── main ─────────────────────────────────────────────────────────────────────
async function main() {
  const today = new Date().toISOString().slice(0,10);

  const [athlete, activities, weekly, daily] = await Promise.all([
    api('/api/athlete'),
    api('/api/activities?limit=200'),
    api('/api/stats/weekly'),
    api('/api/stats/daily?date=' + today).catch(() => ({})),
  ]);

  // navbar
  const name = athlete.fullName || 'Athlete';
  document.getElementById('nav-name').textContent = name;
  if (athlete.profileImageUrlSmall) {
    document.getElementById('nav-avatar').innerHTML = `
      <div class="w-9 rounded-full ring ring-primary ring-offset-base-100 ring-offset-1 overflow-hidden">
        <img src="${esc(athlete.profileImageUrlSmall)}" alt="avatar" class="w-full h-full object-cover">
      </div>
    `;
  }

  const acts = Array.isArray(activities) ? activities : [];

  renderWellness(daily || {});
  renderWeekly((weekly && weekly.by_sport) || {});
  renderVolumeChart(acts);
  renderHRChart(acts);
  renderLoadChart(acts);
  renderZoneChart(acts[0]);
  renderActivities(acts);
}

main().catch(err => {
  console.error('Dashboard load error:', err);
  document.getElementById('activity-list').innerHTML = `
    <div class="p-6 text-center">
      <div class="alert alert-error max-w-md mx-auto">
        <i class="ph-bold ph-warning-circle text-xl"></i>
        <span>Load failed: ${esc(err.message)}</span>
      </div>
    </div>
  `;
});
</script>

</body>
</html>
